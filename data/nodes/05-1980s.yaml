  summary: "Practical extraction and reporting: sh, awk, sed and C folded into one. The glue language of early web CGI; its regex syntax became the de facto standard (PCRE)."
  relations:
    - { type: influenced_by, to: awk, aspects: [associative-arrays, regular-expressions], weight: strong, confidence: high }
    - { type: influenced_by, to: sed, aspects: [regular-expressions], weight: moderate, confidence: medium, sources: [wiki-sed], note: "Wikipedia's sed infobox lists Perl as influenced; Perl kept the s/// syntax." }
