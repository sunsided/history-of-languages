- id: schickard-calculating-clock
  name: Schickard's calculating clock
  aliases: [Rechenuhr]
  kind: mechanism
  category: scientific
  cluster: prehistory/mechanisms
  origin:
    first_appeared: { year: 1623, precision: year, note: "Reported \"In 1623 and 1624, in two letters that he sent to Kepler\"." }
  creators:
    - { name: Wilhelm Schickard, role: inventor }
  status: extinct
  summary: >
    "an adding machine, operated by rotating knobs for input". It "could add and subtract six-digit
    numbers, and indicated an overflow of this capacity by ringing a bell", with Napier's bones for
    multiplication. The machine "was destroyed in a fire either whilst still incomplete, or in any case
    before delivery"; Bruno von Freytag-Löringhoff built a replica in 1960.
  notes: >
    "Taton has argued that Schickard's work had no impact on the development of mechanical calculators",
    and Pascal's invention "was almost certainly independent".
  research_status: stub
  confidence: medium
  links: { wikipedia: "https://en.wikipedia.org/wiki/Wilhelm_Schickard" }
  sources: [wiki-wilhelm-schickard]

