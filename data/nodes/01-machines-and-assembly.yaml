  relations:
    - { type: targets, to: arm, weight: strong, confidence: high }
  research_status: stub
  confidence: high
  sources: [wiki-arm]
  example:
    title: GCD without branches in the loop body
    language: ARM assembly (A32)
    note: 'The textbook example of conditional execution: SUBGT and SUBLT only execute when the preceding CMP set the matching flags, so the loop needs a single branch.'
    code: |
      gcd:    CMP    r0, r1
              SUBGT  r0, r0, r1
              SUBLT  r1, r1, r0
              BNE    gcd
              BX     lr
    sources: [wiki-arm]

