    title: use and case
    language: Gleam 1.0
    note: "From the Gleam v1 announcement. use flattens callbacks (each use line takes the rest of the block as a function); result.try chains steps that may fail, and case matches on the Result."
    code: |
      import gleam/json
      import gleam/result.{try}
      import my_app/person
      import wisp.{type Request, type Response}

      pub fn handle_request(req: Request, ctx: Context) -> Response {
        use json <- wisp.require_json(req)

        let result = {
          use data <- try(person.decode(json))
          use row <- try(person.insert(ctx.db, data))
          Ok(person.to_json(row))
        }

        case result {
          Ok(json) -> wisp.json_response(json, 201)
          Error(_) -> wisp.unprocessable_entity()
        }
      }
