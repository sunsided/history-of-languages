    - { name: Michael Stonebraker, role: designer }
  status: legacy
  tags:
    paradigm: [declarative, query]
    features: [set-based]
    domain: [databases]
  summary: >
    The query language of Berkeley's INGRES, "based on tuple relational calculus, with some similarities to SQL"
    and on Codd's never-implemented DSL ALPHA. Queries range tuple variables over relations; aggregation was
    unusually strong. When Oracle and DB2 won the market in the early 1980s, INGRES moved to SQL; POSTQUEL
    carried the language into Postgres.
  notes: >
    Wikipedia's infobox names Stonebraker as designer; its body says "Eugene Wong of Ingres was the creator of
    QUEL". Both are listed. ALPHA is not a node.
  relations:
    - { type: influenced_by, to: codd-relational-model, weight: strong, confidence: high, sources: [wiki-quel], note: "\"based on Codd's earlier suggested but not implemented Data Sub-Language ALPHA\"." }
  research_status: draft
  confidence: medium
