  sources: [wiki-kornshell]
  example:
    title: ksh93 additions
    language: ksh93
    note: "Written for this dataset. typeset -A declares an associative array, float a floating-point variable (both ksh93); print is ksh's echo. Run with ksh93: prints Paris 3, then hello, world."
    code: |
      typeset -A capital=([de]=Berlin [fr]=Paris)   # associative array (ksh93)
      float x=1.5                                    # floating-point arithmetic (ksh93)
