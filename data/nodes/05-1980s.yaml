    paradigm: [imperative, structured, procedural]
    typing: [static-typing]
    domain: [education]
  summary: >
    A Pascal-family language from the University of Toronto, "designed to help students taking their first
    computer science course learn how to code": "a descendant of Pascal, Euclid, and SP/k with a clean syntax and
    precise machine-independent semantics". Holt Software Associates developed it further.
  notes: >
    Euclid and SP/k (also Toronto) are not nodes yet; SP/k is in the education backlog.
  relations:
    - { type: influenced_by, to: pascal, weight: strong, confidence: high, sources: [wiki-turing-language], note: "\"a descendant of Pascal, Euclid, and SP/k\"" }
  research_status: draft
  confidence: medium
  links: { wikipedia: "https://en.wikipedia.org/wiki/Turing_(programming_language)" }
  sources: [wiki-turing-language]
  example:
    title: Factorial with input checking
    language: Turing
    note: "From Wikipedia's Turing article, which our copy renders on one line; line breaks and indentation are restored at statement boundaries and the comment marker is shown as %, Turing's line comment. Tokens are unchanged."
    code: |
      % Accepts a number and calculates its factorial
      function factorial (n: int) : real
          if n = 0 then
              result 1
          else
              result n * factorial (n - 1)
          end if
      end factorial

      var n: int
      loop
          put "Please input an integer: " ..
          get n
          exit when n >= 0
          put "Input must be a non-negative integer."
      end loop

      put "The factorial of ", n, " is ", factorial (n)
