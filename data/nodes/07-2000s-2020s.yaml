    note: Dart's single-threaded event loop runs async functions; await suspends on a Future, await for on a Stream. Real parallelism uses isolates, which share no memory.
    code: |
      Future<String> fetch(String name, int ms) async {
        await Future.delayed(Duration(milliseconds: ms));
        return '$name done';
      }

      Stream<int> countdown(int n) async* {
        for (var i = n; i > 0; i--) yield i;
      }

      Future<void> main() async {
        print(await Future.wait([fetch('a', 200), fetch('b', 100)]));
        await for (final i in countdown(3)) print(i);
      }
    sources: [wiki-dart]

