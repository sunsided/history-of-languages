  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/JOVIAL" }
  sources: [schwartz-1978-jovial, wiki-jovial]
  example:
    title: Table lookup in J73
    language: JOVIAL J73
    note: "From Wikipedia, citing the Computer Programming Manual for the JOVIAL (J73) Language. ITEM declares a scalar (U unsigned, F floating); a single statement after IF or FOR needs no BEGIN. Indentation was lost in fetching and is ours."
    code: |
      PROC RETRIEVE(CODE:VALUE);
        BEGIN
        ITEM CODE U;
        ITEM VALUE F;
        VALUE = -99999.;
        FOR I:0 BY 1 WHILE I<1000;
          IF CODE = TABCODE(I);
            BEGIN
            VALUE = TABVALUE(I);
            EXIT;
            END
        END
    sources: [wiki-jovial]

