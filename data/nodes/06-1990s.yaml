  aliases: ["Kaleidoscope'90", "Kaleidoscope'91", "Kaleidoscope'93"]
  kind: language
  category: research
  cluster: oop
  origin:
    first_appeared: { year: 1990, precision: circa, note: "No year in the text; the earliest of the three versions is named Kaleidoscope'90, and the papers are dated 1993 and 1994." }
  creators:
