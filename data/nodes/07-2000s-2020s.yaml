  summary: "Pragmatic JVM language from the makers of IntelliJ. Its suspend functions are async/await with implicit awaiting; it popularized structured concurrency."
  relations:
    - { type: influenced_by, to: java, weight: strong, confidence: high }
    - { type: influenced_by, to: scala, weight: strong, confidence: high }
    - { type: influenced_by, to: csharp, weight: moderate, confidence: high }
    - { type: influenced_by, to: groovy, weight: weak, confidence: medium }
  research_status: draft
  confidence: high
  sources: [wiki-kotlin]
  example:
    title: Suspend functions and structured concurrency
    language: Kotlin (kotlinx.coroutines)
    note: 'suspend functions are async without an await keyword: calling one is a suspension point. coroutineScope does not return until both async children finish, which is structured concurrency.'
    code: |
      import kotlinx.coroutines.*

      suspend fun fetch(name: String, ms: Long): String {
          delay(ms)
          return "$name done"
      }

      fun main() = runBlocking {
          val results = coroutineScope {
              val a = async { fetch("a", 200) }
              val b = async { fetch("b", 100) }
              listOf(a.await(), b.await())
          }
          println(results)   // [a done, b done]
      }
    sources: [wiki-kotlin]

