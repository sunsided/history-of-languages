    - { version: "day 25", year: 2016, summary: "out x transmits a value as the next clock-signal bit." }
  summary: >
    "Assembunny code": a four-register toy assembly (cpy, inc, dec, jnz with relative jumps) from Advent of
    Code 2016. Later puzzles reused it: day 23 added tgl, which rewrites another instruction at run time, and day
    25 added out to emit a clock signal, so solvers kept extending one interpreter.
  research_status: draft
