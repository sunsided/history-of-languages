    - { type: influenced_by, to: csp, aspects: [synchronous-rendezvous], weight: moderate, confidence: medium }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Ada_(programming_language)" }
  sources: [whitaker-1993-ada]
  example:
    title: Tasks and rendezvous
    language: Ada
    note: 'A task is a thread declared in the language. Greet is an entry: the caller blocks until the task reaches its accept statement, and both proceed after the rendezvous, as in CSP.'
    code: |
      with Ada.Text_IO; use Ada.Text_IO;

      procedure Main is
         task Greeter is
            entry Greet (Name : String);
         end Greeter;

         task body Greeter is
         begin
            accept Greet (Name : String) do
               Put_Line ("Hello, " & Name);
            end Greet;
         end Greeter;
      begin
         Greeter.Greet ("world");
      end Main;
    sources: [whitaker-1993-ada]
