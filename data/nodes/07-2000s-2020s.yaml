    language: LFE
    note: "From lfe.io. A defun with several clauses matches its arguments like an Erlang function head."
    code: |
      ;; A recursive function with pattern matching:
      (defun ackermann
        ((0 n) (+ n 1))
        ((m 0) (ackermann (- m 1) 1))
        ((m n) (ackermann (- m 1)
                          (ackermann m (- n 1)))))
