    A Windows automation language. Jonathan Bennett
    released it in 1999; from version 3 it became "a general-purpose, third-generation programming language" with
    BASIC-like syntax and a variant data type.
  relations:
    - { type: influenced_by, to: basic, weight: moderate, confidence: high, sources: [wiki-autoit], note: "Infobox: influenced by BASIC." }
  research_status: stub
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/AutoIt", homepage: "https://www.autoitscript.com/" }
  sources: [wiki-autoit]
  example:
    title: Average of an array
    language: AutoIt v3
    note: "From Wikipedia's AutoIt article; the fetched copy had lost its indentation, which is restored here."
    sources: [wiki-autoit]
    code: |
      Func _Find_Average($aArray)
          ; If the input is not of the correct type (an array), then return an error along with the details.
          If Not IsArray($aArray) Then Return SetError(1, 0, VarGetType($aArray))
          ; More detailed checks are possible, but for brevity just one is performed here.
          ; Declare a variable to store the sum of the numbers.
          Local $iArraySum = 0
          ; Loop through the array.
          For $i = 1 To $aArray[0]
              ; Increment the sum by the number in each array element.
              $iArraySum += Number($aArray[$i])
          Next
          ; Return the average rounded to 2 decimal places.
          Return Round($iArraySum / $aArray[0], 2)
      EndFunc ;==>_Find_Average

