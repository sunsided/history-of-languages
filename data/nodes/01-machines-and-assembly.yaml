  example:
    title: Print a string
    language: 6502 assembly (Apple II)
    note: X indexes the string; BEQ stops at the zero terminator. JSR $FDED calls the Apple II monitor's COUT routine, which expects characters with the high bit set, hence the ORA.
    code: |2
              LDX #0
      LOOP    LDA MSG,X
              BEQ DONE
              ORA #$80
              JSR $FDED     ; COUT
              INX
              BNE LOOP
      DONE    RTS
      MSG     .BYTE "HELLO",0
    sources: [wiki-6502]

