    title: IAL's for statement and in-line functions
    language: ALGOL 58 (IAL)
    year: 1958
    note: 'Syntax forms as described on Wikipedia: IAL''s loop was written base(increment)limit, after Rutishauser''s Superplan; ALGOL 60 replaced it with step … until. IAL also introduced := for assignment beside = for equality. The one-line function definition was dropped from ALGOL 60. Statement layout around the fragments is illustrative.'
    code: |
      f(x) := x / 2;

      s := 0;
      for i := 1 (1) n;
         s := s + a[i]

      comment ALGOL 60 form:  for i := 1 step 1 until n do s := s + a[i]
    sources: [wiki-algol-58, perlis-1978-american-algol]

