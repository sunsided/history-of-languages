- id: binary-lambda-calculus
  name: Binary lambda calculus
  aliases: [BLC]
  kind: language
  category: esoteric
  cluster: esoteric/combinators
  origin:
    first_appeared: { year: 2004, precision: year, note: "\"invented by John Tromp in 2004\"; described in his 2008 chapter in Randomness and Complexity." }
  creators: [{ name: John Tromp, role: designer }]
  status: historical
  tags:
    paradigm: [functional, purely-functional]
    features: [minimalism]
  summary: >
    "A minimal, pure functional programming language" "based on a binary encoding of the untyped lambda calculus in
    De Bruijn index notation", designed "to provide a very simple and elegant concrete definition of descriptional
    complexity (Kolmogorov complexity)". Programs are self-delimiting bit strings with I/O; Tromp's self-interpreter
    is a few hundred bits.
  relations:
    - { type: influenced_by, to: lambda-calculus, weight: strong, confidence: high, sources: [tromp-blc] }
  research_status: draft
  confidence: high
  links: { homepage: "https://tromp.github.io/cl/Binary_lambda_calculus.html" }
  sources: [tromp-blc, esolangs-blc]
  example:
    title: The encoding
    language: Binary lambda calculus
    note: "From Tromp's page (\"Lambda encoding\"): abstraction is 00, application 01, and variable i (a De Bruijn index) is i ones followed by a zero."
    code: |
      blc(λM) = 00 blc(M)
      blc(M N) = 01 blc(M) blc(N)
      blc(i) = 1i0
    sources: [tromp-blc]

