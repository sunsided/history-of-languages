- id: edsac-initial-orders
  name: EDSAC Initial Orders
  kind: assembly
  category: systems
  cluster: assembly/early
  origin:
    first_appeared: { year: 1949, precision: year }
    places: [{ institution: University of Cambridge Mathematical Laboratory, city: Cambridge, country: GB }]
  creators: [{ name: David Wheeler, role: designer }]
  status: extinct
  summary: "Bootstrap program wired into EDSAC that read mnemonic, single-letter instructions with decimal addresses from paper tape and assembled them into memory. The first assembler in practical use; Initial Orders 2 (1949) added relocation for subroutines."
  relations:
    - { type: targets, to: edsac, weight: strong, confidence: high }
  research_status: draft
  confidence: high
  sources: [wilkes-wheeler-gill-1951, wiki-edsac]
  example:
    title: Add two numbers
    language: EDSAC orders read by Initial Orders 2
    year: 1949
    note: 'Initial Orders 2 read these letters and decimal addresses from tape and assembled them into memory as it loaded them: a 1949 assembler in 41 words. T 56 K sets the load address; T n F stores and clears the accumulator; Z F stops.'
    code: |
      T 56 K      load the following orders from location 56
      A 70 F      acc += [70]
      A 71 F      acc += [71]
      T 72 F      [72] := acc; acc := 0
      Z F         stop
    sources: [wilkes-wheeler-gill-1951]

- id: soap
  name: SOAP (Symbolic Optimal Assembly Program)
  kind: assembly
  category: general
  cluster: assembly/ibm
  origin: { first_appeared: { year: 1955, precision: year }, places: [{ institution: IBM, country: US }] }
  creators: [{ name: Stan Poley, role: designer }]
  status: extinct
  summary: "Assembler for the drum-memory IBM 650 that placed each instruction on the drum to minimise rotational delay."
  relations:
    - { type: targets, to: ibm-650, weight: strong, confidence: high }
  research_status: stub
  confidence: medium
  sources: [wiki-ibm-650]
  example:
    title: C = A + B, placed by the assembler
    language: SOAP (symbolic, illustrative)
    note: 'Illustrative: mnemonics follow the 650 operation table (65 RAL, 15 AL, 20 STL, 01 STOP); exact SOAP II spellings have not been checked against a SOAP manual. The point is the blank next-address column: SOAP filled it in, placing each instruction where the drum would be when the previous one finished.'
    code: |
      loc   op    data  next
            RAL   A
            AL    B
            STL   C
            STOP
      A     …
      B     …
      C     …
    sources: [wiki-ibm-650]

- id: sap-704
