  summary: >
    A Lisp that compiles to Lua: "Anywhere you can run Lua code, you can run Fennel code", with runtime
    semantics that are a subset of Lua's, plus macros and destructuring. Used for game scripting
    (LÖVE, TIC-80) and other embedded-Lua settings.
  notes: >
    Phil Hagelberg is widely known as its later maintainer, but no page read for this entry says so.
  relations:
    - { type: dialect_of, to: lisp, weight: strong, confidence: high, sources: [fennel-rationale], note: "\"Fennel belongs to the Lisp family of programming languages.\"" }
    - { type: influenced_by, to: lua, weight: strong, confidence: high, sources: [fennel-rationale], note: "\"the runtime semantics of Fennel are a subset of Lua's\"." }
  research_status: draft
  confidence: low
  links: { homepage: "https://fennel-lang.org" }
  sources: [fennel-lang-org, fennel-rationale]
  example:
    title: Moving a player in LÖVE
    language: Fennel
    note: "From fennel-lang.org. Tables use {:key value}, destructuring works in each and let, and (world:move ...) is Lua's method call."
    code: |
      ;; Sample: read the state of the keyboard and move the player accordingly
      (local dirs {:up [0 -1] :down [0 1] :left [-1 0] :right [1 0]})

      (each [key [dx dy] (pairs dirs)]
        (when (love.keyboard.isDown key)
          (let [[px py] player
                x (+ px (* dx player.speed dt))
                y (+ py (* dy player.speed dt))]
            (world:move player x y))))
    sources: [fennel-lang-org]

- id: janet
  name: Janet
  kind: language
  category: scripting
  cluster: lisp
  origin:
    first_appeared: { year: 2017, precision: circa, note: "Copyright notices start in 2017; a first-release date has not been found." }
  creators:
