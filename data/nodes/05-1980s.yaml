    domain: [education]
  milestones:
    - { version: BBC BASIC for Windows, year: 2001 }
  summary: >
    Acorn's BASIC for the BBC Micro, grown from Atom BASIC with structured constructs: named procedures and
    functions with LOCAL variables, REPEAT loops and an inline 6502 assembler. On the Archimedes, BASIC V gained
    an ARM assembler and block structure. It taught a generation of British schoolchildren and lives on in
    Richard Russell's ports.
  notes: >
    "Initially the BBC specified compatibility with Microsoft BASIC", but Acorn's own structured design won.
    Atom BASIC is not a node. BASIC V (Archimedes) replaced the 6502 assembler with an ARM one; its year is
    not given in the article.
  relations:
    - { type: influenced_by, to: microsoft-basic, weight: weak, confidence: medium, sources: [wiki-bbc-basic], note: "The BBC's initial specification asked for Microsoft BASIC compatibility." }
  research_status: draft
  confidence: medium
  links: { wikipedia: "https://en.wikipedia.org/wiki/BBC_BASIC" }
  sources: [wiki-bbc-basic]
  example:
    title: A procedure with LOCAL variables (BASIC V)
    language: BBC BASIC V
    note: "From Wikipedia (Acorn Archimedes version). DEF PROC defines a named procedure; % marks integers, & hex; MOVE/DRAW/PLOT call the OS graphics. Line numbers are optional in BASIC V. Indentation is ours."
    code: |
      REM Acorn Archimedes version
      ON ERROR : ON ERROR OFF : PRINT REPORT$; " at line ";ERL : END
      MODE MODE : REM clears the screen
      PROC_triangle(700,700,500,200,500,900,"F")
      END
      DEF PROC_triangle(x1%,y1%,x2%,y2%,x3%,y3%,fill$)
        LOCAL triangle_fill_plot_code%
        triangle_fill_plot_code% = &55
        MOVE x1%,y1%
        DRAW x2%,y2%
        IF fill$="F" THEN
          PLOT triangle_fill_plot_code%,x3%,y3%
        ELSE
          DRAW x3%,y3% : DRAW x1%,y1%
        ENDIF
      ENDPROC : REM of PROC_triangle()
    sources: [wiki-bbc-basic]

