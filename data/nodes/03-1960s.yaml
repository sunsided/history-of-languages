- id: cpl
  name: CPL
  aliases: ["Combined Programming Language"]
  kind: language
  category: general
  cluster: algol/bcpl-line
  origin:
    first_appeared: { year: 1963, precision: year }
    places: [{ institution: University of Cambridge and University of London, country: GB }]
  creators:
    - { name: Christopher Strachey, role: designer }
    - { name: David Barron, role: designer }
  status: extinct
  tags:
    paradigm: [imperative, procedural]
    typing: [static-typing]
  summary: "Ambitious ALGOL-derived language for both scientific and commercial use; too large to implement fully in its day. Its stripped-down core became BCPL."
  relations:
    - { type: influenced_by, to: algol-60, weight: strong, confidence: high }
  research_status: draft
  confidence: high
  sources: [ritchie-1993-development-c]
  example:
    title: MAX over a list
    language: CPL
    note: A CPL formulation by Peter Norvig, as given on Wikipedia (layout reconstructed). § and §⃒ are CPL's section brackets, the ancestors of BCPL's $( $) and C's { }. 'value of' turns a block into an expression, as BCPL's VALOF later did; := assigns, including simultaneous assignment to a pair.
    code: |
      Max(Items, ValueFunction) = value of
      §  (Best, BestVal) = (NIL, -∞)
         while Items do §
            (Item, Val) = (Head(Items), ValueFunction(Head(Items)))
            if Val > BestVal then (Best, BestVal) := (Item, Val)
            Items := Rest(Items) §⃒
         result is Best §⃒
    sources: [wiki-cpl]

