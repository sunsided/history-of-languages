  example:
    title: Types by annotation
    language: asm.js
    note: "From the Wikipedia asm.js article: the compiled form of the C function int f(int i) { return i + 1; }. Each |0 coerces to a 32-bit integer, which is how asm.js declares types."
    code: |
      function f(i) {
        i = i | 0;
        return (i + 1) | 0;
      }
    sources: [wiki-asmjs]

