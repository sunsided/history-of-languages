    - { version: 8K BASIC, year: 1975, summary: "String variables, RND, Boolean operators, PEEK and POKE. The basis for most home-computer BASICs." }
    - { version: Extended BASIC, year: 1975, summary: "Double precision, IF … THEN … ELSE, user-defined functions, PRINT USING." }
