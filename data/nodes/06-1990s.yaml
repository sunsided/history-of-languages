- id: z-plus-plus
  name: Z++
  kind: notation
  category: research
  cluster: verification
  origin:
    first_appeared: { year: 1990, precision: year, note: "Lano, \"Z++, an Object-Oriented Extension to Z\", Z User Workshop, Oxford 1990 (proceedings 1991)." }
  creators:
