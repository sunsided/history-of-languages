    concurrency: [channels, threads, processes]
  summary: "Compiled concurrent C-like language for Plan 9 with channels, procs and tasks. Dropped because maintaining its compiler cost too much; its ideas went into Limbo and the libthread C library."
  relations:
    - { type: influenced_by, to: newsqueak, aspects: [channels], weight: strong, confidence: high }
    - { type: influenced_by, to: c, weight: strong, confidence: high }
  research_status: stub
  confidence: medium
  sources: [pike-go-history-talk]
  example:
    title: Channels and procs
    language: Alef
    note: Approximate. C-like syntax with channels as a built-in type; proc starts a new process, task a coroutine in the same process. <-= sends, <- receives.
    code: |
      void
      producer(chan(int) c)
      {
          int i;
          for(i = 0; i < 10; i++)
              c <-= i;
      }

      void
      main(void)
      {
          chan(int) c;
          alloc c;
          proc producer(c);
          print("%d\n", <-c);
      }
    sources: [pike-go-history-talk]

