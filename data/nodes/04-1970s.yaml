  aliases: [Mary/2]
  kind: language
  category: systems
  cluster: algol/systems
  origin:
    first_appeared: { year: 1971, precision: year, note: "Infobox \"First appeared: 1971\"; \"during the 1970s\" in the prose." }
    places: [{ institution: RUNIT, city: Trondheim, country: "NO" }]
  creators:
    - { name: Mark Rain, role: designer }
  status: extinct
  tags:
    paradigm: [imperative]
    typing: [static-typing, strong-typing]
    features: [expression-oriented, pointers]
  summary: >
    A Norwegian systems language that "borrowed many features from ALGOL 68 but was designed for systems programming
    (machine-oriented programming)". Its first compiler was
    in NU ALGOL on the Univac 1100 and bootstrapped native compilers for the Kongsberg SM-4 and Norsk Data Nord-10/ND-100;
    Mary/2 was developed later in the US.
  relations:
    - { type: influenced_by, to: algol-68, weight: strong, confidence: high, sources: [wiki-mary], note: "\"It borrowed many features from ALGOL 68\"." }
  research_status: stub
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Mary_(programming_language)" }
  sources: [wiki-mary]
  example:
    title: References and left-to-right assignment
    language: Mary
    note: "From Wikipedia."
    code: |
      BEGIN
         INT i := 10;          %% Variable with initial value.
         REF INT ri := i;      %% Pointer initialized to point to i.
         INT j := 11;
         j :- REF INT =: ri;   %% Type conversion and assignment
                               %% ri now points to j.
         i =: (ri :- VAL REF INT);
                               %% Assignment and type conversion
                               %% ri points to j so j is changed.
         IF j > 10             %% Conditional statement with result
         THEN                  %% used inside an arithmetic expression.
            1
         ELSE
            2
         FI + j =: j;
      END
    sources: [wiki-mary]

