  example:
    title: C = A + B
    language: IBM Basic Assembly Language
    note: Register 1 does the arithmetic; F'2' is a fullword constant, DS reserves a fullword. Real programs began with standard linkage (save area, BALR base register), omitted here.
    code: |
      ADDEM    CSECT
               L     1,A        load A into register 1
               A     1,B        add B
               ST    1,C        store into C
               BR    14         return to caller
      A        DC    F'2'
      B        DC    F'3'
      C        DS    F
