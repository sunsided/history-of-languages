  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Google_Native_Client", homepage: "https://developer.chrome.com/docs/native-client/" }
  sources: [yee-2009-nacl, wiki-nacl, chrome-nacl-docs]
  example:
    title: The nacljmp sandboxing sequence
    language: x86 machine code under NaCl rules
    note: "From Yee et al. 2009, section 3.1, operands as the paper writes them. Masking the target with 0xffffffe0 forces every indirect jump onto a 32-byte-aligned address; together with the rule that no instruction crosses a 32-byte boundary, the validator can prove all reachable code was disassembled and checked. \"Encoded as a three-byte and and a two-byte jmp\"."
    code: |
      and %eax, 0xffffffe0
      jmp *%eax
    sources: [yee-2009-nacl]

