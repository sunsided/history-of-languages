  example:
    title: "Goroutine and channel"
    language: "Go"
    note: "CSP-style concurrency by way of Newsqueak and Limbo: go starts a goroutine, and the unbuffered channel makes sender and receiver meet."
    code: |
      func main() {
          ch := make(chan string)
          go func() { ch <- "ping" }()
          fmt.Println(<-ch)
      }

- id: rust
  name: Rust
  kind: language
  category: systems
  cluster: c-family/safe
  origin:
    began: { year: 2006, precision: year, note: "Personal project of Graydon Hoare; Mozilla sponsorship from 2009; announced 2010." }
    first_appeared: { year: 2015, date: "2015-05-15", precision: exact, note: "1.0 release." }
    places: [{ institution: Mozilla Research, city: Mountain View, country: US }]
  creators: [{ name: Graydon Hoare, role: original designer }, { name: "Rust team (Mozilla, later Rust Foundation)", role: designers }]
  status: active
  tags:
    paradigm: [multi-paradigm, imperative, functional, generic-programming]
    typing: [static-typing, strong-typing, type-inference, affine-types, parametric-polymorphism]
    memory: [ownership-borrowing, raii, move-semantics]
    concurrency: [threads, async-await, atomics, memory-model]
    features: [traits, algebraic-data-types, pattern-matching, hygienic-macros, safe-unsafe-split, zero-cost-abstractions]
  milestones:
    - { version: "pre-1.0 (green threads, typestate)", year: 2012, summary: "Early Rust had GC'd pointers, green threads and a runtime; all removed before 1.0." }
    - { version: "1.0", year: 2015, introduces: [ownership-borrowing] }
    - { version: "1.39", year: 2019, introduces: [async-await], summary: "async/await: stackless, poll-based futures compiled to state machines, no built-in runtime." }
    - { version: Edition 2021, year: 2021 }
    - { version: Edition 2024, year: 2025 }
  summary: >
    Memory safety without garbage collection through ownership and borrow checking, with C++-level
    control. A deliberate synthesis of research ideas: Cyclone's regions, ML's types, Haskell's type
    classes as traits, C++'s RAII and zero-cost abstractions. It dropped green threads before 1.0
    and later adopted stackless async/await.
