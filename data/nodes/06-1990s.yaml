    places: [{ institution: Apple Computer, country: US }]
  creators:
    - { name: Apple Computer, role: developer }
  status: maintained
  tags:
    paradigm: [object-oriented, event-driven, scripting]
    typing: [dynamic-typing]
    features: [english-like-syntax]
  milestones:
    - { version: "Mac OS X 10.10", year: 2014, summary: "Script Editor accepts JavaScript (JavaScript for Automation) as an alternative OSA language." }
  summary: >
    Apple's system-wide scripting language for automating applications through Apple Events. It is "based
    largely on HyperCard's HyperTalk language", extended to address the objects of any scriptable
    application (documents, pages, text boxes) through tell blocks. A mainstay of desktop-publishing
    workflows.
  notes: >
    William Cook's HOPL III paper "AppleScript" (2007) is the primary history; it was not reachable for this
    pass. Credit its designers (Cook, Warren Harris and others) once read.
  relations:
    - { type: influenced_by, to: hypertalk, aspects: [english-like-syntax], weight: strong, confidence: high, sources: [wiki-applescript, wiki-hypercard], note: "\"The language is based largely on HyperCard's HyperTalk language\"." }
  research_status: draft
  confidence: medium
  links: { wikipedia: "https://en.wikipedia.org/wiki/AppleScript" }
  sources: [wiki-applescript]
  example:
    title: Addressing objects inside another application
    language: AppleScript
    note: "From the Wikipedia AppleScript article. Each tell sets the target for the commands inside it, walking QuarkXPress's object hierarchy."
    code: |
      tell application "QuarkXPress"
        tell document 1
          tell page 2
            tell text box 1
              set word 5 to "Apple"
            end tell
          end tell
        end tell
      end tell
