  research_status: draft
  confidence: high
  sources: [bright-2020-origins-d]
  example:
    title: Compile-time function evaluation
    language: D
    note: enum forces fib(20) to be computed by the compiler, running ordinary D code at compile time (CTFE). static if and templates use the same mechanism; C++'s constexpr later grew in the same direction.
    code: |
      import std.stdio;

      ulong fib(uint n) { return n < 2 ? n : fib(n - 1) + fib(n - 2); }

      enum f20 = fib(20);          // evaluated at compile time
      static assert(f20 == 6765);

      void main() { writeln(f20); }
    sources: [bright-2020-origins-d]

- id: cyclone
  name: Cyclone
  kind: language
  category: research
  cluster: c-family/safe
  origin:
    first_appeared: { year: 2002, precision: year }
    places: [{ institution: AT&T Labs Research and Cornell University, country: US }]
  creators:
    - { name: Trevor Jim, role: designer }
    - { name: Greg Morrisett, role: designer }
    - { name: Dan Grossman, role: designer }
    - { name: Michael Hicks, role: designer }
    - { name: James Cheney, role: designer }
    - { name: Yanling Wang, role: designer }
  status: extinct
  tags:
    paradigm: [imperative]
    typing: [static-typing]
    memory: [region-based-memory, manual-memory]
    features: [safe-pointers]
  summary: "Safe dialect of C with region-based memory management and fat/never-null pointers. Its regions are a direct ancestor of Rust's lifetimes."
  relations:
    - { type: dialect_of, to: c, weight: strong, confidence: high }
    - { type: influenced_by, to: ml, weight: moderate, confidence: medium }
  research_status: draft
  confidence: high
  sources: [jim-2002-cyclone]
  example:
    title: Never-null and fat pointers
    language: Cyclone
    note: From Wikipedia's Cyclone article. int@ can never be NULL; char? is a 'fat' pointer that carries its bounds (s.size), so pointer arithmetic is checked. The compiler also rejects returning a pointer into a dead stack frame, through region analysis that is an ancestor of Rust's lifetimes.
    code: |
      int foo(int@ p);                 /* p can never be NULL */

      int strlen(const char? s) {      /* fat pointer: knows its size */
          int n = s.size;
          if (!s) {
              return 0;
          }
          for (int i = 0; i < n; i++, s++) {
              if (*s == '\0') {
                  return i;
              }
          }
          return n;
      }
    sources: [wiki-cyclone, jim-2002-cyclone]

