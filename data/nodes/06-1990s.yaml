  research_status: draft
  confidence: medium
  links: { wikipedia: "https://en.wikipedia.org/wiki/Free_Pascal", homepage: "https://www.freepascal.org" }
  sources: [wiki-free-pascal]
  example:
    title: Classes in objfpc mode
    language: Free Pascal
    note: "Written for this dataset and compiled with FPC 3.2.2 (prints \"Area: 12.57\"). {$mode objfpc} selects FPC's own Object Pascal dialect; {$H+} makes string an ansistring; Result is the implicit return variable."
    code: |
      program Shapes;
      {$mode objfpc}{$H+}

      type
        TShape = class
          function Area: Double; virtual; abstract;
        end;
        TCircle = class(TShape)
          R: Double;
          constructor Create(ARadius: Double);
          function Area: Double; override;
        end;

      constructor TCircle.Create(ARadius: Double);
      begin
        R := ARadius;
      end;

      function TCircle.Area: Double;
      begin
        Result := Pi * R * R;
      end;

      var
        S: TShape;
      begin
        S := TCircle.Create(2.0);
        WriteLn('Area: ', S.Area:0:2);
        S.Free;
      end.
    sources: [wiki-free-pascal]

