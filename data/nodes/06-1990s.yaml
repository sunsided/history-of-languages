- id: modelica
  name: Modelica
  kind: language
  category: scientific
  cluster: scientific
  origin:
    began: { year: 1996, precision: exact, note: "\"The Modelica design effort was initiated in September 1996 by Hilding Elmqvist.\"" }
    first_appeared: { year: 1997, precision: exact, note: "\"In September 1997, version 1.0 of the Modelica specification was released\"." }
  creators:
    - { name: Hilding Elmqvist, role: key architect }
    - { name: Modelica Association, role: maintainer from 2000 }
  status: active
  tags:
    paradigm: [object-oriented, declarative]
    features: [standardization, operator-overloading]
    domain: [simulation]
  milestones:
    - { version: "1.0", year: 1997, summary: "Continuous dynamic systems." }
    - { version: "1.1", year: 1998, summary: "Discrete systems (pre, when)." }
    - { version: "3.0", year: 2007, summary: "Clean-up: specification rewritten, balanced model concept." }
    - { version: "3.1", year: 2009, summary: "Stream connectors, operator overloading.", introduces: [operator-overloading] }
    - { version: "3.3", year: 2012, summary: "Clocked equations and synchronous state machines." }
    - { version: "3.6", year: 2023 }
  summary: >
    "an object-oriented, declarative, multi-domain modeling language for component-oriented modeling of complex
    systems" (mechanical, electrical, hydraulic, thermal, control). Models are equations, not assignments: "Modelica is a
    modeling language rather than a conventional programming language". Version 1.0 "is based on the PhD thesis of
    Hilding Elmqvist and on the experience with the modeling languages Allan, Dymola, NMF, ObjectMath, Omola, SIDOPS+,
    and Smile".
  research_status: stub
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Modelica", homepage: "https://modelica.org" }
  sources: [wiki-modelica]
  example:
    title: A first-order system
    language: Modelica
    note: "From Wikipedia."
    code: |
      model FirstOrder
        parameter Real c=1 "Time constant";
        Real x (start=10) "An unknown";
      equation
        der(x) = -c*x "A first order differential equation";
      end FirstOrder;
    sources: [wiki-modelica]

