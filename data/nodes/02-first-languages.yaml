- id: fortran
  name: Fortran
  aliases: [FORTRAN, "Formula Translating System"]
  kind: language
  category: scientific
  cluster: fortran
  origin:
    began: { year: 1954, precision: year, note: "Preliminary report November 1954." }
    first_appeared: { year: 1957, date: "1957-04", precision: exact, note: "First compiler delivered for the IBM 704." }
    places: [{ institution: IBM, city: New York, country: US }]
  creators:
    - { name: John Backus, role: team lead }
    - { name: "Irving Ziller, Harlan Herrick, Roy Nutt, Lois Haibt, Robert Nelson, Sheldon Best, David Sayre, Richard Goldberg, Peter Sheridan", role: team }
  status: active
  tags:
    paradigm: [imperative, procedural, array-programming, object-oriented]
    typing: [static-typing]
    concurrency: [coarrays, data-parallelism]
    features: [optimizing-compiler, implicit-typing, modules]
    domain: [scientific-computing, hpc]
  milestones:
    - { version: FORTRAN II, year: 1958, introduces: [subroutines-separate-compilation], summary: "SUBROUTINE, FUNCTION, separate compilation." }
    - { version: FORTRAN IV, year: 1962, summary: "Logical IF, type declarations." }
    - { version: FORTRAN 66, year: 1966, introduces: [standardization], summary: "First ANSI standard for any programming language." }
    - { version: FORTRAN 77, year: 1978, introduces: [structured], summary: "Block IF/ELSE, CHARACTER type." }
    - { version: Fortran 90, year: 1991, introduces: [modules, array-programming, recursion, dynamic-allocation], summary: "Free form, modules, whole-array operations, derived types, pointers." }
    - { version: Fortran 95, year: 1997, introduces: [data-parallelism], summary: "FORALL, PURE and ELEMENTAL procedures (from High Performance Fortran)." }
    - { version: Fortran 2003, year: 2004, introduces: [object-oriented, c-interop], summary: "Type extension, polymorphism, ISO_C_BINDING." }
    - { version: Fortran 2008, year: 2010, introduces: [coarrays], summary: "Coarrays (SPMD parallelism), DO CONCURRENT." }
    - { version: Fortran 2018, year: 2018 }
    - { version: Fortran 2023, year: 2023 }
  summary: >
    The first widely used high-level language and the first optimizing compiler: proof that compiled
    code could compete with hand-written assembly. Still a leading language for numerical HPC,
    having absorbed modules, array programming, OOP and parallelism over 60 years.
  relations:
    - { type: targets, to: ibm-704, weight: strong, confidence: high }
    - { type: influenced_by, to: sap-704, weight: weak, confidence: low, note: "Shared team member (Roy Nutt) and machine; not a design influence on the language itself." }
    - { type: influenced_by, to: glennie-autocode, weight: weak, confidence: low, note: "Backus later said the team was mostly unaware of earlier work; Laning & Zierler's MIT algebraic system (1954) is the one acknowledged precursor. Add it as a node." }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Fortran", homepage: "https://fortran-lang.org" }
  sources: [backus-1978-history-fortran, wiki-fortran]

- id: lisp
  name: Lisp
  aliases: [LISP, "LISt Processor"]
  kind: language
  category: research
  cluster: lisp
  origin:
    began: { year: 1958, precision: year }
    first_appeared: { year: 1960, precision: year, note: "CACM paper 'Recursive Functions of Symbolic Expressions and Their Computation by Machine, Part I' (1960); first interpreter by Steve Russell on the IBM 704 (1958-59)." }
    places: [{ institution: MIT, city: Cambridge MA, country: US }]
  creators:
    - { name: John McCarthy, role: designer }
    - { name: Steve Russell, role: first implementer }
  status: active
  tags:
    paradigm: [functional, multi-paradigm]
    typing: [dynamic-typing]
    memory: [garbage-collection]
    features: [homoiconicity, macros, conditional-expressions, recursion, first-class-functions, repl, linked-lists, self-hosting]
    domain: [artificial-intelligence]
  milestones:
    - { version: LISP 1.5, year: 1962, summary: "The LISP 1.5 Programmer's Manual; the reference point for most later dialects." }
  summary: >
    Second-oldest high-level language still in use. Introduced garbage collection, conditional
    expressions, the REPL, code-as-data (homoiconicity) and an eval written in the language itself.
    It is less a language than a family; see the Lisp cluster.
  relations:
    - { type: influenced_by, to: ipl, aspects: [linked-lists, recursion], weight: strong, confidence: high }
    - { type: influenced_by, to: fortran, weight: moderate, confidence: high, note: "Via FLPL (Fortran List Processing Language) on the 704, which McCarthy found inadequate for recursion and conditional expressions." }
    - { type: influenced_by, to: lambda-calculus, aspects: [first-class-functions], weight: moderate, confidence: high, note: "McCarthy took the lambda notation but said he did not use the lambda calculus seriously; Lisp's original scoping was dynamic, not Church's." }
    - { type: targets, to: ibm-704, weight: moderate, confidence: high }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Lisp_(programming_language)" }
  sources: [mccarthy-1960-recursive-functions, mccarthy-1978-history-lisp, steele-gabriel-1993-evolution-lisp]

