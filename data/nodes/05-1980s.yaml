    typing: [static-typing, parametric-polymorphism]
    features: [algebraic-data-types, pattern-matching]
  summary: >
    Edinburgh's experimental applicative language, "the language that introduced algebraic data types" (Hudak
    et al. 2007). Derived from Burstall and Darlington's NPL, it declared types explicitly ("there is no type
