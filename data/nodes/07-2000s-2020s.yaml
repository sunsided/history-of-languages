  example:
    title: Actors and async/await
    language: Swift 5.5+
    note: An actor serializes access to its state; calls from outside must await. async let starts child tasks that the enclosing function waits for (structured concurrency).
    code: |
      actor Counter {
          private var value = 0
          func increment() -> Int { value += 1; return value }
      }

      func fetch(_ name: String, ms: UInt64) async -> String {
          try? await Task.sleep(nanoseconds: ms * 1_000_000)
          return "\(name) done"
      }

      @main struct App {
          static func main() async {
              let counter = Counter()
              async let a = fetch("a", ms: 200)
              async let b = fetch("b", ms: 100)
              print(await [a, b], await counter.increment())
          }
      }
    sources: [swift-se-0296]

