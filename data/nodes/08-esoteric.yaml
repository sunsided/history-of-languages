- id: redcode
  name: Redcode
  aliases: [Core War]
  kind: assembly
  category: esoteric
  cluster: esoteric/puzzle
  origin:
    first_appeared: { year: 1984, date: "1984-03", precision: exact, note: "\"The first description of the Redcode language was published in March 1984, in Core War Guidelines by D. G. Jones and A. K. Dewdney\"; Dewdney's Scientific American article followed in May 1984." }
  creators:
    - { name: D. G. Jones, role: co-creator of Core War }
    - { name: A. K. Dewdney, role: co-creator of Core War }
  status: maintained
  tags:
    paradigm: [imperative]
    features: [self-modifying-code, assembly-language]
  milestones:
    - { version: ICWS-86, year: 1986, summary: "First standard of the International Core War Society; ten instructions." }
    - { version: ICWS-88, year: 1988, summary: "Eleven instructions." }
    - { version: 1994 draft, year: 1994, summary: "Proposed standard with sixteen instructions and instruction modifiers (MOV.F, ADD.AB); never formally adopted but widely used." }
  summary: >
    The assembly language of Core War, a 1984 programming game in which two programs ("warriors") share the
    memory of a virtual machine, the Memory Array Redcode Simulator (MARS), and fight for control of it. The first published warrior, Dewdney's Imp, is a single instruction that
    copies itself one cell ahead forever. Dewdney's article cites Bell Labs' 1961 game Darwin as a forerunner.
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Core_War" }
  sources: [wiki-core-war]
  example:
    title: A bomber in ICWS-94 Redcode
    language: Redcode (assembled, 1994 draft)
    note: "The listing Wikipedia shows as \"Assembled ICWS-94 style Redcode\": a loop that adds 4 to a pointer and copies the DAT \"bomb\" to where it points, stepping through memory. Not run in a MARS here."
    code: |
      0000: ADD.AB # 4, $ 3
      0001: MOV.F $ 2, @ 2
      0002: JMP.B $ -2, $ 0
      0003: DAT.F # 0, # 0
    sources: [wiki-core-war]

- id: tis-100
  name: TIS-100
  aliases: [TIS-100 assembly, Tessellated Intelligence System]
  kind: assembly
  category: esoteric
  cluster: esoteric/puzzle
