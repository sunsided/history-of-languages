- id: koka
  name: Koka
  kind: language
  category: research
  cluster: ml-family
  origin:
    began: { year: 2012, precision: year, note: "Microsoft Research project page: \"Established: April 13, 2012\"." }
    first_appeared: { year: 2014, date: "2014-06-09", precision: exact, note: "Leijen, \"Koka: Programming with Row Polymorphic Effect Types\", arXiv 1406.2061 (EPTCS 153)." }
    places: [{ institution: Microsoft Research, country: US }]
  creators: [{ name: Daan Leijen, role: designer }]
  status: active
  tags:
    paradigm: [functional]
    typing: [static-typing, type-inference, parametric-polymorphism]
    memory: [reference-counting]
    concurrency: [effect-handlers]
    features: [algebraic-data-types, pattern-matching]
  milestones:
    - { version: "v2.4.0", year: 2022 }
    - { version: "v3.1.0", year: 2024, summary: "Concurrent build system; named effect typing redesigned to match the formal system." }
  summary: >
    "A strongly typed functional-style language with effect types and handlers" from Microsoft Research:
    every function's possible side effects are "apparent in its type signature", and user-defined effects
    such as generators or async are written with handlers. Its Perceus reference counting compiles to C
    without a garbage collector. Still "a research language ... not ready for production use".
  notes: >
    When handlers (as opposed to row-polymorphic effect types) arrived in Koka is not sourced, so no milestone
    introduces effect-handlers yet. Perceus: technical report 2020-11-29.
  research_status: draft
  confidence: medium
  links: { homepage: "https://koka-lang.github.io" }
  sources: [leijen-2014-koka, koka-docs, msr-koka]
  example:
    title: A user-defined generator effect
    language: Koka
    note: "From the Koka documentation. traverse's type says it may perform yield; main supplies a handler with with fun yield, so the same traverse could be reused with any other handler."
    code: |
      // A generator effect with one operation
      effect yield<a>
        fun yield( x : a ) : ()

      // Traverse a list and yield the elements
      fun traverse( xs : list<a> ) : yield<a> ()
        match xs
          Cons(x,xx) -> { yield(x); traverse(xx) }
          Nil        -> ()

      fun main() : console ()
        with fun yield(i : int)
          println("yielded " ++ i.show)
        [1,2,3].traverse
    sources: [koka-docs]

