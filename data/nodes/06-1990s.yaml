  example:
    title: "The famous two-line quicksort"
    language: "Haskell"
    note: "Pattern matching and list comprehensions. Elegant but not the real quicksort: it is not in place and allocates new lists at every level."
    code: |
      quicksort :: Ord a => [a] -> [a]
      quicksort []     = []
      quicksort (p:xs) = quicksort [x | x <- xs, x < p]
                      ++ [p]
                      ++ quicksort [x | x <- xs, x >= p]

