    - { type: influenced_by, to: rexx, weight: weak, confidence: low, sources: [wiki-rexx], note: "Wikipedia's Rexx article calls Rexx \"a precursor to Tcl and Python\" as a general-purpose scripting language; no Ousterhout statement found." }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Tcl_(programming_language)", homepage: "https://www.tcl-lang.org" }
  sources: [wiki-tcl, ousterhout-tcl-history]
  example:
    title: Commands all the way down
    language: Tcl 8.6
    note: "From the Wikipedia Tcl article (indentation restored). if, expr and tailcall are ordinary commands taking strings; braces quote without substitution. collatz 6 prints 6 3 10 5 16 8 4 2 1 under tclsh 8.6."
    code: |
      proc collatz {n} {
          puts $n
          if {$n > 1} {
              if {$n % 2 == 0} {
                  tailcall collatz [expr {$n >> 1}]
              } else {
                  tailcall collatz [expr {$n * 3 + 1}]
              }
          }
      }
    sources: [wiki-tcl]

