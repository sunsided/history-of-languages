    features: [records, macros]
    domain: [statistics, business-data-processing]
  milestones:
    - { version: SAS 76, year: 1976, summary: "Redesigned: improved INPUT/INFILE and PUT/FILE, PROC FORMAT. SAS Institute incorporated the same year." }
    - { version: SAS 82, year: 1982, introduces: [macros], summary: "Early macro language." }
    - { version: "9.0", year: 2004 }
  summary: >
    The Statistical Analysis System, begun at North Carolina State University for agricultural experiment data.
    A program is a sequence of DATA steps, which read and transform records row by row, and PROC steps that run
    canned procedures over the resulting data sets. Spun out as SAS Institute in 1976, it became the dominant
    commercial statistics language in pharmaceuticals, banking and government.
  notes: >
    SAS's own timeline is inconsistent about the incorporation (1971 vs July 1976); Wikipedia gives 1976. The C
