    code: |
      signature SHAPE = sig
        datatype shape = Circle of real | Rect of real * real
        val area : shape -> real
      end

      structure Shape :> SHAPE = struct
        datatype shape = Circle of real | Rect of real * real
        fun area (Circle r)    = Math.pi * r * r
          | area (Rect (w, h)) = w * h
      end
