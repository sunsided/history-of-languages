  summary: Resource lifetime bound to object lifetime via constructors/destructors.
  first_seen:
    node: cpp
    year: 1985
- id: reference-counting
  name: Reference counting
  facet: memory
  broader:
  - garbage-collection
  summary: Objects freed when their reference count drops to zero.
- id: region-based-memory
  name: Region based memory
  facet: memory
  summary: Allocation in regions freed together, checked statically.
  first_seen:
    node: cyclone
    year: 2002
    note: ML Kit (Tofte & Talpin) did region inference earlier.
- id: stack-allocation
  name: Stack allocation
  facet: memory
  summary: Activation records on a run-time stack, enabling recursion.
  first_seen:
    node: algol-60
    year: 1960
- id: array-programming
  name: Array programming
  facet: paradigm
  summary: Operations apply to whole arrays at once.
  first_seen:
    node: apl
    year: 1966
- id: concatenative
  name: Concatenative
  facet: paradigm
  broader:
  - stack-oriented
  summary: Programs are composed by juxtaposition; each word transforms a stack.
  first_seen:
    node: forth
    year: 1970
- id: concurrent
  name: Concurrent
  facet: paradigm
  summary: Concurrency is a central organizing principle of the language.
- id: data-abstraction
  name: Data abstraction
  facet: paradigm
  summary: Types defined by their operations, hiding representation.
  first_seen:
    node: clu
    year: 1975
- id: data-driven
  name: Data driven
  facet: paradigm
  summary: Program structure follows the shape of the input data (pattern -> action).
  first_seen:
    node: awk
    year: 1977
- id: declarative
  name: Declarative
  facet: paradigm
  summary: Say what result is wanted, not how to compute it.
- id: event-driven
  name: Event driven
  facet: paradigm
  summary: Control flow determined by events dispatched to handlers.
- id: functional-reactive-programming
  name: Functional reactive programming
  facet: paradigm
  broader:
  - functional
  - event-driven
  summary: Programs as pure functions over time-varying values and event streams.
  first_seen:
    node: elm
    year: 2012
    note: "Earliest in this dataset; FRP itself goes back to Fran (Elliott and Hudak, 1997), not yet a node."
- id: functional
  name: Functional
  facet: paradigm
  summary: Computation as the evaluation of functions, avoiding mutable state. Today a set of features most languages share,
    not a camp.
  first_seen:
    node: lisp
    year: 1960
    note: As a practical language; the lambda calculus is the theory.
- id: generic-programming
  name: Generic programming
  facet: paradigm
  summary: Algorithms written once over types supplied later.
  first_seen:
    node: clu
    year: 1975
    note: Parameterized clusters; the term comes from Musser & Stepanov, 1988.
- id: goal-directed
  name: Goal directed
  facet: paradigm
  summary: Expressions succeed or fail and may generate multiple results; failure drives backtracking.
  first_seen:
    node: icon
    year: 1977
- id: imperative
  name: Imperative
  facet: paradigm
  summary: Programs as sequences of state-changing commands.
- id: visual-programming
  name: Visual programming
  facet: paradigm
  summary: Programs built by arranging graphical elements (blocks, tiles, boxes and wires) instead of writing text.
- id: dataflow-programming
  name: Dataflow programming
  facet: paradigm
  summary: Programs as graphs of operations that run when their inputs arrive, with data flowing along the edges.
- id: synchronous-programming
  name: Synchronous programming
  facet: paradigm
  summary: Programs react to inputs in discrete logical instants, with computation assumed to take no time within an instant; used for real-time control.
- id: logic
  name: Logic
  facet: paradigm
  broader:
  - declarative
  summary: Programs as logical relations; execution as proof search.
  first_seen:
    node: prolog
    year: 1972
- id: modular
  name: Modular
  facet: paradigm
  summary: Programs built from separately compiled modules with explicit interfaces.
- id: multi-paradigm
  name: Multi paradigm
  facet: paradigm
  summary: Deliberately supports several paradigms.
- id: object-oriented
  name: Object oriented
  facet: paradigm
  summary: 'Programs as interacting objects bundling state and behaviour. Two traditions: Simula/C++/Java (classes as static
    types) and Smalltalk/Self/Objective-C (late-bound messages).'
  first_seen:
    node: simula
    year: 1967
- id: procedural
  name: Procedural
  facet: paradigm
  broader:
  - imperative
  summary: Imperative code organized into callable procedures.
- id: protocol-oriented
  name: Protocol oriented
  facet: paradigm
  broader:
  - object-oriented
  summary: Swift's term for designing with protocols and value types over class inheritance.
  first_seen:
    node: swift
    year: 2014
- id: prototype-based
  name: Prototype based
  facet: paradigm
  broader:
  - object-oriented
  summary: Objects inherit directly from other objects, without classes.
  first_seen:
    node: self
    year: 1987
- id: purely-functional
  name: Purely functional
  facet: paradigm
  broader:
  - functional
  summary: No side effects in the language core; effects are modelled as values (streams, monads).
- id: query
  name: Query
  facet: paradigm
  broader:
  - declarative
  summary: Languages for retrieving and transforming stored data.
- id: reflective
  name: Reflective
  facet: paradigm
  summary: Programs can inspect and modify their own structure at run time.
- id: scripting
  name: Scripting
  facet: paradigm
  summary: Glue code that orchestrates other programs or a host application.
- id: stack-oriented
  name: Stack oriented
  facet: paradigm
  summary: Operations take and return values on an implicit stack.
- id: structured
  name: Structured
  facet: paradigm
  broader:
  - imperative
  summary: Control flow through nested blocks, conditionals and loops instead of arbitrary jumps (Böhm-Jacopini 1966, Dijkstra
    1968).
  first_seen:
    node: p-prime-prime
    year: 1964
    note: Böhm's proof that sequence, selection and iteration suffice.
- id: tacit-programming
  name: Tacit programming
  facet: paradigm
  broader:
  - functional
  summary: 'Point-free style: functions defined without naming their arguments.'
  first_seen:
    node: apl
    year: 1966
- id: dependent-types
  name: Dependent types
  facet: typing
  broader:
  - static-typing
  summary: Types that depend on values, such as a vector type indexed by its length; with them, propositions are types and programs are proofs.
- id: refinement-types
  name: Refinement types
  facet: typing
  broader:
  - static-typing
  summary: A base type narrowed by a logical predicate, such as x:int{x >= 0}, checked statically, often with an SMT solver.
- id: uniqueness-types
  name: Uniqueness types
  facet: typing
  broader:
  - static-typing
  summary: A value with a unique type has exactly one reference to it, so it can be updated in place while the language stays pure. Clean uses it for state and I/O where Haskell uses monads.
- id: linear-types
  name: Linear types
  facet: typing
  broader:
  - static-typing
  summary: Values that must be used exactly once; quantitative type theory generalises this to counted use (Idris 2).
- id: affine-types
  name: Affine types
  facet: typing
  broader:
  - static-typing
  summary: Values usable at most once; the basis of Rust's moves.
- id: dynamic-typing
  name: Dynamic typing
  facet: typing
  summary: Types checked at run time on values.
  first_seen:
    node: lisp
    year: 1960
- id: gradual-typing
  name: Gradual typing
  facet: typing
  summary: Optional static types mixed with dynamic code.
- id: null-safety
  name: Null safety
  facet: typing
  broader:
  - static-typing
  summary: Absence of a value is tracked in the type system.
- id: parametric-polymorphism
  name: Parametric polymorphism
  facet: typing
  broader:
  - static-typing
  summary: Code generic over types ('a list).
  first_seen:
    node: ml
    year: 1973
- id: static-typing
  name: Static typing
  facet: typing
  summary: Types checked before the program runs.
- id: strong-typing
  name: Strong typing
  facet: typing
  summary: Few implicit conversions between unrelated types. A loose term; used here as each language's own documentation
    uses it.
- id: structural-typing
  name: Structural typing
  facet: typing
  summary: Type compatibility by shape, not by declared name.
- id: type-classes
  name: Type classes
  facet: typing
  broader:
  - parametric-polymorphism
  summary: Ad hoc polymorphism via instances of a class of types; ancestor of Rust traits and Swift protocols.
  first_seen:
    node: haskell
    year: 1990
    note: Wadler & Blott, 1988.
- id: type-inference
  name: Type inference
  facet: typing
  broader:
  - static-typing
  summary: Types deduced by the compiler without annotations; Hindley-Milner in ML is the root.
  first_seen:
    node: ml
    year: 1973
- id: typeless
  name: Typeless
  facet: typing
  summary: A single machine-word type; meaning comes from the operation.
  first_seen:
    node: bcpl
    year: 1967
- id: weak-typing
  name: Weak typing
  facet: typing
  summary: Many implicit conversions, or unchecked reinterpretation of memory.
