  example:
    title: comptime generics
    language: Zig
    note: 'Types are values at compile time: Stack is an ordinary function that takes a type and returns a new struct type. One mechanism (comptime) covers generics, macros and conditional compilation.'
    code: |
      const std = @import("std");

      fn Stack(comptime T: type, comptime n: usize) type {
          return struct {
              items: [n]T = undefined,
              len: usize = 0,
              fn push(self: *@This(), x: T) void {
                  self.items[self.len] = x;
                  self.len += 1;
              }
          };
      }

      pub fn main() void {
          var s = Stack(i32, 8){};
          s.push(42);
          std.debug.print("{d}\n", .{s.items[0]});
      }
    sources: [wiki-zig]
