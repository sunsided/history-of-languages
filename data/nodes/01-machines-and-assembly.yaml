- id: asm-risc-v
  name: RISC-V assembly
  kind: assembly
  category: systems
  cluster: assembly/risc
  origin: { first_appeared: { year: 2014, precision: year } }
  status: active
  summary: "Assembly for the open RISC-V ISA; syntax close to MIPS. Displacing MIPS in teaching."
  relations:
    - { type: targets, to: risc-v, weight: strong, confidence: high }
    - { type: influenced_by, to: asm-mips, weight: moderate, confidence: medium }
  research_status: stub
  confidence: high
  sources: [wiki-risc-v]
  example:
    title: Hello, world on Linux
    language: RISC-V assembly (GNU as)
    note: 'Linux system calls take their number in a7: 64 is write, 93 exit. Arguments go in a0-a2.'
    code: |2
              .globl _start
              .text
      _start: li    a0, 1          # stdout
              la    a1, msg
              li    a2, 13         # length
              li    a7, 64         # write
              ecall
              li    a0, 0
              li    a7, 93         # exit
              ecall
              .data
      msg:    .ascii "Hello, world\n"
    sources: [wiki-risc-v]
