# Clusters are the collapsible subgraphs of the site AND the unit of research work.
# A cluster id is a path: `algol/wirth` is a child of `algol`. Collapsed, a cluster renders as one node with aggregated edges.
# research_status says how far the cluster has been unfolded:
#   stub     - placeholder; members may be missing entirely
#   draft    - core members present from secondary sources and HOPL papers; backlog lists what is missing
#   reviewed - every member checked against primary sources; backlog empty or explicitly deferred
# collapsed: true makes the viewer start the cluster folded (top-level clusters otherwise start expanded).
# To unfold a cluster: work through its backlog and research_questions, add nodes, cite sources, then raise its status.

# ===================== Prehistory =====================
