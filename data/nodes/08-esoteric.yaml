- id: hexagony
  name: Hexagony
  kind: language
  category: esoteric
  cluster: esoteric/2d
  origin:
    first_appeared: { year: 2015, precision: year, note: "Esolang wiki year category." }
  creators: [{ name: Martin Ender, role: designer }]
  status: historical
  tags:
    paradigm: [imperative]
  summary: >
    "The first two-dimensional esoteric programming language on a hexagonal grid": the source must be a regular
    hexagon, up to six instruction pointers move across it, and memory is a separate hexagonal grid of edges. The
    name is "a portmanteau of 'hexagon' and 'agony'". Turing-complete, since any Brainfuck program can be
    translated into it.
  notes: >
    The wiki says the grid is flat-topped, the author's README says pointy-topped.
  research_status: draft
  confidence: medium
  links: { homepage: "https://github.com/m-ender/hexagony" }
  sources: [esolangs-hexagony, hexagony-github]
  example:
    title: Hello, World!
    language: Hexagony
    note: "From the Esolang wiki. The program is laid out on a side-4 hexagon; letters set the current memory edge, ; prints it, and the mirrors (/, \\, <, >) steer the instruction pointer; @ ends."
    code: |2
          H ; e ;
         l ; d ; *
        ; r ; o ; W
       l ; ; o ; * 4
        3 3 ; @ . >
         ; 2 3 < \
          4 ; * /
    sources: [esolangs-hexagony]

