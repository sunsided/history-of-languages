    - { version: Coq, year: 1991, summary: "Christine Paulin extends it to the Calculus of Inductive Constructions; the name changes from CoC to Coq." }
    - { version: "Rocq 9.0", year: 2025, summary: "Rebranded: Coq becomes The Rocq Prover (renaming announced 11 October 2023)." }
  summary: >
    The interactive theorem prover of the Calculus of (Inductive) Constructions, whose specification
    language Gallina is a dependently typed functional language: programs and proofs share one syntax, and
    certified programs can be extracted. Named Coq for the calculus and for Thierry Coquand, renamed Rocq
    in 2025.
