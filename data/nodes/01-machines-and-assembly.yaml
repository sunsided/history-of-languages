- id: pdp-11
  name: PDP-11
  kind: machine
  category: general
  cluster: machines/dec
  origin: { first_appeared: { year: 1970, precision: year }, places: [{ institution: Digital Equipment Corporation, city: Maynard MA, country: US }] }
  status: extinct
  summary: "16-bit minicomputer with an orthogonal instruction set and autoincrement addressing. Unix and C were moved to it in 1971-73, and its addressing modes shaped C idioms."
  notes: "Ritchie denies that ++/-- were invented for PDP-11 autoincrement: they came from B, which predates the PDP-11. Worth a myth-vs-fact tooltip."
  research_status: stub
  confidence: high
  sources: [wiki-pdp-11, ritchie-1993-development-c]
  example:
    title: Autoincrement addressing
    language: PDP-11 machine code
    note: (R1)+ means 'use the word R1 points to, then add 2 to R1'. MOVB (R1)+,(R2)+ copies a byte and advances both pointers in a single 16-bit instruction. C's *p++ looks like this, but Ritchie notes ++ came from B, before the PDP-11.
    code: |
      112122      MOVB (R1)+,(R2)+     ; copy one byte, advance both
      001376      BNE  .-2              ; loop until a zero byte was copied
    sources: [wiki-pdp-11, ritchie-1993-development-c]

