    - { version: "'93", year: 1993, summary: "Imperative variables, destructive assignment, perturbation constraint model." }
  summary: >
    "a constraint programming language embedding constraints into an imperative object-oriented language": always,
    once and assert .. during state relational invariants, and objects have constraint constructors. Its three versions
    "show an evolution from declarative to an increasingly imperative style".
