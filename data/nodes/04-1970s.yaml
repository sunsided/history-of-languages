  relations:
    - { type: influenced_by, to: codd-relational-model, weight: strong, confidence: high }
  research_status: draft
  confidence: high
  sources: [chamberlin-boyce-1974-sequel, codd-1970-relational]
  example:
    title: Declarative aggregation
    language: SQL
    note: 'Says what the result is, not how to get it: the database chooses join order and indexes. GROUP BY and HAVING arrived early; window functions came in SQL:2003.'
    code: |
      SELECT   d.name, COUNT(*) AS staff, AVG(e.salary) AS avg_salary
      FROM     employee e
      JOIN     department d ON d.id = e.dept_id
      WHERE    e.active
      GROUP BY d.name
      HAVING   COUNT(*) > 5
      ORDER BY avg_salary DESC;
    sources: [chamberlin-boyce-1974-sequel]

