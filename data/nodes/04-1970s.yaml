- id: xpl0
  name: XPL0
  kind: language
  category: general
  cluster: algol/systems
  origin:
    first_appeared: { year: 1976, precision: year, note: "\"created in 1976 by Peter J. R. Boyle\"." }
  creators:
    - { name: Peter J. R. Boyle, role: designer }
  status: maintained
  tags:
    paradigm: [procedural, imperative, structured]
    features: [self-hosting, compiler]
  summary: >
    "essentially a cross between Pascal and C. It looks somewhat like Pascal but works more like C." Boyle based it on
    "PL/0, an example compiler in the book Algorithms + Data Structures = Programs by Niklaus Wirth", wrote the first
    compiler in ALGOL for a 6502 pseudo-machine, then made it compile itself. From 1980 it was sold with an Apple II
    operating system, and it now has optimising 32- and 64-bit compilers.
  relations:
    - { type: influenced_by, to: pl-0, weight: strong, confidence: high, sources: [wiki-xpl0], note: "\"XPL0 is based on PL/0\"." }
    - { type: influenced_by, to: pascal, weight: moderate, confidence: medium, sources: [wiki-xpl0], note: "\"a cross between Pascal and C\"." }
    - { type: influenced_by, to: c, weight: moderate, confidence: medium, sources: [wiki-xpl0], note: "\"works more like C\"." }
  research_status: stub
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/XPL0" }
  sources: [wiki-xpl0]
  example:
    title: TPK algorithm
    language: XPL0
    note: "From Wikipedia; the page's Markdown escapes removed."
    code: |
      func real F(T);
      real T;
      return sqrt(abs(T)) + 5.*Pow(T, 3.);

      int I;  real Y, A(11);
      [for I:= 0 to 10 do A(I):= RlIn(0);
      for I:= 10 downto 0 do
          [Y:= F(A(I));
          if Y > 400. then [IntOut(0, I);  Text(0, " TOO LARGE")]
                      else [IntOut(0, I);  RlOut(0, Y)];
          CrLf(0);
          ];
      ]
    sources: [wiki-xpl0]

- id: newp
