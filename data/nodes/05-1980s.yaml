  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Rexx" }
  sources: [wiki-rexx]
  example:
    title: Instructions and host commands
    language: REXX
    note: "From the Wikipedia Rexx article. The quoted lines are not REXX instructions, so they go to the operating system as commands; rc holds the return code. Run with Regina REXX."
    code: |
      a = "hello world"             /* assignment instruction */
      do i = 1 to 2                 /* keyword instruction "DO" */
        say "round #" i":" a        /* keyword instruction "SAY" */
      end                           /* keyword instruction "END" */
      "echo Hello World"            /* command to operating system */
      "echo" a                      /* command to operating system */
      say "RC:" rc                  /* command's numeric return code */
    sources: [wiki-rexx]

