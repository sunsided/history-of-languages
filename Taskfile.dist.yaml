# yaml-language-server: $schema=https://taskfile.dev/schema.json
# Shared tasks. Put personal overrides in a gitignored Taskfile.yaml (it takes precedence).
version: '3'

vars:
  VIEWER: viewer

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

tasks:
  default:
    desc: Start the viewer dev server
    cmds:
      - task: dev

  install:
    desc: Install viewer dependencies (yarn via corepack)
    dir: '{{.VIEWER}}'
    sources:
      - package.json
      - yarn.lock
    generates:
      - node_modules/.yarn-state.yml
    cmds:
      - corepack yarn install

  dev:
    desc: Run the timeline viewer with hot reload (also reloads live on data/*.yaml edits)
    dir: '{{.VIEWER}}'
    deps: [install]
    cmds:
      - corepack yarn dev {{.CLI_ARGS}}

  check:
    desc: Type-check the viewer (svelte-check)
    dir: '{{.VIEWER}}'
    deps: [install]
    cmds:
      - corepack yarn svelte-kit sync
      - corepack yarn check

  verify:
    desc: Everything that must pass before a commit (data validation and viewer type-check)
    cmds:
      - task: data:build
      - task: check

  data:build:
    desc: Validate data/ against the schema and emit dist/graph.json
    cmds:
      - python3 tools/build.py

  data:missing:
    desc: List referenced-but-undefined ids
    cmds:
      - python3 tools/build.py --missing

  data:report:
    desc: 'Research to-do list; pass sections after --, e.g. task data:report -- clusters orphans'
    summary: |
      Sections: clusters, orphans, edges, concepts, sources, decades, people (all when none are given).
    cmds:
      - python3 tools/report.py {{.CLI_ARGS}}

  data:find:
    desc: 'Is it already a node, alias, backlog item or concept? e.g. task data:find -- Turbo Pascal'
    preconditions:
      - sh: '{{if .CLI_ARGS}}true{{else}}false{{end}}'
        msg: 'Name what to look for: task data:find -- <name>'
    cmds:
      - python3 tools/report.py find {{.CLI_ARGS}}

  media:fetch:
    desc: Download portraits and machine photos from Wikimedia Commons into assets/media/ and data/media.yaml
    summary: |
      Reads data/media-subjects.yaml. Pass -- --refresh to re-download existing files.
      Needs network access to Wikimedia, so it runs on a local machine, not in the cloud sandbox.
    cmds:
      - python3 tools/fetch_media.py {{.CLI_ARGS}}

  media:dry-run:
    desc: Show which photos media:fetch would download, without writing anything
    cmds:
      - python3 tools/fetch_media.py --dry-run
