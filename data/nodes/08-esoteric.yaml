- id: shakespeare
  name: Shakespeare Programming Language
  aliases: [SPL]
  kind: language
  category: esoteric
  cluster: esoteric/natural-language
  origin:
    first_appeared: { year: 2001, precision: year }
    places: [{ institution: KTH Royal Institute of Technology, city: Stockholm, country: SE }]
  creators: [{ name: Karl Hasselström, role: designer }, { name: Jon Åslund, role: designer }]
  status: historical
  summary: "Programs read like plays: variables are characters, assignment is insult or compliment. A satire of 'English-like' languages descended from FLOW-MATIC and COBOL."
  notes: >
    The Esolang wiki compares its syntax to COBOL and Visual Basic ("superficially similar"), without claiming influence.
  research_status: stub
  confidence: high
  sources: [esolangs-shakespeare]
  example:
    title: Juliet says 'H'
    language: Shakespeare Programming Language
    note: Characters are variables. A noun is worth 1 and each adjective doubles it, so 'a big big big big big big cat' is 64 and 'a big big big cat' is 8. Juliet sets Romeo to their sum, 72, and 'Speak your mind!' makes Romeo print it as the character H.
    code: |
      The Letter H.

      Romeo, a listener.
      Juliet, a speaker.

                          Act I: The only act.
                          Scene I: The only scene.

      [Enter Romeo and Juliet]

      Juliet:
        You are as lovely as the sum of a big big big big big big cat
        and a big big big cat. Speak your mind!

      [Exeunt]
    sources: [esolangs-shakespeare]

- id: piet
  name: Piet
  kind: language
  category: esoteric
  cluster: esoteric/2d
  origin:
    first_appeared: { year: 2001, precision: circa }
    places: [{ country: AU }]
  creators: [{ name: David Morgan-Mar, role: designer }]
  status: historical
  tags:
    paradigm: [stack-oriented]
    features: [two-dimensional]
  summary: "Programs are abstract images in the style of Piet Mondrian; instructions are encoded in hue and lightness changes between colour blocks."
  research_status: stub
  confidence: high
  sources: [esolangs-piet]
  example:
    title: A program is a picture
    language: Piet (described in pseudocode)
    note: Piet source is an image, so it cannot be shown as text. The interpreter moves between blocks of colour; the change in hue and lightness from one block to the next selects the command, and the size of the block just left is the number pushed. The pseudocode describes a picture that prints 'H'.
    code: |
      block of 72 red codels      → (step to next hue)       = push 72
      lightness one step darker   → (step to next block)     = out(char)   prints "H"
      a block boxed in by black   → no way out               = program ends
    sources: [esolangs-piet]

- id: whitespace
  name: Whitespace
  kind: language
  category: esoteric
  cluster: esoteric/hostile
  origin:
    first_appeared: { year: 2003, date: "2003-04-01", precision: exact }
    places: [{ institution: Durham University, city: Durham, country: GB }]
  creators: [{ name: Edwin Brady, role: designer }, { name: Chris Morris, role: designer }]
  status: historical
  tags:
    paradigm: [stack-oriented]
  summary: "Only spaces, tabs and newlines are significant, so programs are invisible and can hide inside other source code. Brady later created the dependently typed language Idris."
  research_status: stub
  confidence: high
  sources: [esolangs-whitespace]
  example:
    title: Printing 'H', made visible
    language: Whitespace
    note: Only space (S), tab (T) and line feed (L) count; everything else is a comment. Shown here with the invisible characters spelled out. S S pushes a number written in binary with S as 0 and T as 1 (the first S is the + sign); T L S S prints a character; L L L ends.
    code: |
      S S  S T S S T S S S L     push +1001000 (72, 'H')
      T L  S S                   output character
      L L  L                     end program
    sources: [esolangs-whitespace]

