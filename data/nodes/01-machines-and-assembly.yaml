    - { name: Marlyn Meltzer, role: "first programmer (then Marlyn Wescoff)" }
    - { name: Frances Spence, role: "first programmer (then Frances Bilas)" }
    - { name: Ruth Teitelbaum, role: "first programmer (then Ruth Lichterman)" }
  status: extinct
  summary: "First programmable general-purpose electronic computer. Originally programmed by setting switches and plugging cables; converted in 1948 to run a fixed set of stored instructions selected from function tables."
  research_status: stub
  confidence: high
  sources: [wiki-eniac]
  example:
    title: Programming by wiring
    language: ENIAC plugboard setup (illustrative pseudocode)
    note: 'Before 1948 a program was a physical configuration: cables carried numbers between accumulators and program pulses between units, and switches set each unit''s operation. Setting up a new problem took days. The pseudocode describes one such wiring for a running sum.'
    code: |
      initiating unit ─pulse→ accumulator 1: receive from constant transmitter
      accumulator 1 done ─pulse→ accumulator 2: receive (add) from acc 1
      accumulator 2 done ─pulse→ master programmer: repeat 10 times
      master programmer done ─pulse→ printer: punch acc 2
    sources: [wiki-eniac]

- id: manchester-baby
  name: Manchester Baby
  aliases: [SSEM]
  kind: machine
  category: research
  cluster: machines/early
  origin:
    first_appeared: { year: 1948, date: "1948-06-21", precision: exact }
    places: [{ institution: Victoria University of Manchester, city: Manchester, country: GB }]
  creators:
    - { name: Frederic Calland Williams, role: designer }
    - { name: Tom Kilburn, role: designer }
    - { name: Geoff Tootill, role: designer }
  status: extinct
  summary: "First electronic stored-program computer to run a program: program and data in the same memory. From here on, a program is data, and machine code is a language in its own right."
  relations:
    - { type: influenced_by, to: turing-machine, weight: weak, confidence: low, note: "The stored-program idea is usually traced to von Neumann's 1945 EDVAC report; Turing's influence on Manchester is debated." }
  research_status: stub
  confidence: high
  sources: [wiki-manchester-baby, von-neumann-1945-edvac]
  example:
    title: Adding with only subtract
    language: SSEM mnemonics
    year: 1948
    note: 'The Baby had seven instructions and no add: LDN loads the negated value, SUB subtracts, STO stores, CMP skips the next instruction if the accumulator is negative, JMP/JRP jump, STP halts. a + b is computed as −(−a − b).'
    code: |
      LDN 20    ; acc = −a
      SUB 21    ; acc = −a − b
      STO 22    ; t   = −(a + b)
      LDN 22    ; acc = a + b
      STO 23    ; result
      STP
    sources: [wiki-manchester-baby]

- id: edsac
