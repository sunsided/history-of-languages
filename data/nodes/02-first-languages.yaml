- id: apt
  name: APT
  aliases: [Automatically Programmed Tool]
  kind: language
  category: domain-specific
  cluster: industrial
  origin:
    first_appeared: { year: 1956, precision: year, note: "Infobox \"First appeared: 1956\"; Ross led the effort from 1956 at the MIT Servomechanisms Laboratory. Ross's own history is \"Origins of the APT Language for Automatically Programmed Tools\" (1978)." }
    places: [{ institution: MIT Servomechanisms Laboratory, country: US }]
  creators:
    - { name: Douglas T. Ross, role: designer }
  status: legacy
  tags:
    paradigm: [imperative]
    features: [standardization]
    domain: [industrial-automation]
  summary: >
    "a high-level computer programming language most commonly used to generate instructions for numerically
    controlled machine tools", defining geometry (points, lines, circles, planes) and then tool motions relative to it.
    "The original version was created before even FORTRAN was available"; later versions were rewritten in FORTRAN. It is
    "the predecessor to modern computer aided manufacturing (CAM) systems" and spawned ADAPT, EXAPT, UNIAPT and the
    robot language RAPT.
  research_status: stub
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/APT_(programming_language)" }
  sources: [wiki-apt]
  example:
    title: Geometry, then tool motion
    language: APT
    note: "Wikipedia's \"Tool path for APT-1 program\", shortened (unit, post-processor and tool-load lines, L3, C2 and the later motion statements left out)."
    code: |
      PARTNO APT-1
      $$ GEOMETRY DEFINITION
      P1 = POINT / 50, 50, 0
      P2 = POINT / -50, -50, 0
      L1 = LINE / P1, PARLEL, (LINE / YAXIS)
      L2 = LINE / P2, PERPTO, L1
      L4 = LINE / P1, PERPTO, L1
      C1 = CIRCLE / XSMALL, L1, YLARGE, L2, RADIUS, 30
      PLAN1 = PLANE / 0, 0, 1, 0
      PLAN2 = PLANE / PARLEL, PLAN1, ZSMALL, 16
      $$ MOTION COMMANDS
      CUTTER / 20
      FROM / (STRTPT = POINT / 70, 70, 0)
      GO / TO, L1, TO, PLAN2, TO, L4
      TLLFT, GOLFT / L1, TANTO, C1
      GOFWD / C1, TANTO, L2
      GOTO / STRTPT
      FINI
    sources: [wiki-apt]

