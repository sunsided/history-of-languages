- id: algol-68
  name: ALGOL 68
  kind: language
  category: general
  cluster: algol
  origin:
    first_appeared: { year: 1968, date: "1968-12", precision: exact, note: "Final report adopted by IFIP WG 2.1 December 1968; Revised Report 1973/75." }
    places: [{ institution: IFIP Working Group 2.1, country: NL }]
  creators:
    - { name: Adriaan van Wijngaarden, role: lead editor }
    - { name: "Barry Mailloux, John Peck, Kees Koster", role: editors }
  status: extinct
  tags:
    paradigm: [imperative, structured]
    typing: [static-typing, strong-typing]
    concurrency: [parallel-clauses, semaphores]
    features: [orthogonality, operator-overloading, references, unions, expression-oriented, declarations-anywhere]
  summary: >
    Radically orthogonal successor to ALGOL 60, defined with two-level (van Wijngaarden) grammars that
    many found impenetrable. The dissent of Wirth, Hoare and Dijkstra over it produced Pascal and the
    "Minority Report". Rarely used, but deeply influential: Ritchie credits it for C's type
    composition, and Stroustrup for C++ operator overloading, references and declarations anywhere.
  relations:
    - { type: successor_of, to: algol-60, weight: strong, confidence: high }
  research_status: draft
  confidence: high
  sources: [lindsey-1993-history-algol68, ritchie-1993-development-c, stroustrup-1993-hopl2]
  example:
    title: Modes, operators, expressions everywhere
    language: ALGOL 68
    note: User-defined modes (types) and operator overloading, which Stroustrup cites as the source of C++'s. (a | b | c) is a conditional expression, and every construct yields a value.
    code: |
      BEGIN
        MODE VEC = STRUCT (REAL x, y);
        OP + = (VEC a, b) VEC: (x OF a + x OF b, y OF a + y OF b);

        PROC fact = (INT n) INT: (n = 0 | 1 | n * fact(n - 1));

        VEC v := (1.0, 2.0) + (3.0, 4.0);
        print((fact(10), x OF v, newline))
      END
    sources: [lindsey-1993-history-algol68, stroustrup-1993-hopl2]

- id: b
  name: B
  kind: language
  category: systems
  cluster: c-family
  origin:
    first_appeared: { year: 1969, precision: year }
    places: [{ institution: Bell Labs, city: Murray Hill NJ, country: US }]
  creators:
    - { name: Ken Thompson, role: designer }
    - { name: Dennis Ritchie, role: contributor }
  status: extinct
  tags:
    paradigm: [imperative, procedural, structured]
    typing: [typeless]
    features: [increment-operators]
  summary: >
    Thompson's terse, typeless reduction of BCPL for the PDP-7 Unix. Introduced `++`/`--` and
    `=` for assignment. Its typelessness failed on the byte-addressed PDP-11, which is why Ritchie
    added types and created C. Kernighan's 1972 B tutorial has the first known "hello, world".
  relations:
    - { type: successor_of, to: bcpl, weight: strong, confidence: high, note: "Ritchie: 'BCPL squeezed into 8K bytes of memory and filtered through Thompson's brain'." }
  research_status: draft
  confidence: high
  sources: [ritchie-1993-development-c]
  example:
    title: "The first \"hello, world\""
    language: "B"
    year: 1973
    note: "From Kernighan's 'A Tutorial Introduction to the Language B'. B words held four characters, hence the three externals. *n is B's newline escape (C later chose \\n)."
    code: |
      main( ) {
        extrn a, b, c;
        putchar(a); putchar(b); putchar(c); putchar('!*n');
      }

      a 'hell';
      b 'o, w';
      c 'orld';

- id: forth
  name: Forth
  kind: language
  category: systems
  cluster: stack
  origin:
    began: { year: 1968, precision: circa }
    first_appeared: { year: 1970, precision: year, note: "Moore's work at NRAO; name from 1970." }
    places: [{ institution: National Radio Astronomy Observatory, country: US }]
  creators: [{ name: Charles H. Moore, role: designer }]
  status: legacy
  tags:
    paradigm: [concatenative, stack-oriented, imperative]
    typing: [typeless]
    features: [threaded-code, metaprogramming, repl]
    domain: [embedded]
  summary: "Stack-based, extensible language where the programmer defines new words that become part of the language. Ancestor of PostScript and Factor, and of the esoteric FALSE and its descendants."
  research_status: draft
  confidence: high
  sources: [rather-colburn-moore-1993-forth]
  example:
    title: "Defining a word"
    language: "Forth"
    note: "Everything goes through the data stack. ( n -- n*n ) is a stack-effect comment; . pops and prints, so this prints 25."
    code: |
      : SQUARE  ( n -- n*n )  DUP * ;
      5 SQUARE .
