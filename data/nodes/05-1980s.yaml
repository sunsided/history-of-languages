- id: cpp
  name: C++
  aliases: [C with Classes]
  kind: language
  category: systems
  cluster: c-family
  origin:
    began: { year: 1979, date: "1979-04", precision: exact, note: "Work began April 1979 at Bell Labs; Cpre preprocessor running October 1979." }
    first_appeared: { year: 1985, date: "1985-10", precision: exact, note: "Cfront Release 1.0 and 'The C++ Programming Language', 1985. Named C++ in December 1983 (suggested by Rick Mascitti)." }
    places: [{ institution: Bell Labs Computing Science Research Center, city: Murray Hill NJ, country: US }]
  creators: [{ name: Bjarne Stroustrup, role: designer }]
  status: active
  tags:
    paradigm: [object-oriented, imperative, procedural, generic-programming, functional, multi-paradigm]
    typing: [static-typing, type-inference]
    memory: [manual-memory, raii, pointers, move-semantics]
    concurrency: [threads, atomics, memory-model, coroutines]
    features: [classes, inheritance, virtual-dispatch, operator-overloading, references, templates, exceptions, multiple-inheritance, lambdas, concepts, modules, line-comments, declarations-anywhere, compile-time-evaluation]
  milestones:
    - { version: C with Classes, year: 1980, introduces: [classes, inheritance], summary: "Classes, derived classes, access control, constructors/destructors, via the Cpre preprocessor." }
    - { version: "C++ (Cfront 1.0)", year: 1985, introduces: [virtual-dispatch, operator-overloading, references], summary: "Virtual functions (1983) made it object-oriented in Stroustrup's own terms." }
    - { version: Cfront 2.0, year: 1989, introduces: [multiple-inheritance], summary: "Multiple inheritance, abstract classes." }
    - { version: C++98, year: 1998, introduces: [templates, exceptions, generic-programming, standardization], summary: "First ISO standard; the STL (Stepanov) brings generic programming." }
    - { version: C++11, year: 2011, introduces: [lambdas, move-semantics, threads, atomics, memory-model, type-inference], summary: "auto, lambdas, rvalue references, std::thread, memory model, futures." }
    - { version: C++14, year: 2014 }
    - { version: C++17, year: 2017 }
    - { version: C++20, year: 2020, introduces: [concepts, coroutines, modules], summary: "Concepts, stackless coroutines (co_await), modules, ranges." }
    - { version: C++23, year: 2023 }
    - { version: C++26, year: 2026, introduces: [compile-time-evaluation], summary: "Static reflection, contracts, std::execution (senders/receivers). Check final status after publication." }
  summary: >
    Stroustrup wanted Simula's classes, which had helped him structure a distributed-systems
    simulator during his Cambridge PhD, with BCPL/C-level efficiency, since Simula's implementation had
    nearly sunk that project. He knew Smalltalk and deliberately chose Simula's statically typed model.
    C++ then grew into the main vehicle for zero-overhead abstraction and generic programming.
  relations:
    - { type: superset_of, to: c, weight: strong, confidence: high, note: "Nearly a superset; C and C++ have diverged in details." }
    - { type: influenced_by, to: simula, aspects: [classes, inheritance, virtual-dispatch, static-typing], weight: strong, confidence: high, note: "'C++ was designed to provide Simula's facilities for program organization together with C's efficiency and flexibility for systems programming.' (HOPL-II, §1)" }
    - { type: influenced_by, to: algol-68, aspects: [operator-overloading, references, declarations-anywhere], weight: moderate, confidence: high, note: "Stroustrup, HOPL-II §2.4.4." }
    - { type: influenced_by, to: bcpl, aspects: [line-comments], weight: weak, confidence: high }
    - { type: influenced_by, to: ada, aspects: [templates, exceptions], weight: moderate, confidence: high, note: "Post-1985 evolution 'shows the influence of ideas from Ada, Clu, and ML.' (HOPL-II §2.4.4)" }
    - { type: influenced_by, to: clu, aspects: [exceptions, generics], weight: moderate, confidence: high }
    - { type: influenced_by, to: ml, aspects: [exceptions, parametric-polymorphism], weight: moderate, confidence: high }
  research_status: reviewed
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/C%2B%2B", homepage: "https://isocpp.org" }
  sources: [stroustrup-1993-hopl2, stroustrup-1994-design-evolution, stroustrup-2007-hopl3, stroustrup-2020-hopl4]
  example:
    title: Classes, virtual functions, RAII
    language: C++ (C++17)
    note: 'Simula''s class/virtual pair, statically typed, at C''s cost: no garbage collector, objects can live on the stack, and the destructor runs deterministically at scope exit (RAII). unique_ptr frees the Circle without a delete. Tested with g++ -std=c++17.'
    code: |
      #include <iostream>
      #include <memory>

      struct Shape {
          virtual ~Shape() = default;
          virtual double area() const = 0;
      };

      struct Circle : Shape {
          double r;
          explicit Circle(double r) : r(r) {}
          double area() const override { return 3.14159265 * r * r; }
      };

      int main() {
          std::unique_ptr<Shape> s = std::make_unique<Circle>(2.0);
          std::cout << s->area() << '\n';   // 12.5664
      }                                     // s freed here
    sources: [stroustrup-1993-hopl2]

- id: objective-c
  name: Objective-C
  kind: language
  category: general
  cluster: oop/simula-smalltalk
  origin:
    first_appeared: { year: 1984, precision: circa, note: "Developed early 1980s at Productivity Products International (later Stepstone)." }
    places: [{ institution: Productivity Products International (Stepstone), country: US }]
  creators:
    - { name: Brad Cox, role: designer }
    - { name: Tom Love, role: co-founder }
  status: legacy
  tags:
    paradigm: [object-oriented, imperative]
    typing: [static-typing, dynamic-typing]
    memory: [reference-counting]
    features: [message-passing, late-binding, categories, protocols, blocks-closures]
  milestones:
    - { version: NeXTSTEP adoption, year: 1988 }
    - { version: Objective-C 2.0, year: 2006, summary: "Properties, fast enumeration, optional GC." }
    - { version: ARC, year: 2011, introduces: [reference-counting], summary: "Automatic Reference Counting." }
  summary: >
    The other way to put objects on C: Smalltalk's dynamic message sending bolted onto C, the road
    C++ did not take. Via NeXT it became the language of macOS and iOS until Swift. Together with C++
    it shows the two answers to the same question in the same few years.
  relations:
    - { type: superset_of, to: c, weight: strong, confidence: high }
    - { type: influenced_by, to: smalltalk, aspects: [message-passing, late-binding], weight: strong, confidence: high }
  research_status: draft
  confidence: high
  sources: [cox-naroff-hsu-2020-objc]
  example:
    title: Smalltalk messages on C
    language: Objective-C
    note: 'Square brackets send a message, resolved at run time by name (selector), as in Smalltalk; respondsToSelector: asks an object whether it understands a message. Compare the C++ sample: same goal, opposite design.'
    code: |
      #import <Foundation/Foundation.h>

      @interface Greeter : NSObject
      - (void)greet:(NSString *)name;
      @end

      @implementation Greeter
      - (void)greet:(NSString *)name {
          NSLog(@"Hello, %@", name);
      }
      @end

      int main(void) {
          id g = [[Greeter alloc] init];
          if ([g respondsToSelector:@selector(greet:)])
              [g greet:@"world"];
          return 0;
      }
    sources: [cox-naroff-hsu-2020-objc]

