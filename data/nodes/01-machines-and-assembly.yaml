      function   spare  address       length
      A          0      0001000110    F (0)       =  A 70 F
    sources: [wiki-edsac]

- id: ibm-650
  name: IBM 650
  kind: machine
  category: business
  cluster: machines/ibm
  origin: { first_appeared: { year: 1954, precision: year }, places: [{ institution: IBM, country: US }] }
  status: extinct
  summary: "Drum-memory computer, the first mass-produced computer (about 2000 units). Hosted SOAP and early compilers."
  research_status: stub
  confidence: high
  sources: [wiki-ibm-650]
  example:
    title: A one-card program that clears the drum
    language: IBM 650 machine code
    note: IBM's example from Programming Bulletin 5, as reproduced on Wikipedia. Each instruction is op code, data address, next-instruction address. The program copies itself into the accumulator and runs an instruction there, decrementing its data address each pass, to set most of the drum to minus zero. The console switches (8000) are set to a read instruction to start it.
    code: |
      loc   op       data next   comment
      8000  RD  70   0004 xxxx   read the load card
      0004  RSU 61   0008 0007   upper accumulator := -2019990003
      0007  LD  69   0006 0005   distributor := 0100008000
      0005  STD 24   0000 8003   store it in 0000; continue in the accumulator
      8003  STL 20   1999 0003   store lower accumulator (minus zero) at 1999
      0003  AU  10   0001 8003   decrement that data address, loop
      0000  HALT 01  0000 8000   stop

      card: 0001 0000010000  0002 0000000000-  0003 1000018003  0004 6100080007
            0005 2400008003  0006 0100008000   0007 6900060005  0008 2019990003
    sources: [wiki-ibm-650]

- id: ibm-704
  name: IBM 704
  kind: machine
  category: scientific
  cluster: machines/ibm
  origin: { first_appeared: { year: 1954, precision: year }, places: [{ institution: IBM, country: US }] }
  status: extinct
  summary: "First mass-produced computer with floating-point hardware and index registers. Home of SAP, FORTRAN and the first Lisp; Lisp's CAR and CDR are named after 704 register fields."
  research_status: stub
  confidence: high
  sources: [wiki-ibm-704, mccarthy-1978-history-lisp]
  example:
    title: Single-address accumulator machine
    language: IBM 704 machine instructions
    note: One address per instruction, an accumulator, and index registers. The 704's 36-bit word split into an address part and a decrement part; Lisp's CAR and CDR are 'Contents of the Address/Decrement part of Register'.
    code: |
      CLA  A     ; clear and add: AC = A
      ADD  B     ; AC = AC + B
      STO  C     ; C = AC
      HTR  0     ; halt
    sources: [wiki-ibm-704, mccarthy-1978-history-lisp]

