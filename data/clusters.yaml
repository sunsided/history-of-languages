- id: industrial
  name: Industrial, real-time and synchronous languages
  summary: "PLC languages of IEC 61131-3, robot and machine-tool languages, telecom switching languages and synchronous languages such as Esterel and Lustre."
  research_status: stub
  backlog:
    - { name: "KUKA Robot Language", hint: "KUKA's proprietary Pascal-like robot language, .dat/.src files (Wikipedia). No year." }
    - { name: "Promela", hint: "Gerard J. Holzmann's verification modelling language for the SPIN model checker (Wikipedia). No year on the page." }
    - { name: "RSL", hint: "The list's RSL link points to a Robot Battle section that no longer exists (redirects to GarageGames). Unresolved." }
    - { name: "S2", hint: "S2 redirects to LiveJournal, where it is the journal-template language; no year or authors." }
  research_questions:
    - "Signal, G-code, IEC Instruction List, TTCN and Spin have no documented relation to existing nodes. Searched: Le Guernic et al. 1991 and Benveniste et al. 2003 (Signal is only contrasted with Lustre), NBS IR 76-1094 (RS-274 approved January 1963; no statement that it derives from APT), Wikipedia's Instruction list and Spin articles, ETSI ES 201 873-1 front matter."
    - "APT's output reaches machines as RS-274 G-code via post-processors and later APT versions were written in Fortran (Wikipedia only); both need a dated primary source before an apt targets g-code or implemented_in fortran edge. The first ANSI APT standard, X3.37, was published in June 1974 (NBS IR 76-1094)."
    - "Esterel began in 1982 (Marmorat and Rigault's robot car, per Berry's v5 primer), which conflicts with the node's 1980 decade dating; the primer says its design was influenced by Harel's Statecharts (1984) and the Argos variant, which are not nodes."
    - "Missing nodes met while connecting industrial languages: Statecharts, Argos, Click (P4 rejects it as 'insufficiently constrained'), PacketTypes and PADS (ideas borrowed by P4), STEP 5 Statement List and DIN 19239, ASN.1 (embedded in TTCN-3), Parallax Propeller and its assembly."
- id: hardware
  name: Hardware description languages
  summary: "Languages for describing digital and analog circuits: register-transfer notations, PLD languages, VHDL and Verilog, and HDLs embedded in Scala, Haskell and Python."
  collapsed: true
  research_status: stub
  key_sources: [wiki-hardware-description-language]
  research_questions:
    - "Superlog vs SystemVerilog: read Flake et al., \"Verilog HDL and its ancestors and descendants\" (HOPL IV, 2020) for Superlog's first release, its C features and whether it was a strict superset of Verilog; it would also settle the Verilog date question above and could add HILO as a node."
    - "Vera/OpenVera: who designed Vera, and when was it first sold? A tutorial site says it began inside Sun Microsystems; Systems Science sold it before Synopsys bought the company in July 1998. A Systems Science or Synopsys document is needed."
    - "LALSD: what the name stands for, where S. Y. H. Su developed it, and the date of the first version (LALSD II was presented at CHDL in September 1981)."
    - "KARL and ABL: read Hartenstein, \"KARL and ABL\" (1993) and the 1979 CHDL paper for KARL's first version, KARL-II/III and ABL's date; Girardi's first name is needed for an ABL creators entry."
    - "CDL: read Chu's CACM paper (October 1965) for what it took from ALGOL 60; Barbacci, Bell and Newell (1974) are reported to date CDL to 1964."
    - "Lava: muFP (Sheeran, 1985) and Ruby (Jones and Sheeran, 1990) are Lava's stated ancestors and are not nodes yet; Confluence (about 2003) inspired Hardcaml."
    - "Lola: Wikipedia's Lola article dates it June 1995 (Wirth's book Digital Circuit Design), the Niklaus Wirth article says he published it in 1991. Find Wirth's 1990s ETH reports."
    - "Bluespec: the Wikipedia article gives no first-release year (company 2003, category 'created in 2000'). Find Augustsson's or Arvind's own account."
    - "Verilog: 1984 (infobox, design late 1983 to early 1984) or 1985 (Gateway's introduction, Wikipedia: HDL)? Find Moorby's own history."
    - "VHDL-AMS and Verilog-AMS are kept as notes on vhdl and verilog. Promote to nodes if a dated defining standard is read (IEEE 1076.1-1999?)."
    - "SystemC is a C++ class library (Wikipedia: \"strictly a C++ class library\"), recorded as a note on cpp. Revisit if the hardware cluster needs it as a node."
