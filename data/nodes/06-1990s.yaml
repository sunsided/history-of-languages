    code: |
      implement Hello;
      include "sys.m"; sys: Sys;
      include "draw.m";

      Hello: module { init: fn(nil: ref Draw->Context, nil: list of string); };

      init(nil: ref Draw->Context, nil: list of string)
      {
          sys = load Sys Sys->PATH;
          c := chan of int;
          spawn worker(c);
          sys->print("%d\n", <-c);
      }

      worker(c: chan of int) { c <-= 42; }
