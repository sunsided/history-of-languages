    The GNU Project's assembler, first written for the VAX. On x86 its
    default is AT&T syntax, for which the System V AT&T assembler was the reference; since version 2.10 the
    .intel_syntax directive switches to Intel syntax.
  relations:
    - { type: influenced_by, to: x86-att-syntax, weight: strong, confidence: medium, sources: [wiki-gas, wiki-comparison-of-assemblers], note: "\"The default syntax is AT&T syntax\"; the AT&T assembler \"was used as a reference for GAS\"." }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/GNU_Assembler" }
  sources: [wiki-gas, wiki-comparison-of-assemblers]
  example:
    title: Hello, world on 32-bit Linux
    language: GAS (AT&T syntax, i386)
    note: "From Wikipedia's GNU Assembler article. Registers carry %, immediates $, the l suffix means 32-bit, and the source operand comes first; int $0x80 calls the Linux kernel (4 = write, 1 = exit)."
    code: |
      .global _start
      .text
      _start:
      movl $4, %eax # 4 (code for "write" syscall) -> EAX register
      movl $1, %ebx # 1 (file descriptor for stdout) -> EBX (1st argument to syscall)
      movl $msg, %ecx # 32-bit address of msg string -> ECX (2nd argument)
      movl $len, %edx # length of msg string -> EDX (3rd arg)
      int $0x80 # interrupt with location 0x80 (128), which invokes the kernel's system call procedure
      movl $1, %eax # 1 ("exit") -> EAX
      movl $0, %ebx # 0 (with success) -> EBX
      int $0x80 # see previous
      .data
      msg:
      .ascii "Hello, world!\n" # inline ascii string
      len = . - msg # assign (current address - address of msg start) to symbol "len"
    sources: [wiki-gas]

