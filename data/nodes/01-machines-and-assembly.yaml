- id: nacl
  name: Native Client
  aliases: [NaCl, Google Native Client]
  kind: assembly
  category: systems
  cluster: assembly/x86
  origin:
    first_appeared: { year: 2008, date: "2008-12-08", precision: exact, note: "Introduced to the public on 8 December 2008; generally available in stable Chrome (version 14) in September 2011." }
    places: [{ institution: Google, country: US }]
  creators:
    - { name: Bennet Yee, role: co-author of the 2009 paper }
    - { name: David Sehr, role: co-author of the 2009 paper }
    - { name: Gregory Dardyk, role: co-author of the 2009 paper }
    - { name: J. Bradley Chen, role: co-author of the 2009 paper }
    - { name: Robert Muth, role: co-author of the 2009 paper }
    - { name: Tavis Ormandy, role: co-author of the 2009 paper }
    - { name: Shiki Okasaka, role: co-author of the 2009 paper }
    - { name: Neha Narula, role: co-author of the 2009 paper }
    - { name: Nicholas Fullagar, role: co-author of the 2009 paper }
  status: extinct
  tags:
    paradigm: [imperative]
    domain: [web]
  milestones:
    - { version: ARM, year: 2010, summary: "ARM implementation released in March 2010; x86-64 and MIPS were also supported later." }
  summary: >
    A sandbox for running compiled C and C++ as native machine code in the browser. Modules were ordinary x86
    executables restricted by validator rules: no instruction may straddle a 32-byte boundary, and every indirect
    jump goes through a masking "nacljmp" sequence, so the code can be checked before it runs. Deprecated in favour
    of WebAssembly; Chrome removed it in 2022 and ChromeOS kept it until 2025.
  relations:
    - { type: subset_of, to: intel-8086, weight: strong, confidence: high, sources: [yee-2009-nacl], note: "\"Native Client: A Sandbox for Portable, Untrusted x86 Native Code\"; the 2009 paper's modules are 32-bit x86 executables obeying constraints C1-C7. ARM, x86-64 and MIPS came later." }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Google_Native_Client", homepage: "https://developer.chrome.com/docs/native-client/" }
  sources: [yee-2009-nacl, wiki-nacl, chrome-nacl-docs]
  example:
    title: The nacljmp sandboxing sequence
    language: x86 machine code under NaCl rules
    note: "From Yee et al. 2009, section 3.1, operands as the paper writes them. Masking the target with 0xffffffe0 forces every indirect jump onto a 32-byte-aligned address; together with the rule that no instruction crosses a 32-byte boundary, the validator can prove all reachable code was disassembled and checked. \"Encoded as a three-byte and and a two-byte jmp\"."
    code: |
      and %eax, 0xffffffe0
      jmp *%eax
    sources: [yee-2009-nacl]

