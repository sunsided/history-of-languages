- id: ibm-bal
  name: IBM Basic Assembly Language / HLASM
  aliases: [BAL, Assembler H, HLASM]
  kind: assembly
  category: systems
  cluster: assembly/ibm
  origin: { first_appeared: { year: 1964, precision: year }, places: [{ institution: IBM, country: US }] }
  status: active
  summary: "Assembler family for System/360 and successors, with a powerful macro language. HLASM (1992) is still used for z/OS."
  milestones:
