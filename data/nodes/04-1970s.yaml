- id: ucsd-pascal
  name: UCSD Pascal
  aliases: [UCSD p-System, Apple Pascal]
  kind: language
  category: educational
  cluster: algol/pascal-dialects
  origin:
    first_appeared: { year: 1977, date: "1977-08", precision: exact, note: "\"UCSD Pascal was first released in 1977\"; infobox: August 1977." }
    places: [{ institution: "University of California, San Diego", city: San Diego, country: US }]
  creators:
    - { name: Kenneth Bowles, role: "project lead" }
  status: extinct
  tags:
    paradigm: [imperative, procedural, structured]
    typing: [static-typing, strong-typing]
    features: [bytecode-vm, intermediate-code, separate-compilation]
    domain: [education]
  summary: >
    Kenneth Bowles's Pascal system for students at UC San Diego: compiler, editor and operating system running on
    a portable p-code virtual machine, "based on the Pascal-P2 release of the portable compiler from Zurich". It
    added "variable length strings, and 'units' of independently compiled code", and as Apple Pascal and the
    SofTech p-System it spread Pascal across microcomputers; Wirth credited it "with popularizing Pascal".
    James Gosling cites it as a key influence on the Java virtual machine.
  notes: >
    Versions I.3 and I.5 stayed at UCSD; II was the widely distributed one (Apple Pascal); III ran on the
    Western Digital Pascal MicroEngine; IV was SofTech's commercial line (IV.2.2 R1.1, December 1987). Years
    for II and III were not found.
  relations:
    - { type: dialect_of, to: pascal, weight: strong, confidence: high, sources: [wiki-ucsd-pascal], note: "Based on Pascal-P2 and Urs Ammann's p-code." }
  research_status: draft
  confidence: medium
  links: { wikipedia: "https://en.wikipedia.org/wiki/UCSD_Pascal" }
  sources: [wiki-ucsd-pascal]
  example:
    title: A separately compiled unit
    language: UCSD Pascal
    note: "Illustrative. No UCSD Pascal code was found in the sources read (the SofTech manual on bitsavers could not be fetched). Shows the UNIT/INTERFACE/IMPLEMENTATION structure and the STRING type UCSD added to Pascal; the exact syntax is unverified."
    code: |
      UNIT GREET;
      INTERFACE
        PROCEDURE HELLO(NAME: STRING);
      IMPLEMENTATION
        PROCEDURE HELLO;
        BEGIN
          WRITELN('HELLO, ', NAME)
        END;
      END.
    sources: [wiki-ucsd-pascal]

- id: nqthm
  name: Nqthm
  aliases: [Boyer-Moore theorem prover]
  kind: language
  category: research
  cluster: verification
  origin:
    began: { year: 1971, precision: year, note: "\"They began work on the system in 1971 in Edinburgh, Scotland.\"" }
    first_appeared: { year: 1971, precision: circa, note: "Release year not found; dated by the start of work." }
  creators:
    - { name: Robert S. Boyer, role: designer }
    - { name: J Strother Moore, role: designer }
  status: historical
  tags:
    paradigm: [functional]
    domain: [theorem-proving]
  summary: >
    The Boyer-Moore theorem prover: an automatic prover whose logic is "a variant of Pure LISP", built on
    top of Lisp, proving theorems about recursive functions largely by induction and rewriting. Started in
    Edinburgh in 1971 and continued at the University of Texas at Austin; the precursor of ACL2.
  relations:
    - { type: influenced_by, to: lisp, weight: strong, confidence: high, sources: [wiki-nqthm], note: "\"They used a variant of Pure LISP as the working logic.\"" }
  research_status: draft
  confidence: medium
  links: { wikipedia: "https://en.wikipedia.org/wiki/Nqthm" }
  sources: [wiki-nqthm]
  example:
    title: Commutativity of multiplication
    language: Nqthm
    note: "From Wikipedia's Nqthm article: a lemma stated in Lisp syntax and handed to the prover, which finds the proof itself; (rewrite) tells it to use the proved lemma as a rewrite rule afterwards."
    code: |
      (prove-lemma commutativity-of-times (rewrite)
        (equal (times x z) (times z x)))
    sources: [wiki-nqthm]
