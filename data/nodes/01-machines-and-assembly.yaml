  example:
    title: An order in memory
    language: EDSAC order format
    year: 1949
    note: 'An order was 17 bits: a 5-bit function code (written as a letter on the teleprinter), a spare bit, a 10-bit address, and a length bit for short (F) or long (D) numbers. ''A 70 F'' means add the short number at 70 to the accumulator.'
