- id: cobol
  name: COBOL
  aliases: ["COmmon Business-Oriented Language"]
  kind: language
  category: business
  cluster: business
  origin:
    began: { year: 1959, date: "1959-05", precision: exact, note: "Pentagon meeting that formed CODASYL." }
    first_appeared: { year: 1960, precision: year, note: "COBOL-60 specification; first programs ran December 1960 on RCA 501 and UNIVAC II." }
    places: [{ institution: CODASYL (US Department of Defense sponsored), city: Washington DC, country: US }]
  creators:
    - { name: CODASYL Short-Range Committee, role: designers }
    - { name: Jean Sammet, role: committee member }
    - { name: Grace Hopper, role: technical consultant }
  status: legacy
  tags:
    paradigm: [imperative, procedural, object-oriented]
    typing: [static-typing]
    features: [english-like-syntax, records, decimal-arithmetic]
    domain: [business-data-processing]
  milestones:
    - { version: COBOL-61, year: 1961 }
    - { version: COBOL-68 (ANSI), year: 1968 }
    - { version: COBOL-74, year: 1974 }
    - { version: COBOL-85, year: 1985, introduces: [structured], summary: "Scope terminators (END-IF), nested programs." }
    - { version: COBOL 2002, year: 2002, introduces: [object-oriented] }
    - { version: COBOL 2014, year: 2014 }
    - { version: COBOL 2023, year: 2023 }
  summary: >
    Committee-designed, English-like business language with hierarchical records and decimal
    arithmetic. Hopper is often called its "mother", but she was an adviser; the design came from
    the CODASYL committee drawing on FLOW-MATIC, IBM's COMTRAN and Honeywell's FACT. Still runs much
    of banking and government.
  relations:
    - { type: influenced_by, to: flow-matic, aspects: [english-like-syntax], weight: strong, confidence: high }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/COBOL" }
  sources: [sammet-1978-early-cobol, wiki-cobol]
