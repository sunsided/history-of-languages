- id: masm
  name: MASM (Microsoft Macro Assembler)
  kind: assembly
  category: systems
  cluster: assembly/x86
  origin: { first_appeared: { year: 1981, precision: year }, places: [{ institution: Microsoft, city: Redmond, country: US }] }
  status: active
  summary: "Microsoft's x86 assembler, with high-level macros (.IF, .WHILE, PROC). The DOS and early Windows standard."
  relations:
    - { type: dialect_of, to: x86-intel-syntax, weight: strong, confidence: high }
  research_status: stub
  confidence: high
  sources: [wiki-masm]
  example:
    title: Hello, world for MS-DOS
    language: MASM 5+
    note: DOS function 09h of INT 21h prints a string terminated by '$'; 4Ch exits. .MODEL and .CODE are MASM's simplified segment directives.
    code: |2
              .MODEL SMALL
              .STACK 100h
              .DATA
      msg     DB 'Hello, world', 13, 10, '$'
              .CODE
      start:  mov  ax, @data
              mov  ds, ax
              mov  ah, 09h
              mov  dx, OFFSET msg
              int  21h
              mov  ax, 4C00h
              int  21h
              END  start
    sources: [wiki-masm]

- id: nasm
  name: NASM (Netwide Assembler)
  kind: assembly
  category: systems
  cluster: assembly/x86
  origin: { first_appeared: { year: 1996, precision: year } }
  creators: [{ name: Simon Tatham, role: original author }, { name: Julian Hall, role: original author }]
  status: active
  summary: "Portable, open-source x86 assembler with a simplified Intel syntax."
  relations:
    - { type: dialect_of, to: x86-intel-syntax, weight: strong, confidence: high }
  research_status: stub
  confidence: high
  sources: [wiki-nasm]
  example:
    title: Hello, world on Linux x86-64
    language: NASM
    note: 'Calls the kernel directly: syscall 1 is write, 60 is exit. Assemble with nasm -felf64 hello.asm && ld hello.o. Tested.'
    code: |2
              global  _start
              section .text
      _start: mov     eax, 1          ; write(
              mov     edi, 1          ;   stdout,
              lea     rsi, [rel msg]  ;   msg,
              mov     edx, len        ;   len)
              syscall
              mov     eax, 60         ; exit(0)
              xor     edi, edi
              syscall
              section .data
      msg:    db      "Hello, world", 10
      len     equ     $ - msg
    sources: [wiki-nasm]

- id: asm-6502
  name: 6502 assembly
  kind: assembly
  category: systems
  cluster: assembly/8-bit
  origin: { first_appeared: { year: 1975, precision: year } }
  status: legacy
  summary: "Accumulator-centred assembly with zero-page addressing; the language of most 8-bit home-computer and console games."
  relations:
    - { type: targets, to: mos-6502, weight: strong, confidence: high }
  research_status: stub
  confidence: high
  sources: [wiki-6502]
  example:
    title: Print a string
    language: 6502 assembly (Apple II)
    note: X indexes the string; BEQ stops at the zero terminator. JSR $FDED calls the Apple II monitor's COUT routine, which expects characters with the high bit set, hence the ORA.
    code: |2
              LDX #0
      LOOP    LDA MSG,X
              BEQ DONE
              ORA #$80
              JSR $FDED     ; COUT
              INX
              BNE LOOP
      DONE    RTS
      MSG     .BYTE "HELLO",0
    sources: [wiki-6502]

- id: asm-z80
  name: Z80 assembly
  kind: assembly
  category: systems
  cluster: assembly/8-bit
  origin: { first_appeared: { year: 1976, precision: year } }
  status: legacy
  summary: "Zilog's mnemonics (LD, JP) for the Z80, a superset of the 8080 instruction set but with a different, cleaner syntax than Intel's 8080 mnemonics."
  relations:
    - { type: targets, to: zilog-z80, weight: strong, confidence: high }
  research_status: stub
  confidence: high
  sources: [wiki-z80]
  example:
    title: Print a string (ZX Spectrum)
    language: Z80 assembly
    note: RST $10 is the Spectrum ROM's print-character routine. OR A sets the zero flag when A is 0, ending the loop at the terminator.
    code: |2
              LD   HL, MSG
      LOOP:   LD   A, (HL)
              OR   A
              RET  Z
              RST  $10
              INC  HL
              JR   LOOP
      MSG:    DEFB "HELLO", 0
    sources: [wiki-z80]

- id: asm-68k
  name: 68k assembly
  kind: assembly
  category: systems
  cluster: assembly/8-bit
  origin: { first_appeared: { year: 1979, precision: year } }
