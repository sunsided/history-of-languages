  research_status: stub
  confidence: medium
  sources: [wiki-ibm-assembler]
  example:
    title: C = A + B
    language: IBM Basic Assembly Language
    note: Register 1 does the arithmetic; F'2' is a fullword constant, DS reserves a fullword. Real programs began with standard linkage (save area, BALR base register), omitted here.
    code: |
      ADDEM    CSECT
               L     1,A        load A into register 1
               A     1,B        add B
               ST    1,C        store into C
               BR    14         return to caller
      A        DC    F'2'
      B        DC    F'3'
      C        DS    F
               END   ADDEM
    sources: [wiki-ibm-assembler]

- id: macro-11
  name: MACRO-11
  kind: assembly
  category: systems
  cluster: assembly/dec
  origin: { first_appeared: { year: 1970, precision: circa }, places: [{ institution: Digital Equipment Corporation, country: US }] }
  status: extinct
  summary: "DEC's macro assembler for the PDP-11. The early Unix kernel was written in PDP-11 assembly before being rewritten in C in 1973."
  relations:
    - { type: targets, to: pdp-11, weight: strong, confidence: high }
  research_status: stub
  confidence: medium
  sources: [wiki-macro-11]
  example:
    title: strcpy in two instructions
    language: MACRO-11
    note: 'The classic string copy: MOVB sets the condition codes from the byte it moved, so BNE loops until the terminating zero has been copied. 1$ is a local label.'
    code: |2
              MOV    #SRC,R1
              MOV    #DST,R2
      1$:     MOVB   (R1)+,(R2)+
              BNE    1$
              HALT
      SRC:    .ASCIZ /HELLO/
      DST:    .BLKB  6
    sources: [wiki-macro-11]

