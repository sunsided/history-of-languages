  sources: [wiki-kaleidoscope]
  example:
    title: A thermometer with constraints
    language: Kaleidoscope
    note: "Wikipedia's \"With constraints\" version; indentation was flattened on the page and is restored here."
    code: |
      always: temperature = mercury.height / scale;
      always: white rectangle( thermometer );
      always: grey rectangle( mercury );
      always: display number( temperature );
      while mouse.button = down do
        mercury.top = mouse.location.y;
      end while;
