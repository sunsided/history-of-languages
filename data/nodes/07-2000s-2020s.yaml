  confidence: medium
  links: { wikipedia: "https://en.wikipedia.org/wiki/F*_(programming_language)", homepage: "https://fstar-lang.org" }
  sources: [wiki-fstar, fstar-lang-org, fstar-tutorial-part1]
  example:
    title: Refinement types and a checked factorial
    language: F*
    note: "From the F* tutorial, \"Getting off the ground\". Refinements carve subsets out of int (Prims defines nat as x:int{x >= 0}); the factorial's result type nat is proved, and \"the proof of termination is automatic\"."
    code: |
      let pos = x:int { x > 0 } //the positive numbers
      let even = x:int { x % 2 = 0 } //the even numbers

      let rec factorial (n:nat)
        : nat
        = if n = 0
          then 1
          else n * factorial (n - 1)
    sources: [fstar-tutorial-part1]

