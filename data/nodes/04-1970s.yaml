    - { name: US Department of Defense (HOLWG), role: sponsor }
  status: active
  tags:
    paradigm: [imperative, structured, object-oriented, modular]
    typing: [static-typing, strong-typing]
    concurrency: [tasks, rendezvous, protected-objects]
    features: [generics, exceptions, packages, contracts]
    domain: [safety-critical, embedded]
  milestones:
    - { version: Ada 83, year: 1983, introduces: [generics, tasks, rendezvous] }
    - { version: Ada 95, year: 1995, introduces: [object-oriented, protected-objects], summary: "First ISO-standard object-oriented language." }
    - { version: Ada 2005, year: 2005 }
    - { version: Ada 2012, year: 2012, introduces: [contracts], summary: "Pre/postconditions, type invariants." }
    - { version: Ada 2022, year: 2023 }
  summary: >
    Commissioned by the US DoD to replace hundreds of languages in embedded systems. Built-in tasks
    with rendezvous, generics and packages. Named after Ada Lovelace. Its generics and exceptions
    influenced C++ templates and exceptions; SPARK is its formally verifiable subset.
  relations:
    - { type: influenced_by, to: pascal, weight: strong, confidence: high }
    - { type: influenced_by, to: algol-68, weight: moderate, confidence: medium }
