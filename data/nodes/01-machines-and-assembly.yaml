  sources: [wiki-x86-assembly]
  example:
    title: Destination first
    language: x86 assembly, Intel syntax
    note: Destination before source, no register sigils, square brackets for memory. Same two instructions as the AT&T sample, assembling to the same bytes (8B 04 8B, 83 C0 05).
    code: |
