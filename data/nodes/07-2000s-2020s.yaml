  sources: [wiki-fish, fish-language-docs]
  example:
    title: No =, no then, no fi
    language: fish 4
    note: "The three pieces are from the Wikipedia fish article and the fish language documentation. Run with fish: prints bar, then I like penguins on Linux."
    code: |
      set foo bar
      echo $foo

      if test "$(uname)" = Linux
          echo I like penguins
      end

      function ll
          ls -l $argv
      end
