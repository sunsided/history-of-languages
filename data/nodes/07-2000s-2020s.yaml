  summary: "A re-engineered C++ by the author of the first native C++ compiler (Zortech). Pioneered compile-time function execution (CTFE) and `static if` that later flowed into C++ constexpr."
  relations:
    - { type: influenced_by, to: cpp, weight: strong, confidence: high }
    - { type: influenced_by, to: c, weight: strong, confidence: high }
    - { type: influenced_by, to: java, weight: moderate, confidence: high }
