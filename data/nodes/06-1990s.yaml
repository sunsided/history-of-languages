- id: quakec
  name: QuakeC
  aliases: [QC]
  kind: language
  category: domain-specific
  cluster: game-scripting
  origin:
    first_appeared: { year: 1996, precision: year, note: "Wikipedia: \"developed in 1996 by John Carmack of id Software\"." }
    places: [{ institution: id Software, country: US }]
  creators:
    - { name: John Carmack, role: designer }
  status: legacy
  tags:
    paradigm: [imperative, procedural]
    domain: [game-scripting]
  summary: >
    "A compiled language developed in 1996 by John Carmack of id Software to program parts of the video game
    Quake", in which the game's items, weapons and monsters are written (as in id's released qw-qc sources). "The
    syntax of QuakeC is based on that of the C programming language."
  relations:
    - { type: influenced_by, to: c, weight: strong, confidence: high, sources: [wiki-quakec], note: "\"The syntax of QuakeC is based on that of the C programming language\"" }
  research_status: draft
  confidence: medium
  links: { wikipedia: "https://en.wikipedia.org/wiki/QuakeC" }
  sources: [wiki-quakec, id-quake-source]
  example:
    title: Respawning an item, from id's QuakeWorld source
    language: QuakeC
    note: "Verbatim from qw-qc/items.qc in id Software's source release. void() SUB_regen = { ... }; is QuakeC's function syntax: the type comes first, then the name is assigned a body."
    code: |
      void() SUB_regen =
      {
      	self.model = self.mdl;          // restore original model
      	self.solid = SOLID_TRIGGER;     // allow it to be touched again
      	sound (self, CHAN_VOICE, "items/itembk2.wav", 1, ATTN_NORM);    // play respawn sound
      	setorigin (self, self.origin);
      };
    sources: [id-quake-source]
