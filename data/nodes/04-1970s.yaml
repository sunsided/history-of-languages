- id: scheme
  name: Scheme
  kind: language
  category: research
  cluster: lisp
  origin:
    first_appeared: { year: 1975, precision: year, note: "MIT AI Memo 349." }
    places: [{ institution: MIT AI Lab, city: Cambridge MA, country: US }]
  creators:
    - { name: Gerald Jay Sussman, role: designer }
    - { name: Guy L. Steele Jr., role: designer }
  status: active
  tags:
    paradigm: [functional, multi-paradigm]
    typing: [dynamic-typing]
    memory: [garbage-collection]
    features: [lexical-scoping, closures, tail-call-optimization, first-class-continuations, hygienic-macros, first-class-functions]
    domain: [education]
  milestones:
    - { version: R2RS, year: 1985 }
    - { version: R4RS, year: 1991, introduces: [hygienic-macros] }
    - { version: R5RS, year: 1998 }
    - { version: R6RS, year: 2007 }
    - { version: R7RS small, year: 2013 }
  summary: >
    Minimal, lexically scoped Lisp written to understand Hewitt's actor model; Sussman and Steele
    found that actors and closures were the same thing. Brought closures, guaranteed tail calls
    and first-class continuations into the mainstream of language design. SICP made it a teaching
    language, and JavaScript's semantics borrow from it.
  relations:
    - { type: dialect_of, to: lisp, weight: strong, confidence: high }
    - { type: influenced_by, to: algol-60, aspects: [lexical-scoping, block-structure], weight: strong, confidence: high }
    - { type: influenced_by, to: actor-model, weight: strong, confidence: high }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Scheme_(programming_language)" }
  sources: [sussman-steele-1975-scheme, steele-gabriel-1993-evolution-lisp]
  example:
    title: Closures and tail calls
    language: Scheme (R7RS)
    note: 'make-counter returns a closure that keeps its own count: state without objects. The named let loop is a tail call, which Scheme guarantees runs in constant space, so loops are just recursion.'
    code: |
      (define (make-counter)
        (let ((n 0))
          (lambda () (set! n (+ n 1)) n)))

      (define c (make-counter))
      (c) (c)                ; => 1, 2

      (let loop ((i 0) (acc 1))
        (if (= i 10) acc
            (loop (+ i 1) (* acc 2))))   ; => 1024
    sources: [sussman-steele-1975-scheme]

- id: actor-model
  name: Actor model
  kind: formalism
  category: research
  cluster: concurrency
  origin:
    first_appeared: { year: 1973, precision: year, note: "Hewitt, Bishop & Steiger, 'A Universal Modular ACTOR Formalism for Artificial Intelligence', IJCAI 1973." }
    places: [{ institution: MIT, city: Cambridge MA, country: US }]
  creators:
    - { name: Carl Hewitt, role: designer }
    - { name: Peter Bishop, role: co-author }
    - { name: Richard Steiger, role: co-author }
  status: active
  tags:
    concurrency: [actors, message-passing]
  summary: "Concurrency as independent actors that only send asynchronous messages, create actors and change their behaviour. Inspired by Smalltalk-72 and Simula; theoretical root of Erlang-style systems (though Erlang's designers say they did not know it) and of Akka."
  relations:
    - { type: influenced_by, to: smalltalk, aspects: [message-passing], weight: moderate, confidence: medium }
    - { type: influenced_by, to: simula, weight: moderate, confidence: medium }
  research_status: draft
  confidence: medium
  sources: [hewitt-1973-actor, armstrong-2007-history-erlang]
  example:
    title: An actor
    language: pseudocode (illustrative)
    note: An actor has private state and a mailbox. On each message it may send messages, create actors, and decide how to handle the next message. There is no shared memory and no reply unless one is sent.
    code: |
      actor Counter(count):
        on Increment:
          become Counter(count + 1)
        on Get(replyTo):
          send replyTo ! Value(count)
    sources: [hewitt-1973-actor]

- id: clu
  name: CLU
  kind: language
  category: research
  cluster: algol/adt
  origin:
    began: { year: 1973, precision: year }
    first_appeared: { year: 1975, precision: circa }
    places: [{ institution: MIT, city: Cambridge MA, country: US }]
  creators:
    - { name: Barbara Liskov, role: designer }
    - { name: Russ Atkinson, role: co-designer }
    - { name: Craig Schaffert, role: co-designer }
    - { name: Alan Snyder, role: co-designer }
  status: extinct
  tags:
    paradigm: [procedural, data-abstraction]
    typing: [static-typing, parametric-polymorphism]
    memory: [garbage-collection]
    features: [abstract-data-types, iterators, exceptions, multiple-assignment, generics]
  summary: "Built around abstract data types ('clusters'). Introduced iterators with yield, checked exceptions-like signalling, parameterized types and multiple return/assignment. Its ideas resurface in C++, Java, Python generators, C#, Ruby and Lua."
  relations:
    - { type: influenced_by, to: simula, aspects: [classes], weight: moderate, confidence: medium }
    - { type: influenced_by, to: algol-60, weight: moderate, confidence: high }
  research_status: draft
  confidence: high
  sources: [liskov-1993-history-clu]
  example:
    title: An iterator
    language: CLU
    note: 'iter ... yields defines a generator that suspends at each yield and resumes on the next loop pass: the ancestor of iterators in Python, C# and Ruby. Note also multiple assignment, a, b := b, a + b.'
    code: |
      fib = iter () yields (int)
          a: int := 0
          b: int := 1
          while true do
              yield(a)
              a, b := b, a + b
              end
          end fib

      % for x: int in fib() do ... end
    sources: [liskov-1993-history-clu]

- id: concurrent-pascal
  name: Concurrent Pascal
  kind: language
  category: systems
  cluster: concurrency
  origin:
    first_appeared: { year: 1975, precision: year }
    places: [{ institution: California Institute of Technology, city: Pasadena, country: US }]
  creators: [{ name: Per Brinch Hansen, role: designer }]
  status: extinct
  tags:
    paradigm: [imperative, structured]
    typing: [static-typing]
    concurrency: [monitors, processes]
  summary: "Pascal extended with processes and monitors; the first language to implement monitors, used to write small operating systems."
  relations:
    - { type: influenced_by, to: pascal, weight: strong, confidence: high }
    - { type: influenced_by, to: simula, aspects: [classes], weight: moderate, confidence: high, note: "Monitors were modelled on Simula classes." }
  research_status: draft
  confidence: high
  sources: [brinch-hansen-1993-monitors]
  example:
    title: A one-slot buffer monitor
    language: Concurrent Pascal
    note: Only one process at a time can be inside a monitor's entry procedures. delay suspends the caller on a queue and releases the monitor; continue wakes the waiting process. Java's synchronized/wait/notify is the same idea.
    code: |
      type buffer = monitor
        var contents: char; full: boolean;
            sender, receiver: queue;

        procedure entry send(c: char);
        begin
          if full then delay(sender);
          contents := c; full := true;
          continue(receiver)
        end;

        procedure entry receive(var c: char);
        begin
          if not full then delay(receiver);
          c := contents; full := false;
          continue(sender)
        end;

      begin full := false end
    sources: [brinch-hansen-1993-monitors]

- id: mesa
  name: Mesa
  kind: language
  category: systems
  cluster: algol/wirth
  origin:
    first_appeared: { year: 1976, precision: circa }
    places: [{ institution: Xerox PARC, city: Palo Alto, country: US }]
  creators:
    - { name: Charles Geschke, role: designer }
    - { name: Butler Lampson, role: designer }
    - { name: Jim Mitchell, role: designer }
  status: extinct
  tags:
    paradigm: [imperative, modular]
    typing: [static-typing, strong-typing]
    concurrency: [monitors, threads]
    features: [modules, exceptions]
  summary: "Strongly typed modular systems language for the Alto/Star workstations. Its monitors and condition variables (Lampson & Redell, 1980) are the model for Java's synchronized/wait/notify. Wirth used it during a sabbatical and built Modula-2 on it."
  relations:
    - { type: influenced_by, to: pascal, weight: strong, confidence: medium }
    - { type: influenced_by, to: algol-68, weight: moderate, confidence: low }
  research_status: draft
  confidence: medium
  sources: [lampson-redell-1980-mesa, wirth-2007-modula2-oberon]
  example:
    title: Monitor with a condition variable
    language: Mesa
    note: 'Approximate. ENTRY procedures hold the monitor lock. WAIT re-checks its condition in a loop because NOTIFY is only a hint: these ''Mesa semantics'' are what Java and POSIX condition variables use today.'
    code: |
      Buffer: MONITOR =
      BEGIN
        nonEmpty: CONDITION;
        count: CARDINAL ← 0;

        Put: PUBLIC ENTRY PROC [c: CHARACTER] =
          BEGIN store[c]; count ← count + 1; NOTIFY nonEmpty END;

        Get: PUBLIC ENTRY PROC RETURNS [c: CHARACTER] =
          BEGIN
            WHILE count = 0 DO WAIT nonEmpty ENDLOOP;
            count ← count - 1; RETURN[fetch[]]
          END;
      END.
    sources: [lampson-redell-1980-mesa]

