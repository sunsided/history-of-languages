  creators:
    - { name: Percy Ludgate, role: designer }
  status: historical
  summary: >
    A design for "a general-purpose Turing-complete computer, and the second of its kind", by the Irish
    amateur Percy Ludgate. It was to store "192 numbers, each containing 20 digits" in "concentric
    cylinders", with "program control (e.g., preemption and subroutines – or microcode, depending on one's
    viewpoint)". "The design is so dissimilar from Babbage's that it can be considered a second, unique type
    of analytical engine". It "incorporated the first multiplier-accumulator". The drawings he mentioned in
    1914 "have never been found".
  notes: >
    In 1960 a patent lawyer working for IBM used Ludgate's paper to defeat a 1941 patent application by
    Konrad Zuse.
