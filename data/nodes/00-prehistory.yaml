# Prehistory: mechanisms, punched cards, notations and formalisms before stored-program computers.
# These are not languages. They are here because the graph needs roots, and because
# "what counts as a program" is itself a story worth showing on the site.

- id: antikythera-mechanism
  name: Antikythera mechanism
  kind: mechanism
  category: scientific
  cluster: prehistory/mechanisms
  origin:
    first_appeared: { year: -150, year_end: -60, precision: range, note: "Dating debated; estimates range from c. 205 BC to c. 60 BC." }
    places: [{ city: "found off Antikythera", country: "Ancient Greece" }]
  status: extinct
  summary: >
    Geared analogue computer predicting astronomical positions and eclipses. Its behaviour is
    fixed by its gear train, so it computes but is not programmable. It is the conventional
    starting point of "machines that calculate", which is why it opens the timeline.
  notes: "Use as the root of the 'computation' axis, not the 'programming' axis. No outgoing influence edges are claimed: there is no documented line from it to later programmable machines."
  research_status: draft
  confidence: medium
  links: { wikipedia: "https://en.wikipedia.org/wiki/Antikythera_mechanism" }
  sources: [freeth-2006-antikythera, wiki-antikythera]
  example:
    title: What the gears compute
    language: pseudocode (illustrative)
    note: 'There is no program: the computation is the gear train. Turning the crank advances the date; fixed tooth ratios turn it into astronomical positions. 254 sidereal months fit into 19 years, and the front gearing reproduces that ratio. The back dials count the 235-month Metonic cycle and the 223-month Saros eclipse cycle.'
    code: |
      on crank turned by Δdays:
        sun_angle   += Δdays × 360° / 365.25
        moon_angle  += sun_angle_delta × 254 / 19      -- gears, not code
        metonic_dial = month_count mod 235             -- 19-year calendar
        saros_dial   = month_count mod 223             -- eclipse prediction
    sources: [freeth-2006-antikythera]

- id: banu-musa-flute-player
  name: Banū Mūsā automatic flute player
  kind: mechanism
  category: domain-specific
  cluster: prehistory/mechanisms
  origin:
    first_appeared: { year: 850, precision: circa, note: "Described in the Banū Mūsā brothers' treatise on automata, 9th century." }
    places: [{ city: Baghdad, country: "Abbasid Caliphate" }]
  creators:
    - { name: "Banū Mūsā brothers (Muhammad, Ahmad, al-Hasan ibn Mūsā ibn Shākir)", role: designers }
  status: extinct
  summary: >
    Water-powered automaton whose melody is encoded as pins on an exchangeable rotating cylinder.
    Swapping the cylinder changes the tune, which makes it a candidate for the earliest
    programmable machine: the program is separate from the machine.
  research_status: draft
  confidence: medium
  sources: [koetsier-2001-programmable]
  example:
    title: A melody stored as pins
    language: pseudocode (illustrative)
    note: 'The rotating cylinder is the program and the pins are its instructions: each pin lifts a lever that opens one finger hole. Swap the cylinder and the same machine plays a different tune.'
    code: |
      cylinder = [ (t=0, hole 3), (t=1, hole 5), (t=2, hole 5), (t=3, hole 1), … ]
      loop while water flows:
        t ← cylinder position
        for each pin at t: open its hole
        air → flute
    sources: [koetsier-2001-programmable]

- id: jacquard-loom
  name: Jacquard loom
  kind: mechanism
  category: domain-specific
  cluster: prehistory/punched-cards
  origin:
    first_appeared: { year: 1804, precision: circa, note: "Demonstrated 1801, patented 1804." }
    places: [{ city: Lyon, country: FR }]
  creators:
    - { name: Joseph Marie Jacquard, role: inventor }
  status: historical
  summary: >
    Loom controlled by a chain of punched cards, each card selecting which warp threads rise.
    The first widely used machine driven by an exchangeable, stored sequence of instructions.
    Babbage adopted its cards for the Analytical Engine.
  relations:
    - { type: influenced_by, to: banu-musa-flute-player, weight: weak, confidence: low, note: "Shared idea (exchangeable stored pattern), not a documented line of transmission. Earlier looms by Basile Bouchon (1725) and Jacques de Vaucanson (1745) are the direct ancestors; add them when the subgraph is unfolded." }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Jacquard_machine" }
  sources: [wiki-jacquard]
  example:
    title: One card, one row of the pattern
    language: punched card (illustrative)
    note: Each card is one pass of the shuttle. A hole lets a hooked needle through and lifts its warp thread; no hole leaves it down. The chain of laced cards is the program, read in order and looped for repeating patterns.
    code: |
      card 001:  # . . # # . . # # . . #     # hole → lift warp thread
      card 002:  . # # . . # # . . # # .     . blank → leave it down
      card 003:  # . . # # . . # # . . #
      ...        (chain loops back to card 001)

- id: analytical-engine
  name: Analytical Engine
  kind: machine
  category: general
  cluster: prehistory/babbage
  origin:
    began: { year: 1834, precision: year }
    first_appeared: { year: 1837, precision: year, note: "Design described 1837; never completed." }
    places: [{ city: London, country: GB }]
  creators:
    - { name: Charles Babbage, role: designer }
  status: extinct
  summary: >
    Babbage's design for a general-purpose mechanical computer with a separate store (memory)
    and mill (processor), conditional branching and loops, programmed by punched cards borrowed
    from the Jacquard loom. Turing-complete in principle; never built.
  relations:
    - { type: influenced_by, to: jacquard-loom, aspects: [punched-card-program], weight: strong, confidence: high, note: "Babbage explicitly adopted Jacquard's cards for operation and variable cards." }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Analytical_engine" }
  sources: [menabrea-lovelace-1843, wiki-analytical-engine]
  example:
    title: Operation cards and variable cards
    language: Analytical Engine card notation (illustrative)
    note: 'Babbage split the program into two decks, as Jacquard''s loom had one: operation cards said what the Mill should do, variable cards said which columns of the Store to read and write. This computes V3 = (V1 + V2) × V1.'
    code: |
      Operation cards     Variable cards
      ───────────────     ─────────────────────────
      +                   V1, V2  →  V4
      ×                   V4, V1  →  V3
    sources: [menabrea-lovelace-1843]

- id: lovelace-note-g
  name: Lovelace's Note G (Bernoulli numbers program)
  aliases: [Note G]
  kind: notation
  category: scientific
  cluster: prehistory/babbage
  origin:
    first_appeared: { year: 1843, precision: year }
    places: [{ city: London, country: GB }]
  creators:
    - { name: Ada Lovelace, role: author }
  status: historical
  summary: >
    In her translation of Menabrea's paper on the Analytical Engine, Ada Lovelace added notes A-G.
    Note G tabulates, step by step, how the engine would compute Bernoulli numbers: operations,
    the variables they read and write, and a repeated cycle. It is usually called the first published
    computer program. Note A also argues the engine could manipulate symbols other than numbers,
    such as music.
  notes: "How much of Note G is Lovelace's own work versus Babbage's is debated by historians; keep the attribution with a note in the side sheet."
  relations:
    - { type: targets, to: analytical-engine, weight: strong, confidence: high }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Note_G" }
  sources: [menabrea-lovelace-1843]
  example:
    title: The first rows of Note G
    language: Lovelace's table, Note G (1843)
    year: 1843
    note: The opening operations of the program computing the Bernoulli number B7, as a table of operation, input variables, output variables and the value produced. V1 holds 1, V2 holds 2, V3 holds n. Later rows loop back ('repeat operations 13 to 23'), the first published loop.
    code: |
      Op  Kind  Variables acted on   Result to       Value
      1   ×     V2 × V3              V4, V5, V6      2n
      2   −     V4 − V1              V4              2n − 1
      3   +     V5 + V1              V5              2n + 1
      4   ÷     V4 ÷ V5              V11             (2n−1)/(2n+1)
      5   ÷     V11 ÷ V2             V11             ½·(2n−1)/(2n+1)
      6   −     V13 − V11            V13             −½·(2n−1)/(2n+1) = A0
      7   −     V3 − V1              V10             n − 1
      …
    sources: [menabrea-lovelace-1843]

- id: hollerith-tabulator
  name: Hollerith tabulating machine
  kind: mechanism
  category: business
  cluster: prehistory/punched-cards
  origin:
    first_appeared: { year: 1890, precision: year, note: "Used for the 1890 US census." }
    places: [{ country: US }]
  creators:
    - { name: Herman Hollerith, role: inventor }
  status: historical
  summary: >
    Electromechanical tabulator reading data from punched cards. Hollerith's company became part of
    IBM, and the punched card became the standard medium for both data and programs until the 1970s.
    Later unit-record machines were "programmed" by wiring plugboards.
  relations:
    - { type: influenced_by, to: jacquard-loom, aspects: [punched-card-program], weight: moderate, confidence: medium }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Tabulating_machine" }
  sources: [wiki-tabulating-machine]
  example:
    title: A census card
    language: punched card (illustrative)
    note: Each hole position means a fact about one person (sex, age group, birthplace). Electrical pins dropping through holes into mercury cups advanced counters. The 'program' was the wiring of which holes fed which counters, later done with plugboards.
    code: |
      +-----------------------------------------------+
      | sex      [#] male     [ ] female              |
      | age      [ ] 0-9      [ ] 10-19     [#] 20-29 |
      | born     [ ] native   [#] foreign             |
      +-----------------------------------------------+
        [#] punched hole   [ ] intact

      pin drops through a hole -> mercury cup -> circuit closes:
        dial[male] += 1    dial[20-29] += 1    dial[foreign] += 1

- id: combinatory-logic
  name: Combinatory logic
  kind: formalism
  category: research
  cluster: prehistory/formalisms
  origin:
    first_appeared: { year: 1924, precision: year, note: "Schönfinkel 1924; developed by Haskell Curry from 1930." }
  creators:
    - { name: Moses Schönfinkel, role: originator }
    - { name: Haskell Curry, role: developer }
  status: active
  summary: "Computation by combining a few combinators (S, K, I) without variables. Basis of Unlambda and of SKI-based compilation of lazy functional languages."
  research_status: draft
  confidence: high
  sources: [wiki-combinatory-logic]
  example:
    title: Identity from S and K
    language: SKI combinator calculus
    note: 'Every computable function can be built from S and K alone, without variables. Even the identity combinator I is unnecessary: S K K behaves exactly like it. Unlambda programs are written in this calculus.'
    code: |
      K x y   = x
      S x y z = x z (y z)

      S K K x = K x (K x) = x        -- so I = S K K
    sources: [wiki-combinatory-logic]

- id: lambda-calculus
  name: Lambda calculus
  kind: formalism
  category: research
  cluster: prehistory/formalisms
  origin:
    began: { year: 1932, precision: year }
    first_appeared: { year: 1936, precision: year }
    places: [{ institution: Princeton University, city: Princeton, country: US }]
  creators:
    - { name: Alonzo Church, role: designer }
  status: active
  summary: >
    Church's formal system of function abstraction and application. The theoretical root of the whole
    functional family: Lisp took its lambda notation, ISWIM and ML its semantics, Haskell its core.
  relations:
    - { type: influenced_by, to: combinatory-logic, weight: moderate, confidence: high }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Lambda_calculus" }
  sources: [church-1936, wiki-lambda-calculus]
  example:
    title: "The Y combinator: recursion without names"
    language: "untyped lambda calculus"
    note: "Y f reduces to f (Y f), so a function can call itself without ever being named. Diverges under strict evaluation; strict languages use the Z combinator instead."
    code: |
      Y = λf.(λx.f (x x)) (λx.f (x x))

      Y g  →  g (Y g)  →  g (g (Y g))  →  …

- id: turing-machine
  name: Turing machine
  kind: formalism
  category: research
  cluster: prehistory/formalisms
  origin:
    first_appeared: { year: 1936, precision: year, note: "Paper 'On Computable Numbers' submitted 1936, published 1937." }
    places: [{ institution: University of Cambridge, city: Cambridge, country: GB }]
  creators:
    - { name: Alan Turing, role: designer }
  status: active
  summary: "Abstract machine reading and writing symbols on a tape under a finite table of rules. Defines computability; the universal machine anticipates the stored-program computer. Brainfuck is close to a literal Turing machine with a byte tape."
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Turing_machine" }
  sources: [turing-1936]
  example:
    title: Binary increment
    language: Turing machine transition table
    note: The head starts on the rightmost digit. It turns trailing 1s into 0s while moving left, then writes a 1 into the first 0 or blank. 1011 becomes 1100.
    code: |
      state  read  write  move  next
      inc    1     0      L     inc
      inc    0     1      –     halt
      inc    _     1      –     halt
    sources: [turing-1936]
