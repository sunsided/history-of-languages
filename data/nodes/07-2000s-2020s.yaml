  example:
    title: The Elm Architecture
    language: Elm 0.19
    note: "Excerpt from the Buttons example on elm-lang.org (module header, imports, main and init omitted). update is a pure function from message and old model to new model; view renders the model, and onClick produces messages."
    code: |
      type Msg
        = Increment
        | Decrement

      update : Msg -> Model -> Model
      update msg model =
        case msg of
          Increment ->
            model + 1

          Decrement ->
            model - 1

      view : Model -> Html Msg
      view model =
        div []
          [ button [ onClick Decrement ] [ text "-" ]
          , div [] [ text (String.fromInt model) ]
          , button [ onClick Increment ] [ text "+" ]
          ]
    sources: [elm-lang-examples-buttons]

