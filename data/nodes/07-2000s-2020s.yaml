  kind: language
  category: systems
  cluster: c-family
  origin:
    first_appeared: { year: 2016, date: "2016-07", precision: exact, note: "Development began in July 2016; no 1.0 yet, dated monthly releases." }
  creators:
    - { name: Bill Hall, role: "designer (\"Ginger Bill\")" }
  status: active
  tags:
    paradigm: [imperative, procedural, data-driven]
    typing: [static-typing]
    memory: [manual-memory]
    features: [generics]
  summary: >
    "The C alternative for the Joy of Programming": a systems language for data-oriented programming, with
    Pascal/Go-flavoured declarations (name :: proc()), defer, an implicit context for allocators, and
    array programming built in. Used notably in game development.
  relations:
    - { type: influenced_by, to: c, weight: strong, confidence: high, sources: [wiki-odin, odin-lang-org], note: "\"created to serve as an alternative to C\"." }
    - { type: influenced_by, to: go, weight: moderate, confidence: medium, sources: [wiki-odin] }
    - { type: influenced_by, to: pascal, weight: moderate, confidence: medium, sources: [wiki-odin] }
    - { type: influenced_by, to: oberon, weight: weak, confidence: medium, sources: [wiki-odin], note: "The infobox names Oberon-2." }
    - { type: influenced_by, to: newsqueak, weight: weak, confidence: medium, sources: [wiki-odin] }
  research_status: draft
  confidence: medium
  links: { wikipedia: "https://en.wikipedia.org/wiki/Odin_(programming_language)", homepage: "https://odin-lang.org" }
  sources: [wiki-odin, odin-lang-org]
  example:
    title: defer
    language: Odin
    note: "From odin-lang.org. defer schedules delete(nums) to run when main returns; deferred statements run in reverse order of declaration."
    code: |
      package main

      import "core:fmt"

      main :: proc() {
          nums := make([]int, 3)
          defer delete(nums) // runs when main returns

          nums[0], nums[1], nums[2] = 1, 2, 3
          fmt.println(nums)
      }
    sources: [odin-lang-org]

- id: fish
  name: fish
  aliases: [friendly interactive shell]
  kind: language
  category: shell
  cluster: scripting/unix
  origin:
    first_appeared: { year: 2005, date: "2005-02-13", precision: exact, note: "Initial release." }
  creators:
    - { name: Axel Liljencrantz, role: original author }
  status: active
