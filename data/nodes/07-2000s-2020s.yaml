  summary: "Pragmatic JVM language from the makers of IntelliJ. Its suspend functions are async/await with implicit awaiting; it popularized structured concurrency."
  relations:
    - { type: influenced_by, to: java, weight: strong, confidence: high }
    - { type: influenced_by, to: scala, weight: strong, confidence: high }
