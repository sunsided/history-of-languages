  example:
    title: Structural types over JavaScript
    language: TypeScript
    note: 'Types describe shapes, not class names: any object with the right fields fits. The discriminated union is checked exhaustively, and all types are erased when compiling to JavaScript. Type-checked with tsc.'
    code: |
      type Shape =
        | { kind: "circle"; r: number }
        | { kind: "rect"; w: number; h: number };

      function area(s: Shape): number {
        switch (s.kind) {
          case "circle": return Math.PI * s.r ** 2;
          case "rect":   return s.w * s.h;
        }
      }

      async function main(): Promise<void> {
        const shapes: Shape[] = [{ kind: "circle", r: 1 }, { kind: "rect", w: 2, h: 3 }];
        console.log(shapes.map(area));
      }
      main();
