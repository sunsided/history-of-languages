- id: eiffel
  name: Eiffel
  kind: language
  category: general
  cluster: oop/simula-smalltalk
  origin:
    first_appeared: { year: 1986, precision: year }
    places: [{ institution: Interactive Software Engineering, city: Santa Barbara, country: US }]
  creators: [{ name: Bertrand Meyer, role: designer }]
  status: legacy
  tags:
    paradigm: [object-oriented]
    typing: [static-typing]
    memory: [garbage-collection]
    features: [design-by-contract, multiple-inheritance, generics]
  summary: "Pure, statically typed OOP with Design by Contract (preconditions, postconditions, invariants). Its contracts reappear in Ada 2012, D, C++26 and Kotlin; the uniform access principle in C# properties."
  relations:
    - { type: influenced_by, to: simula, weight: strong, confidence: high }
    - { type: influenced_by, to: ada, weight: moderate, confidence: medium }
  research_status: draft
  confidence: high
  sources: [meyer-1988-oosc]
  example:
    title: Design by Contract
    language: Eiffel
    note: require (precondition), ensure (postcondition) and invariant are part of the class interface and checked at run time. old balance refers to the value on entry.
    code: |
      class ACCOUNT
      feature
          balance: INTEGER

          withdraw (amount: INTEGER)
              require
                  positive: amount > 0
                  covered: amount <= balance
              do
                  balance := balance - amount
              ensure
                  decreased: balance = old balance - amount
              end
      invariant
          non_negative: balance >= 0
      end
    sources: [meyer-1988-oosc]

- id: erlang
  name: Erlang
  kind: language
  category: general
  cluster: concurrency/beam
  origin:
    began: { year: 1986, precision: year }
    first_appeared: { year: 1986, precision: year, note: "First (Prolog-based) implementation 1986; open-sourced 1998." }
    places: [{ institution: Ericsson Computer Science Laboratory, city: Stockholm, country: SE }]
  creators:
    - { name: Joe Armstrong, role: designer }
    - { name: Robert Virding, role: designer }
    - { name: Mike Williams, role: designer }
  status: active
  tags:
    paradigm: [functional, concurrent]
    typing: [dynamic-typing]
    memory: [garbage-collection]
    concurrency: [actors, message-passing, green-threads, preemptive-scheduling]
    features: [pattern-matching, hot-code-reloading, let-it-crash, supervision-trees]
    domain: [telecommunications, distributed-systems]
  milestones:
    - { version: BEAM VM, year: 1992 }
    - { version: OTP, year: 1996 }
    - { version: Open source release, year: 1998 }
    - { version: SMP runtime, year: 2006, summary: "Multicore scheduler." }
  summary: >
    Built for telephone switches that must never stop: millions of isolated, cheap processes,
    asynchronous message passing, "let it crash" with supervisors, hot code reloading. Its
    preemptively scheduled lightweight processes are the road async/await did not take.
  relations:
    - { type: influenced_by, to: prolog, aspects: [pattern-matching], weight: strong, confidence: high, note: "Started as a Prolog meta-interpreter; syntax is Prolog-derived." }
    - { type: influenced_by, to: csp, aspects: [message-passing], weight: weak, confidence: medium }
    - { type: influenced_by, to: actor-model, aspects: [actors], weight: weak, confidence: medium, note: "Armstrong said the actor model was not a conscious influence; the similarity is convergent. Keep weight weak." }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Erlang_(programming_language)" }
  sources: [armstrong-2007-history-erlang]
  example:
    title: Processes and messages
    language: Erlang
    note: spawn starts a lightweight process; ! sends a message to its mailbox; receive pattern-matches messages. Processes share nothing, so a crash in one cannot corrupt another, which is what supervision trees build on.
    code: |
      -module(counter).
      -export([start/0, loop/1]).

      start() -> spawn(counter, loop, [0]).

      loop(N) ->
          receive
              increment     -> loop(N + 1);
              {get, From}   -> From ! {count, N}, loop(N)
          end.

      %% Pid = counter:start(), Pid ! increment,
      %% Pid ! {get, self()}, receive {count, C} -> C end.
    sources: [armstrong-2007-history-erlang]

- id: self
  name: Self
  kind: language
  category: research
  cluster: oop/simula-smalltalk
  origin:
    first_appeared: { year: 1987, precision: year, note: "Designed 1986 at Xerox PARC; developed at Stanford and Sun Labs." }
    places: [{ institution: Xerox PARC / Stanford / Sun Microsystems, country: US }]
  creators:
    - { name: David Ungar, role: designer }
    - { name: Randall Smith, role: designer }
  status: extinct
  tags:
    paradigm: [object-oriented, prototype-based]
    typing: [dynamic-typing]
    memory: [garbage-collection]
    features: [prototypes, jit-compilation, adaptive-optimization]
  summary: "Smalltalk without classes: objects clone prototypes and delegate to parents. Its adaptive JIT compilers led directly to Java HotSpot and V8; its prototypes to JavaScript."
  relations:
    - { type: influenced_by, to: smalltalk, weight: strong, confidence: high }
  research_status: draft
  confidence: high
  sources: [ungar-smith-2007-self]
  example:
    title: 'Prototypes: copy, don''t instantiate'
    language: Self
    note: 'From Wikipedia''s Self article. There are no classes: vehicle is an object whose parent* slot delegates to shared behaviour, sportsCar is a copy of it with an extra method slot, and porsche911 is a copy of sportsCar. (The article notes _AddSlots: is a primitive normally hidden behind the environment.)'
    code: |
      'Hello, World!' print.

      _AddSlots: (| vehicle <- (|parent* = traits clonable|) |).
      vehicle _AddSlots: (| name <- 'automobile'|).
      _AddSlots: (| sportsCar <- vehicle copy |).
      sportsCar _AddSlots: (| driveToWork = ('some code, this is a method') |).
      _AddSlots: (| porsche911 <- sportsCar copy |).
      porsche911 name:'Bobs Porsche'.
    sources: [wiki-self, ungar-smith-2007-self]

