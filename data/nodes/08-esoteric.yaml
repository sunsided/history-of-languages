    first_appeared: { year: 2003, precision: circa, note: "Nurnberg, Wiil and Hicks (September 2003) is the paper Wikipedia credits with the name SUBLEQ. No designer or origin date is given in the sources read." }
  status: historical
  tags:
    paradigm: [imperative]
    typing: [typeless]
    features: [self-modifying-code, minimalism]
  summary: >
    A one-instruction computer: every instruction is three addresses A B C meaning "subtract A from B, and jump to
    C if the result is less than or equal to zero". "If no limit is imposed on the size of a memory cell", it is
    Turing-complete, by translation from Minsky machines; a standing demonstration that an instruction set needs
    only one instruction.
  research_status: draft
  confidence: low
  sources: [esolangs-subleq, wiki-oisc]
  example:
    title: Printing "Hi"
    language: Subleq
    note: "From the Esolang wiki tutorial. Address -1 is output, so subtracting from it prints; H: and i: are labels on the data words 72 and 105, and 0 0 -1 jumps to -1, which halts."
    code: |
      H -1 3
      i -1 6
      0 0 -1
      H:72 i:105 0
    sources: [esolangs-subleq]

