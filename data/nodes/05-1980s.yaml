  research_status: draft
  confidence: high
  sources: [van-rossum-2009-history-python]
  example:
    title: Collect the words of a document
    language: ABC
    note: The example from Wikipedia's ABC article (indentation restored, as ABC uses it for blocks). Sets, lists and tables are built in. Python kept the colon and the indentation.
    code: |
      HOW TO RETURN words document:
         PUT {} IN collection
         FOR line IN document:
            FOR word IN split line:
               IF word not.in collection:
                  INSERT word IN collection
         RETURN collection
    sources: [wiki-abc, van-rossum-2009-history-python]

- id: standard-ml
  name: Standard ML
  aliases: [SML]
  kind: language
  category: research
  cluster: ml-family
  origin:
    began: { year: 1983, precision: year }
    first_appeared: { year: 1990, precision: year, note: "Definition of Standard ML (1990); revised 1997." }
    places: [{ institution: University of Edinburgh, city: Edinburgh, country: GB }]
  creators:
    - { name: Robin Milner, role: designer }
    - { name: Mads Tofte, role: designer }
    - { name: Robert Harper, role: designer }
    - { name: David MacQueen, role: designer }
  status: legacy
  tags:
    paradigm: [functional, imperative]
    typing: [static-typing, type-inference, parametric-polymorphism]
    memory: [garbage-collection]
    features: [module-system, functors, algebraic-data-types, pattern-matching, exceptions, formal-semantics]
  milestones:
    - { version: SML '90, year: 1990, introduces: [formal-semantics] }
    - { version: SML '97, year: 1997 }
  summary: "ML unified with HOPE's algebraic data types and pattern matching, with a module system of signatures and functors. The first general-purpose language with a complete formal definition."
  relations:
    - { type: successor_of, to: ml, weight: strong, confidence: high }
  research_status: draft
  confidence: high
  sources: [macqueen-harper-reppy-2020-history-sml]
  example:
    title: Datatypes, pattern matching, modules
    language: Standard ML
    note: A datatype declares a sum type, and functions are defined by cases over its constructors. The compiler warns if a case is missing. The signature describes the structure's interface.
    code: |
      signature SHAPE = sig
        datatype shape = Circle of real | Rect of real * real
        val area : shape -> real
      end

      structure Shape :> SHAPE = struct
        datatype shape = Circle of real | Rect of real * real
        fun area (Circle r)    = Math.pi * r * r
          | area (Rect (w, h)) = w * h
      end
