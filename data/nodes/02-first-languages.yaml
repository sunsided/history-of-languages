    first_appeared: { year: 1958, precision: year, note: "ACM-GAMM meeting, Zürich, May-June 1958." }
    places: [{ institution: ETH Zürich (ACM / GAMM joint committee), city: Zürich, country: CH }]
  creators:
    - { name: Friedrich L. Bauer, role: committee member, affiliation: GAMM }
    - { name: Hermann Bottenbruch, role: committee member, affiliation: GAMM }
    - { name: Heinz Rutishauser, role: committee member, affiliation: GAMM }
