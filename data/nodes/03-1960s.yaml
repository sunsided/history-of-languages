    paradigm: [imperative, pattern-matching]
    typing: [dynamic-typing]
    features: [pattern-matching, backtracking, string-processing]
  milestones:
    - { version: SNOBOL4, year: 1967, summary: "Patterns as first-class values." }
  summary: "String-manipulation language with patterns as first-class values and success/failure-driven control flow. Ancestor of Icon."
  relations:
    - { type: influenced_by, to: comit, aspects: [string-processing, pattern-matching], weight: strong, confidence: high, sources: [wiki-comit], note: "\"The creation of COMIT led to the creation of SNOBOL\"." }
  research_status: draft
  confidence: high
  sources: [griswold-1978-snobol]
  example:
    title: Words from input, with success/failure gotos
    language: SNOBOL4
    note: A statement has a subject, a pattern and an optional replacement. Each statement succeeds or fails, and the :S()/:F() labels branch on it. BREAK(' ') . WORD matches up to the first space and assigns the match to WORD.
    code: |
      LOOP   LINE = INPUT                       :F(END)
             LINE BREAK(' ') . WORD             :F(LOOP)
             OUTPUT = WORD                      :(LOOP)
      END
    sources: [griswold-1978-snobol]

