  status: historical
  tags:
    paradigm: [object-oriented, declarative]
    features: [classes, inheritance, formal-semantics]
  summary: >
    "an object-oriented extension to the Z specification language" whose "primary construct" is the class, related to
    others "through inheritance, association, or aggregation". A class has optional clauses for attributes, functions,
    operations, invariants and a HISTORY of real-time-logic predicates.
  notes: >
    The page has no inline citations; the designer is inferred from the cited papers' author. The Z notation itself is not
    a node yet.
  research_status: stub
  confidence: medium
  links: { wikipedia: "https://en.wikipedia.org/wiki/Z%2B%2B" }
  sources: [wiki-z-plus-plus]
  example:
    title: Class structure
    language: Z++
    note: "Illustrative: the clause template from Wikipedia (ENTENDS is the page's spelling), not a worked specification."
    code: |
      CLASS ClassName
        [OWNS List_of_attributes]
        [FUNCTIONS constant_definitions]
        [TYPE type_declaration]
        [ENTENDS list_of_super_classes]
        [OPERATIONS list_of_state_change_operations_definitions]
        [RETURNS list_of_query_operations_definitions]
        [ACTIONS all_operations_declarations]
        [INVARIANT predicates]
        [HISTORY RTL_predicates]
      END CLASS
    sources: [wiki-z-plus-plus]

- id: kaleidoscope
