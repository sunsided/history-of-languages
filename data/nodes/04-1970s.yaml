    TENEX. Its release year is not yet sourced, so it is not a milestone here. Early contributors named by
    Wikipedia: Michael Ubell, Eric Allman, Mike O'Brien, Jim Kulp.
  relations:
    - { type: influenced_by, to: c, weight: strong, confidence: high, sources: [wiki-c-shell], note: "\"The keywords, the use of parentheses, and the C shell's built-in expression grammar and support for arrays were all strongly influenced by C.\"" }
    - { type: influenced_by, to: thompson-shell, aspects: [pipes], weight: moderate, confidence: medium, sources: [wiki-thompson-shell] }
  research_status: draft
  confidence: medium
  links: { wikipedia: "https://en.wikipedia.org/wiki/C_shell" }
  sources: [wiki-c-shell]
  example:
    title: Powers of two
    language: C shell
    note: "From the Wikipedia C shell article's Bourne/C shell comparison. @ evaluates C-like expressions (*=, ++). Run with tcsh."
    code: |
      #!/bin/csh
      set i = 2
      set j = 1
      while ( $j <= 10 )
        echo '2 **' $j = $i
        @ i *= 2
        @ j++
      end
    sources: [wiki-c-shell]


- id: lisp-machine-lisp
  name: Lisp Machine Lisp
  aliases: [ZetaLisp, Zetalisp]
  kind: language
  category: research
  cluster: lisp
  origin:
    first_appeared: { year: 1976, precision: year, note: "Wikipedia infobox; developed in the mid to late 1970s as the system language of the MIT Lisp machines." }
    places: [{ institution: MIT AI Lab, country: US }]
  creators:
    - { name: David A. Moon, role: designer }
    - { name: Richard Stallman, role: designer }
    - { name: Daniel Weinreb, role: designer }
  status: historical
  tags:
    paradigm: [functional, object-oriented, procedural]
    typing: [dynamic-typing]
    memory: [garbage-collection]
    features: [macros, closures, multiple-inheritance, dynamic-scoping]
    domain: [artificial-intelligence, operating-systems]
  summary: >
    The system programming language of the MIT Lisp machines and their commercial descendants (Symbolics'
    ZetaLisp, LMI, Texas Instruments): a direct descendant of MacLisp, with the Flavors object system, in
    which the whole operating system was written. It was "the Lisp dialect with the most influence on the
    design of Common Lisp".
  relations:
    - { type: successor_of, to: maclisp, weight: strong, confidence: high, sources: [wiki-lisp-machine-lisp], note: "\"A direct descendant of Maclisp\"." }
    - { type: influenced_by, to: interlisp, weight: moderate, confidence: medium, sources: [wiki-lisp-machine-lisp] }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Lisp_Machine_Lisp" }
  sources: [wiki-lisp-machine-lisp]
  example:
    title: Flavors
    language: Lisp Machine Lisp
    note: "Illustrative, written for this dataset in the style of the Lisp Machine Manual: defflavor declares a flavor (class) with instance variables, defmethod a method, send a message. Not run; check against the Lisp Machine Manual."
    code: |
      (defflavor ship (x y x-velocity y-velocity) ()
        :settable-instance-variables)

      (defmethod (ship :speed) ()
        (sqrt (+ (* x-velocity x-velocity)
                 (* y-velocity y-velocity))))

      (setq s (make-instance 'ship ':x-velocity 3 ':y-velocity 4))
      (send s ':speed)          ; => 5.0
    sources: [wiki-lisp-machine-lisp]

- id: sasl
  name: SASL
  aliases: [St Andrews Static Language]
  kind: language
  category: research
  cluster: ml-family/lazy
  origin:
    first_appeared: { year: 1972, precision: year, note: "Wikipedia and Hudak et al. 2007 give 1972. Turner (2012) says a LISP implementation by Tony Davie ran in autumn 1972 and he wrote a SASL-to-SECD compiler over Easter 1973; his own timeline lists \"SASL (1973-83)\"." }
    places: [{ institution: University of St Andrews, city: St Andrews, country: GB }]
  creators: [{ name: David Turner, role: designer }]
  status: extinct
  tags:
    paradigm: [functional, purely-functional]
    typing: [dynamic-typing]
    features: [lazy-evaluation, pattern-matching, recursion]
  milestones:
    - { version: "1976", year: 1976, introduces: [lazy-evaluation, pattern-matching], summary: "Redesigned and reimplemented as a non-strict (lazy) language, with multi-equation definitions by pattern matching." }
    - { version: "1983", year: 1983, introduces: [list-comprehensions], summary: "Gained floating point and list comprehensions (from KRC)." }
  summary: >
    David Turner's St Andrews Static Language, "based on the applicative subset of ISWIM". Strict at first, it
    became lazy in 1976 and was the foundation of KRC and Miranda, and so of Haskell's syntax and semantics.
    Burroughs used it to write a compiler and an operating system.
  relations:
    - { type: influenced_by, to: iswim, weight: strong, confidence: high, sources: [wiki-sasl, hudak-2007-history-haskell], note: "\"based on the applicative subset of ISWIM\"." }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/SASL_(programming_language)" }
  sources: [wiki-sasl, hudak-2007-history-haskell, turner-2012-history-fp]
  example:
    title: Definitions by pattern matching (1976)
    language: SASL
    note: "From Turner 2012, section 6.1, as an example of the multi-equation definitions SASL gained in 1976. () is the empty list and a:x a cons. The extracted text lost indentation; these lines have none."
    code: |
      length () = 0
      length (a:x) = 1 + length x
      ack 0 n = n+1
      ack m 0 = ack (m-1) 1
      ack m n = ack (m-1) (ack m (n-1))
    sources: [turner-2012-history-fp]
