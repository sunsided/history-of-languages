  summary: "Strongly typed modular systems language for the Alto/Star workstations. Its monitors and condition variables (Lampson & Redell, 1980) are the model for Java's synchronized/wait/notify. Wirth used it during a sabbatical and built Modula-2 on it."
  relations:
    - { type: influenced_by, to: pascal, weight: strong, confidence: medium }
    - { type: influenced_by, to: algol-68, weight: moderate, confidence: low }
  research_status: draft
  confidence: medium
  sources: [lampson-redell-1980-mesa, wirth-2007-modula2-oberon]
  example:
    title: Monitor with a condition variable
    language: Mesa
    note: 'Approximate. ENTRY procedures hold the monitor lock. WAIT re-checks its condition in a loop because NOTIFY is only a hint: these ''Mesa semantics'' are what Java and POSIX condition variables use today.'
    code: |
      Buffer: MONITOR =
      BEGIN
        nonEmpty: CONDITION;
        count: CARDINAL ← 0;

        Put: PUBLIC ENTRY PROC [c: CHARACTER] =
          BEGIN store[c]; count ← count + 1; NOTIFY nonEmpty END;

        Get: PUBLIC ENTRY PROC RETURNS [c: CHARACTER] =
          BEGIN
            WHILE count = 0 DO WAIT nonEmpty ENDLOOP;
            count ← count - 1; RETURN[fetch[]]
          END;
      END.
    sources: [lampson-redell-1980-mesa]

- id: icon
  name: Icon
  kind: language
  category: research
  cluster: string-processing
  origin:
    first_appeared: { year: 1977, precision: year }
    places: [{ institution: University of Arizona, city: Tucson, country: US }]
  creators: [{ name: Ralph E. Griswold, role: designer }]
  status: legacy
  tags:
    paradigm: [imperative, goal-directed]
    typing: [dynamic-typing]
    features: [generators, backtracking, string-processing]
  summary: "Goal-directed evaluation: expressions can generate a sequence of results and fail. Its generators are explicitly cited by Python's PEP 255."
  relations:
    - { type: successor_of, to: snobol, weight: strong, confidence: high }
  research_status: draft
  confidence: high
  sources: [griswold-1993-history-icon, pep-255]
  example:
    title: Generators and goal-directed evaluation
    language: Icon
    note: 'find generates every position where "o" occurs; every drives a generator to exhaustion. In the second line, the comparison simply fails for odd numbers, and failure skips the write: no booleans needed.'
    code: |
      procedure main()
        every write(find("o", "hello world"))      # 5, 8
        every write((i := 1 to 10) % 2 = 0 & i)    # 2, 4, 6, 8, 10
      end
    sources: [griswold-1993-history-icon]

