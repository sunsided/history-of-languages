- id: edsac-initial-orders
  name: EDSAC Initial Orders
  kind: assembly
  category: systems
  cluster: assembly/early
  origin:
    first_appeared: { year: 1949, precision: year }
    places: [{ institution: University of Cambridge Mathematical Laboratory, city: Cambridge, country: GB }]
  creators: [{ name: David Wheeler, role: designer }]
  status: extinct
  tags:
    features: [assembly-language]
  summary: "Bootstrap program wired into EDSAC that read mnemonic, single-letter instructions with decimal addresses from paper tape and assembled them into memory. The first assembler in practical use; Initial Orders 2 (1949) added relocation for subroutines."
  relations:
    - { type: targets, to: edsac, weight: strong, confidence: high }
  notes: >
    Subroutines were called with the Wheeler Jump, "jumping to the start of the subroutine with the return
    address ... in the accumulator"; it "is not capable of expressing recursion". By 1951, 87 library
    subroutines were available (Wikipedia: EDSAC, Wheeler Jump).
  research_status: draft
  confidence: high
  sources: [wilkes-wheeler-gill-1951, wiki-edsac, wiki-wheeler-jump]
  example:
    title: Add two numbers
    language: EDSAC orders read by Initial Orders 2
    year: 1949
    note: 'Initial Orders 2 read these letters and decimal addresses from tape and assembled them into memory as it loaded them: a 1949 assembler in 41 words. T 56 K sets the load address; T n F stores and clears the accumulator; Z F stops.'
    code: |
      T 56 K      load the following orders from location 56
      A 70 F      acc += [70]
      A 71 F      acc += [71]
      T 72 F      [72] := acc; acc := 0
      Z F         stop
    sources: [wilkes-wheeler-gill-1951]

