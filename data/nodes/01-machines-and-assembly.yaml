  example:
    title: The specification's sample program
    language: DCPU-16 assembly
    note: "From spec 1.1 (\"Here's some sample assembler, and a memory dump of the compiled code\"), with the machine words as comments. IFN skips the next instruction unless its operands differ; JSR pushes the return address and SET PC, POP returns. \"X should now be 0x40 if everything went right.\""
