  example:
    title: Summing an array
    language: SabreTalk
    note: "From Wikipedia's code sample, trailing comment lines shortened."
    code: |
      SAMPLE: PROCEDURE;
            DECLARE ARRAY(10) DECIMAL(5) BASED(POINTUR);
            DECLARE COUNTER BINARY(15) ALIGNED;
            DECLARE TOTAL BINARY(31) ALIGNED;
            START(POINTUR=#RG1);
            TOTAL = 0;
      LOOP:
            DO COUNTER = 0 TO 10 BY 2;
              TOTAL = TOTAL + ARRAY(COUNTER);
            END LOOP;
            BACKC(#RAC= TOTAL);
      END SAMPLE;
