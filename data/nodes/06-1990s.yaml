- id: dylan
  name: Dylan
  aliases: [Prefix Dylan, Open Dylan]
  kind: language
  category: general
  cluster: lisp
  origin:
    first_appeared: { year: 1992, precision: year, note: "Created in the early 1990s by a group led by Apple Computer; Wikipedia gives 1992." }
    places: [{ institution: Apple Computer, country: US }]
  creators:
    - { name: Apple Computer, role: lead developer }
  status: maintained
  tags:
    paradigm: [object-oriented, functional, multi-paradigm]
    typing: [dynamic-typing, gradual-typing]
    memory: [garbage-collection]
    features: [multiple-dispatch, macros, generics]
  milestones:
    - { version: "infix syntax", year: 1994, summary: "CMU and Apple switch from Lisp prefix syntax to an ALGOL-like infix syntax (\"late 1993 or 1994\", Open Dylan history)." }
    - { version: "Apple Dylan TR1", year: 1995, summary: "Apple ends its Dylan effort with a technology release." }
    - { version: "Open Dylan", year: 2004, summary: "Harlequin's implementation open-sourced by Functional Objects." }
  summary: >
    Apple's "DYnamic LANguage": Scheme and CLOS semantics (generic functions, multiple dispatch, macros)
    with an ALGOL-like syntax adopted in 1993–94 in place of the original prefix syntax, meant for the
    Newton. Apple dropped it in 1995; Harlequin's implementation lives on as Open Dylan.
  relations:
    - { type: influenced_by, to: scheme, weight: strong, confidence: high, sources: [wiki-dylan], note: "\"Dylan derives from Scheme and Common Lisp and adds an integrated object system\"." }
    - { type: influenced_by, to: common-lisp, aspects: [multiple-dispatch], weight: strong, confidence: high, sources: [wiki-dylan] }
    - { type: influenced_by, to: algol-60, weight: weak, confidence: medium, sources: [wiki-dylan], note: "The infobox lists ALGOL; the link is the infix syntax." }
  research_status: draft
  confidence: medium
  links: { wikipedia: "https://en.wikipedia.org/wiki/Dylan_(programming_language)", homepage: "https://opendylan.org" }
  sources: [wiki-dylan, opendylan-history]
  example:
    title: Infix Dylan
    language: Dylan
    note: "From the Wikipedia Dylan article (indentation restored). Types such as <integer> are optional annotations; case is a multi-way conditional."
    code: |
      define function factorial (n :: <integer>) => (n! :: <integer>)
        case
          n < 0     => error("Can't take factorial of negative integer: %d\n", n);
          n = 0     => 1;
          otherwise => n * factorial(n - 1);
        end
      end;
    sources: [wiki-dylan]

- id: racket
  name: Racket
  aliases: [PLT Scheme, DrScheme]
  kind: language
  category: general
  cluster: lisp
  origin:
    first_appeared: { year: 1995, date: "1995-01-28", precision: exact, note: "In January 1995 the PLT group decided to build a pedagogic programming environment based on Scheme (PLT Scheme); renamed Racket on 7 June 2010." }
  creators:
    - { name: Matthias Felleisen, role: founder of PLT }
    - { name: Matthew Flatt, role: "implementer (MrEd, the original virtual machine)" }
    - { name: Robert Bruce Findler, role: developer }
    - { name: Shriram Krishnamurthi, role: developer }
  status: active
  tags:
    paradigm: [functional, multi-paradigm, object-oriented]
    typing: [dynamic-typing, gradual-typing]
    memory: [garbage-collection]
    features: [hygienic-macros, contracts, module-system, first-class-continuations, ide]
    domain: [education]
  milestones:
    - { version: "4.0", year: 2008, summary: "#lang selects the language of a module." }
    - { version: "5.0", year: 2010, summary: "PLT Scheme renamed Racket (7 June 2010)." }
    - { version: "8.0", year: 2021, summary: "Racket on Chez Scheme (Racket CS) becomes the default implementation (13 February 2021)." }
  summary: >
    "A language for making languages": a descendant of Scheme whose #lang line selects the language a module
    is written in, from Typed Racket to teaching languages to Scribble, all built with hygienic macros. It
    began as PLT Scheme and DrScheme, an environment for teaching programming, and adds contracts and a
    large standard library.
  relations:
    - { type: dialect_of, to: scheme, weight: strong, confidence: high, sources: [wiki-racket], note: "\"a modern dialect of Lisp and a descendant of Scheme\"." }
    - { type: influenced_by, to: eiffel, aspects: [contracts], weight: moderate, confidence: medium, sources: [wiki-racket], note: "Eiffel is in the infobox; the contracts link is our reading." }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Racket_(programming_language)", homepage: "https://racket-lang.org" }
  sources: [wiki-racket, racket-org, racket-2010-rename]
  example:
    title: Occurrence typing in Typed Racket
    language: Typed Racket
    note: "From racket-lang.org. #lang typed/racket switches the module's language; after filter string?, the type checker knows the list holds only strings. Run with Racket 8: returns \"hello world\"."
    code: |
      #lang typed/racket
      ;; Using higher-order occurrence typing
      (define-type SrN (U String Number))
      (: tog ((Listof SrN) -> String))
      (define (tog l)
        (apply string-append
               (filter string? l)))
      (tog (list 5 "hello "
                 1/2 "world" (sqrt -1)))
    sources: [racket-org]

- id: agda
  name: Agda
  aliases: [Agda 2]
  kind: language
  category: research
  cluster: ml-family/proof
  origin:
    first_appeared: { year: 1999, precision: year, note: "\"The original Agda system was developed at Chalmers by Catarina Coquand in 1999.\" Agda 2 (2007), the language in use today, is \"a full rewrite, which should be considered a new language that shares a name and tradition\"." }
    places: [{ institution: Chalmers University of Technology, city: Gothenburg, country: SE }]
  creators:
    - { name: Catarina Coquand, role: "Agda 1" }
    - { name: Ulf Norell, role: "Agda 2" }
  status: active
  tags:
    paradigm: [functional, purely-functional]
    typing: [static-typing, dependent-types]
    features: [algebraic-data-types, pattern-matching]
    domain: [theorem-proving]
  milestones:
    - { version: "1.0", year: 1999 }
    - { version: "2", year: 2007, summary: "Ulf Norell's full rewrite, described in his Chalmers PhD thesis; effectively a new language." }
  summary: >
    A dependently typed functional language and proof assistant from Chalmers: programs and proofs are the
    same thing, written with Haskell-like syntax, Unicode and mixfix operators. The name alludes to Coq, named
    after Thierry Coquand. Compiles to Haskell (MAlonzo) or JavaScript.
  relations:
    - { type: influenced_by, to: rocq, aspects: [dependent-types], weight: moderate, confidence: medium, sources: [wiki-agda], note: "Infobox; the article also notes the name's allusion to Coq." }
    - { type: influenced_by, to: haskell, weight: moderate, confidence: medium, sources: [wiki-agda], note: "Infobox." }
    - { type: implemented_in, to: haskell, weight: strong, confidence: high, sources: [wiki-agda] }
  research_status: draft
  confidence: medium
  links: { wikipedia: "https://en.wikipedia.org/wiki/Agda_(programming_language)" }
  sources: [wiki-agda]
  example:
    title: Naturals and the ≤ relation
    language: Agda
    note: "From Wikipedia. _≤_ is a mixfix name; its constructors are proofs, so a value of type m ≤ n is a proof of the inequality. Indentation was lost in fetching and has been restored; Agda requires constructors to be indented."
    code: |
      data ℕ : Set where
        zero : ℕ
        suc  : ℕ → ℕ

      data _≤_ : ℕ → ℕ → Set where
        z≤n : {n : ℕ} → zero ≤ n
        s≤s : {n m : ℕ} → n ≤ m → suc n ≤ suc m
    sources: [wiki-agda]

- id: xslt
  name: XSLT
  aliases: [XSL Transformations]
  kind: language
  category: domain-specific
  cluster: data
  origin:
    began: { year: 1998, precision: year, note: "Part of the W3C XSL effort of 1998-1999 (Wikipedia's infobox gives 1998 as first appearance)." }
    first_appeared: { year: 1999, date: "1999-11-16", precision: exact, note: "XSLT 1.0 W3C Recommendation." }
    places: [{ institution: World Wide Web Consortium }]
  creators:
    - { name: James Clark, role: "editor, XSLT 1.0" }
    - { name: Michael Howard Kay, role: "editor, XSLT 2.0 and 3.0" }
  status: active
  tags:
    paradigm: [declarative, functional]
    features: [pattern-matching, recursion]
    domain: [web]
  milestones:
    - { version: "1.0", year: 1999 }
    - { version: "2.0", year: 2007, summary: "Built on XPath 2.0 and the XDM data model, with schema-aware typing." }
    - { version: "3.0", year: 2017, summary: "W3C Recommendation 8 June 2017; streaming and higher-order functions." }
  summary: >
    "A language for transforming XML documents into other XML documents", designed as part of XSL. A stylesheet
    is a set of templates matched against nodes by XPath patterns; XSLT "is influenced by functional languages,
    and by text-based pattern matching languages like SNOBOL and AWK", and is Turing-complete. Its most direct
    predecessor is the SGML-era DSSSL.
  notes: >
    DSSSL (Scheme-based) is not yet a node; "Some members of the standards committee that developed XSLT,
    including James Clark, the editor, had previously worked on DSSSL." The 2.0 and 3.0 feature summaries are
    from the Wikipedia article's version list; the specs themselves were not read. Michael Kay's article title
    is "Michael Howard Kay".
  relations:
    - { type: influenced_by, to: snobol, aspects: [pattern-matching], weight: weak, confidence: medium, sources: [wiki-xslt] }
    - { type: influenced_by, to: awk, aspects: [pattern-matching], weight: weak, confidence: medium, sources: [wiki-xslt] }
  research_status: draft
  confidence: medium
  links: { wikipedia: "https://en.wikipedia.org/wiki/XSLT" }
  sources: [w3c-1999-xslt, wiki-xslt]
  example:
    title: Templates matched on nodes
    language: XSLT 1.0
    note: "From Wikipedia: turns <person> elements into <name> elements. {@username} is an attribute-value template. Indentation was lost in fetching and is ours."
    code: |
      <xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" version="1.0">
        <xsl:output method="xml" indent="yes"/>
        <xsl:template match="/persons">
          <root>
            <xsl:apply-templates select="person"/>
          </root>
        </xsl:template>
        <xsl:template match="person">
          <name username="{@username}">
            <xsl:value-of select="name" />
          </name>
        </xsl:template>
      </xsl:stylesheet>
    sources: [wiki-xslt]
