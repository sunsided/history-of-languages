- id: gnu-c
  name: GNU C
  aliases: [GCC C dialect, gnu89, gnu99, gnu11, gnu17, gnu23, DJGPP]
  kind: language
  category: systems
  cluster: c-family/compilers
  origin:
    first_appeared: { year: 1987, date: "1987-03-22", precision: exact, note: "GCC 1.0, then the GNU C Compiler, released by Richard Stallman." }
    places: [{ institution: Free Software Foundation, city: Cambridge MA, country: US }]
  creators:
    - { name: Richard Stallman, role: author of GCC }
  status: active
  tags:
    paradigm: [imperative, procedural, structured]
    typing: [static-typing, weak-typing]
    memory: [manual-memory, pointers]
    features: [nested-functions, expression-oriented, preprocessor, compiler]
  milestones:
    - { version: "GCC 15 default gnu23", year: 2025, summary: "The default C dialect is gnu23, a superset of C23." }
  summary: >
    The C accepted by GCC by default: ISO C plus GNU extensions such as statement expressions, typeof,
    nested functions, labels as values (computed goto), zero-length arrays, __attribute__ and an inline
    assembly syntax. The Linux kernel and much free software are written in it rather than in strict ISO
    C, and some of its ideas later entered the standard.
  notes: >
    DJGPP (DJ Delorie, 1989) is a port of GCC to DOS with 32-bit protected-mode output; it adds no
    language of its own, so it is a note here, not a node. Whether typeof itself is standard in C23 is
    not confirmed by the GCC pages read (they mention C23's typeof_unqual).
  relations:
    - { type: superset_of, to: c, weight: strong, confidence: high, note: "'GNU C provides several language features not found in ISO standard C' (GCC manual).", sources: [gcc-manual-c-extensions] }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/GNU_Compiler_Collection", homepage: "https://gcc.gnu.org" }
  sources: [gcc-manual-c-extensions, wiki-gcc, wiki-djgpp]
  example:
    title: "Three things ISO C cannot do"
    language: "GNU C"
    note: "The three fragments are from the GCC manual: a statement expression (a block whose last expression is its value), a nested function, and labels as values for a computed goto (common in interpreter dispatch loops)."
    code: |
      /* statement expression: the block's value is z */
      ({ int y = foo (); int z;
         if (y > 0) z = y;
         else z = - y;
         z; })

      /* nested function */
      foo (double a, double b)
      {
        double square (double z) { return z * z; }

        return square (a) + square (b);
      }

      /* labels as values */
      static void *array[] = { &&foo, &&bar, &&hack };
      goto *array[i];
    sources: [gcc-manual-c-extensions]

