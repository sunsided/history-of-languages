  status: legacy
  tags:
    paradigm: [imperative, structured, modular, object-oriented]
    typing: [static-typing, strong-typing]
    memory: [garbage-collection]
    features: [type-extension, modules]
  summary: "Smaller than Modula-2, adding record type extension (single inheritance without classes). Oberon's method syntax `func (r Rec) M()` is the acknowledged source of Go's receiver syntax."
  relations:
    - { type: successor_of, to: modula-2, weight: strong, confidence: high }
  research_status: draft
  confidence: high
  sources: [wirth-2007-modula2-oberon]
  example:
    title: Type extension and receivers
    language: Oberon-2
    note: 'Oberon extends records instead of declaring classes. Oberon-2''s type-bound procedure syntax PROCEDURE (c: Circle) Area is where Go''s method receivers come from.'
    code: |
      TYPE
        Shape = POINTER TO ShapeDesc;
        ShapeDesc = RECORD END;
        Circle = POINTER TO CircleDesc;
        CircleDesc = RECORD (ShapeDesc) r: REAL END;

      PROCEDURE (c: Circle) Area(): REAL;
      BEGIN RETURN 3.14159 * c.r * c.r
      END Area;
    sources: [wirth-2007-modula2-oberon]

