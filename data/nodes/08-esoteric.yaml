    title: Translating combinators to bits
    language: Jot
    note: "From the Esolang wiki (\"Computational class\"): K and S and application map to bit strings, which proves Jot Turing-complete."
    code: |
      {K}     ->   11100
      {S}     ->   11111000
      {AB}    ->   1{A}{B}
    sources: [esolangs-jot]

