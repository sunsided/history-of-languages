    the new Dr. Dobb's Journal, which was founded to carry them. "Tiny BASIC is a proper subset of Dartmouth BASIC".
  notes: >
    Wikipedia's infobox lists Astro BASIC, Atari BASIC and Level I BASIC as influenced; only Level I is
    discussed in the text read. Calling Tiny BASIC the start of the open software movement comes from the
    article's unread tail, so it is not used here.
  relations:
    - { type: subset_of, to: basic, weight: strong, confidence: high, sources: [wiki-tiny-basic], note: "Pittman: \"Tiny BASIC is a proper subset of Dartmouth BASIC\"." }
  research_status: draft
  confidence: medium
  links: { wikipedia: "https://en.wikipedia.org/wiki/Tiny_BASIC" }
  sources: [wiki-tiny-basic]
  example:
    title: The interpreter's own intermediate language
    language: Tiny BASIC IL
    note: "From Wikipedia. This is not Tiny BASIC itself but the IL in which the interpreter was specified: TST tries to match a keyword and branches if it fails, so these lines parse GOTO/GOSUB and PRINT. Porting meant writing a small IL interpreter for the new CPU."
    code: |
      S1: TST S3,'GO'       ;GOTO OR GOSUB?
          TST S2,'TO'       ;YES...TO, OR...SUB
          CALL EXPR         ;GET LABEL
          DONE              ;ERROR IF CR NOT NEXT
          XFER              ;SET UP AND JUMP
      S3: TST S8,'PRINT'    ;PRINT.
    sources: [wiki-tiny-basic]

