    typing: [static-typing]
    concurrency: [channels, synchronous-rendezvous, processes]
    features: [offside-rule]
    domain: [embedded, parallel-hardware]
  summary: "CSP made into a language for the Inmos Transputer: PAR, SEQ and ALT constructs and channels in hardware."
  relations:
    - { type: influenced_by, to: csp, aspects: [channels, synchronous-rendezvous], weight: strong, confidence: high }
  research_status: draft
  confidence: high
  sources: [wiki-occam]
  example:
    title: PAR, channels, indentation
    language: occam 2
    note: SEQ and PAR say whether the indented processes run in sequence or in parallel; ! sends and ? receives on a channel, synchronously, as in CSP. Indentation is the syntax.
    code: |
      CHAN OF INT c:
      PAR
        SEQ i = 0 FOR 10
          c ! i * i
        INT x:
        SEQ i = 0 FOR 10
          SEQ
            c ? x
            out ! x
    sources: [wiki-occam]

