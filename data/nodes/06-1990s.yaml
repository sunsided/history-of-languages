- id: lua
  name: Lua
  kind: language
  category: scripting
  cluster: scripting/embedded
  origin:
    first_appeared: { year: 1993, precision: year }
    places: [{ institution: "PUC-Rio (Tecgraf)", city: Rio de Janeiro, country: BR }]
  creators:
    - { name: Roberto Ierusalimschy, role: designer }
    - { name: Luiz Henrique de Figueiredo, role: designer }
    - { name: Waldemar Celes, role: designer }
  status: active
  tags:
    paradigm: [multi-paradigm, imperative, functional, prototype-based]
