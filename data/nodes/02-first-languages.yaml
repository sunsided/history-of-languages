- id: rpg
  name: RPG
  aliases: [Report Program Generator, IBM RPG, RPG II, RPG III, RPG IV, ILE RPG, RPG/400]
  kind: language
  category: business
  cluster: business
  origin:
    first_appeared: { year: 1959, precision: year, note: "\"introduced in 1959 for the IBM 1401\"." }
    places: [{ institution: IBM, country: US }]
  status: active
  tags:
    paradigm: [declarative, procedural]
    typing: [static-typing]
    features: [records]
    domain: [business-data-processing]
  milestones:
    - { version: RPG II, year: 1969, summary: "Introduced \"about 1969\" with the System/3; later on System/32, /34 and /36." }
    - { version: RPG III, year: 1979, summary: "For the System/38 (1979) and later the AS/400; it \"significantly departed from the original language\"." }
    - { version: RPG IV, year: 1994, summary: "Also called ILE RPG, with OS/400 V3R2." }
    - { version: "V5R1 free-form", year: 2001, summary: "Free-format calculation specifications." }
    - { version: "7.1 TR7", year: 2013, summary: "Whole programs in free form, without /free and /end-free." }
  summary: >
    IBM's report program generator, made so that tabulating-machine technicians who had wired plugboards could
    move to the 1401: "Instead of writing a particular program for a report, the user states his problem and its
    solution" on fixed-column specification sheets, and an implicit program cycle reads, calculates and prints.
    It evolved through RPG II, III and IV into a free-form procedural language still used on IBM i.
  notes: >
    Influenced by 9PAC and FARGO (Wikipedia infobox), neither yet a node; FARGO was "the predecessor to RPG on the
    IBM 1401". FOLDOC credits Wilf Hey with the work that led to RPG; not confirmed, so no creator is listed.
    The infobox also lists dialects Baby/36, Baby/400, Lattice RPG and VAX RPG II.
  research_status: draft
  confidence: medium
  links: { wikipedia: "https://en.wikipedia.org/wiki/IBM_RPG" }
  sources: [wiki-ibm-rpg, ibm-1964-1401-rpg]
  example:
    title: Fully free-form RPG IV with embedded SQL
    language: RPG IV
    year: 2013
    note: "From Wikipedia: a program called with a customer number that returns name and address, written completely in free form as allowed from 7.1 TR7. The fetched text lost indentation; it is ours. The original fixed-column specification sheets could not be recovered from the fetch."
    code: |
      ctl-opt main(GetCustInf);
      dcl-ds ARMSTF1 ext end-ds;
      dcl-proc GetCustInf;
        dcl-pi *n extpgm('CUS001');
          inCusNo like(arCNum) const;
          outName like(arName);
          outAddr1 like(arAdd1);
          outAddr2 like(arAdd2);
          outCity like(arCity);
          outState like(arStte);
          outZip like(arZip);
        end-pi;
        exec sql select arName, arAdd1, arAdd2, arCity, arStte, arZip
                 into :outName, :outAddr1, :outAddr2, :outCity, :outState,
                      :outZip
                 from ARMSTF1
                 where arCNum = :inCusNo
                 fetch first 1 row only
                 with CS
                 use currently committed;
        return;
      end-proc;
    sources: [wiki-ibm-rpg]

