  example:
    title: Solving the van der Pol equation
    language: MATLAB
    note: "From Moler's history, section \"Modern MATLAB\". @(t,y) is an anonymous function; [y(2); ...] builds a column vector, and ' transposes."
    code: |
      mu = 5;
      vdp = @(t,y) [y(2); mu*(1-y(1)^2)*y(2)-y(1)];
      tspan = [0 30];
      y0 = [0 0.01]';
      [t,y] = ode23s(vdp,tspan,y0);
      plot(t,y,'.-')
      legend({'y','dy/dt'})
      xlabel('t')
