    typing: [static-typing, type-inference, parametric-polymorphism]
    memory: [garbage-collection]
    features: [exceptions, first-class-functions]
  summary: "Built as the scripting language for a theorem prover, it introduced Hindley-Milner type inference: static types without annotations, with parametric polymorphism. Root of Standard ML, Caml/OCaml, F#, and (with Miranda) Haskell; its types reach Rust, Swift and Scala."
  relations:
    - { type: influenced_by, to: lisp, weight: strong, confidence: high }
    - { type: influenced_by, to: iswim, weight: strong, confidence: high }
  research_status: draft
  confidence: high
  sources: [macqueen-harper-reppy-2020-history-sml, milner-1978-type-polymorphism]
  example:
    title: An LCF ML session
    language: Edinburgh LCF ML
    note: 'From Wikipedia''s ML article, whose samples are derived from Edinburgh LCF (layout restored). # is the prompt and ;; ends input. No types are written, yet each answer comes back with an inferred type, including the polymorphic hd : ((* list) -> *), where * is a type variable.'
    code: |
      #let add x y = x+y;;
      add = - : (int -> (int -> int))
      #letrec fact n = if n = 0 then 1 else n * fact(n-1);;
      fact = - : (int -> int)
      #fact 4;;
      24 : int
      #hd;;
      - : ((* list) -> *)
      #map (\x.x*x) [1;2;3;4];;
      [1; 4; 9; 16] : (int list)
    sources: [wiki-ml, macqueen-harper-reppy-2020-history-sml]

