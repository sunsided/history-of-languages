# The 1970s: Pascal, C, Smalltalk, Prolog, ML, Scheme, SQL, CLU, concurrency languages, Ada.

- id: pascal
  name: Pascal
  kind: language
  category: educational
  cluster: algol/wirth
  origin:
    first_appeared: { year: 1970, precision: year }
    places: [{ institution: ETH Zürich, city: Zürich, country: CH }]
  creators: [{ name: Niklaus Wirth, role: designer }]
  status: legacy
  tags:
    paradigm: [imperative, procedural, structured]
    typing: [static-typing, strong-typing]
    features: [records, nested-functions, intermediate-code]
    domain: [education]
  milestones:
    - { version: UCSD Pascal (p-code), year: 1977, introduces: [bytecode-vm], summary: "Portable p-code virtual machine; an ancestor of the JVM idea." }
    - { version: Turbo Pascal, year: 1983, summary: "Borland's fast IDE-compiler made Pascal a PC mainstream language." }
    - { version: ISO 7185, year: 1983 }
    - { version: Object Pascal / Delphi, year: 1995, introduces: [object-oriented], summary: "Apple Object Pascal (1986) then Borland Delphi (1995); see Delphi node later." }
  summary: >
    Small, strongly typed ALGOL descendant designed for teaching structured programming. Turbo Pascal
    and Delphi made it a commercial success. Through Delphi's chief architect, Anders Hejlsberg, it
    leads to C# and TypeScript.
  relations:
    - { type: successor_of, to: algol-w, weight: strong, confidence: high }
    - { type: influenced_by, to: algol-60, weight: strong, confidence: high }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Pascal_(programming_language)" }
  sources: [wirth-1993-recollections-pascal]
  example:
    title: Records, procedures, structured control
    language: Pascal
    note: Strong typing, records and nested procedures with no gotos needed, which is why it was the teaching language of choice for 20 years. var marks a by-reference parameter.
    code: |
      program Shapes;
      type
        Point = record x, y: real end;
      var
        p: Point;

      procedure Move(var q: Point; dx, dy: real);
      begin
        q.x := q.x + dx;
        q.y := q.y + dy
      end;

      begin
        p.x := 0; p.y := 0;
        Move(p, 3, 4);
        writeln('(', p.x:0:1, ', ', p.y:0:1, ')')
      end.
    sources: [wirth-1993-recollections-pascal]

- id: c
  name: C
  kind: language
  category: systems
  cluster: c-family
  origin:
    began: { year: 1971, precision: year }
    first_appeared: { year: 1972, precision: year, note: "Unix kernel rewritten in C during 1973." }
    places: [{ institution: Bell Labs, city: Murray Hill NJ, country: US }]
  creators:
    - { name: Dennis Ritchie, role: designer }
    - { name: Ken Thompson, role: contributor }
  status: active
  tags:
    paradigm: [imperative, procedural, structured]
    typing: [static-typing, weak-typing]
    memory: [manual-memory, pointers]
    concurrency: [threads, atomics]
    features: [preprocessor, pointer-arithmetic]
    domain: [operating-systems, embedded]
  milestones:
    - { version: K&R C, year: 1978, summary: "The C Programming Language (Kernighan & Ritchie) as de facto standard." }
    - { version: "C89 / C90", year: 1989, introduces: [standardization, function-prototypes], summary: "ANSI X3.159-1989; prototypes borrowed back from C++." }
    - { version: C99, year: 1999, introduces: [line-comments], summary: "// comments, inline, VLAs, designated initializers, stdint.h." }
    - { version: C11, year: 2011, introduces: [threads, atomics, memory-model], summary: "Memory model, <threads.h>, _Atomic (aligned with C++11)." }
    - { version: C17, year: 2018 }
    - { version: C23, year: 2024, summary: "nullptr, constexpr objects, typeof, #embed." }
  summary: >
    Ritchie added types to B so it could address bytes on the PDP-11, and C became the language of
    Unix. Its portability made it the lingua franca of systems programming. Most later mainstream
    syntax (braces, `++`, `for(;;)`) descends from it.
  relations:
    - { type: successor_of, to: b, weight: strong, confidence: high }
    - { type: influenced_by, to: algol-68, aspects: [static-typing], weight: moderate, confidence: high, note: "Ritchie: the scheme of type composition owes a debt to Algol 68." }
    - { type: influenced_by, to: bcpl, weight: strong, confidence: high }
    - { type: influenced_by, to: pdp-11, weight: moderate, confidence: high, note: "Byte addressing on the PDP-11 forced types into the language; ++/-- predate it." }
    - { type: influenced_by, to: pl-i, weight: weak, confidence: medium, note: "Via Multics experience at Bell Labs; e.g. the -> operator." }
    - { type: targets, to: webassembly, year: 2017, weight: moderate, confidence: high, sources: [wiki-webassembly, wiki-emscripten], note: "WebAssembly was designed as a target for C and C++; Emscripten \"compiles C and C++ to Wasm using Clang as a frontend\" and made Wasm its default output in 2019." }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/C_(programming_language)" }
  sources: [ritchie-1993-development-c, kernighan-ritchie-1978]
  example:
    title: "hello, world"
    language: "K&R C"
    year: 1978
    note: "Page one of The C Programming Language. No return type, no #include: pre-ANSI C assumed int and implicitly declared printf."
    sources: [kernighan-ritchie-1978]
    code: |
      main()
      {
          printf("hello, world\n");
      }

- id: smalltalk
  name: Smalltalk
  kind: language
  category: general
  cluster: oop/simula-smalltalk
  origin:
    began: { year: 1971, precision: circa }
    first_appeared: { year: 1972, precision: year, note: "Smalltalk-72; public release Smalltalk-80 in 1980." }
    places: [{ institution: Xerox PARC, city: Palo Alto, country: US }]
  creators:
    - { name: Alan Kay, role: designer }
    - { name: Dan Ingalls, role: designer, affiliation: Xerox PARC }
    - { name: Adele Goldberg, role: designer, affiliation: Xerox PARC }
  status: legacy
  tags:
    paradigm: [object-oriented, reflective]
    typing: [dynamic-typing]
    memory: [garbage-collection]
    concurrency: [green-threads]
    features: [message-passing, late-binding, everything-is-an-object, image-based, live-programming, blocks-closures, metaclasses, ide]
  milestones:
    - { version: Smalltalk-72, year: 1972, summary: "Objects as message receivers parsing their own messages." }
    - { version: Smalltalk-76, year: 1976, introduces: [inheritance, classes], summary: "Class hierarchy with inheritance, compiled bytecode." }
    - { version: Smalltalk-80, year: 1980, introduces: [metaclasses], summary: "Released outside PARC; Blue Book 1983." }
    - { version: Squeak, year: 1996 }
    - { version: Pharo, year: 2008 }
  summary: >
    Kay's "object-oriented" vision: everything is an object, and objects communicate only by late-bound
    messages, like cells or networked computers. Pioneered the modern GUI, the IDE, MVC, live
    programming and bytecode VMs with JIT compilation. It is the dynamic branch of OOP,
    in contrast to Simula's and C++'s static branch.
  relations:
    - { type: influenced_by, to: simula, aspects: [classes, objects], weight: strong, confidence: high, note: "Kay read Simula in 1966 and took the idea of objects as independent simulated entities; Smalltalk-72 did not yet have inheritance." }
    - { type: influenced_by, to: lisp, aspects: [late-binding, garbage-collection, reflection], weight: strong, confidence: high, note: "Kay called LISP 1.5's eval 'the Maxwell's equations of software'." }
    - { type: influenced_by, to: logo, weight: moderate, confidence: high, note: "Children as users; Kay visited Papert." }
    - { type: influenced_by, to: sketchpad, aspects: [objects], weight: moderate, confidence: high }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Smalltalk" }
  sources: [kay-1993-early-history-smalltalk, ingalls-2020-evolution-smalltalk]
  example:
    title: "Everything is a message send"
    language: "Smalltalk-80"
    note: "3 + 4 sends #+ to 3. Control structures are messages too: inject:into: takes a block, and conditionals are ifTrue: sent to a Boolean."
    code: |
      3 + 4.
      (1 to: 10) inject: 0 into: [:sum :each | sum + each].
      (x > 0) ifTrue: ['positive'] ifFalse: ['not positive'].
      Transcript show: 'Hello, world'; cr.

- id: sketchpad
  name: Sketchpad
  kind: notation
  category: research
  cluster: oop/simula-smalltalk
  origin:
    first_appeared: { year: 1963, precision: year }
    places: [{ institution: MIT Lincoln Laboratory, city: Lexington MA, country: US }]
  creators: [{ name: Ivan Sutherland, role: designer }]
  status: historical
  tags:
    features: [objects, constraints]
  summary: "Interactive graphics program (Sutherland's PhD) with master drawings and instances that inherited changes, plus constraint solving. Not a language, but Kay lists it with Simula as a source of the object idea."
  research_status: draft
  confidence: high
  sources: [kay-1993-early-history-smalltalk]
  example:
    title: Masters and instances
    language: pseudocode (illustrative)
    note: 'Sketchpad was operated with a light pen, not programmed in text. The pseudocode describes its idea: instances are linked to a master drawing, so changing the master changes every instance, and constraints keep relationships true while you edit.'
    code: |
      master Hexagon = { 6 lines, constraint: all sides equal }
      a = instance of Hexagon at (10, 10), scale 1
      b = instance of Hexagon at (40, 10), scale 2
      edit Hexagon: make one corner rounded
      → a and b redraw with the change
    sources: [kay-1993-early-history-smalltalk]

- id: prolog
  name: Prolog
  kind: language
  category: research
  cluster: logic
  origin:
    first_appeared: { year: 1972, precision: year }
    places: [{ institution: Université d'Aix-Marseille, city: Marseille, country: FR }]
  creators:
    - { name: Alain Colmerauer, role: designer }
    - { name: Philippe Roussel, role: designer }
