    paradigm: [imperative, scripting]
    features: [interpreter]
  milestones:
    - { version: "4.0", year: 2025, summary: "Rewritten in Rust (released 27 February 2025); earlier C++ and, before 1.8, C." }
  summary: >
    A shell that deliberately breaks POSIX compatibility for a simpler, more uniform syntax: set instead of
    =, no then or fi, functions instead of aliases, and no subshells for language features. Known for
    autosuggestions and syntax highlighting out of the box.
  relations:
    - { type: influenced_by, to: bash, weight: moderate, confidence: medium, sources: [wiki-fish], note: "\"The syntax resembles a POSIX compatible shell (such as Bash), but deviates in many ways\"." }
