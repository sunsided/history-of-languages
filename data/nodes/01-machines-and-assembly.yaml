  example:
    title: Hello, world for MS-DOS
    language: MASM 5+
    note: DOS function 09h of INT 21h prints a string terminated by '$'; 4Ch exits. .MODEL and .CODE are MASM's simplified segment directives.
    code: |2
              .MODEL SMALL
              .STACK 100h
              .DATA
      msg     DB 'Hello, world', 13, 10, '$'
