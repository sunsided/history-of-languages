    memory: [garbage-collection]
    concurrency: [coroutines]
    features: [tables, metatables, closures, embeddable]
    domain: [game-scripting, embedded]
  milestones:
    - { version: "5.0", year: 2003, introduces: [coroutines], summary: "Asymmetric, stackful coroutines; register-based VM." }
    - { version: "5.1", year: 2006 }
    - { version: "5.4", year: 2020 }
  summary: "Small, embeddable scripting language built on a single data structure, the table. Its first-class stackful coroutines are the textbook example of the alternative to async/await's stackless model."
  relations:
    - { type: influenced_by, to: scheme, aspects: [closures, first-class-functions], weight: moderate, confidence: high }
    - { type: influenced_by, to: clu, aspects: [multiple-assignment, iterators], weight: moderate, confidence: high }
    - { type: influenced_by, to: snobol, aspects: [associative-arrays], weight: weak, confidence: medium }
    - { type: influenced_by, to: modula-2, weight: weak, confidence: medium }
  research_status: draft
  confidence: high
  sources: [ierusalimschy-2007-evolution-lua]
  example:
    title: Tables and coroutines
    language: Lua 5.4
    note: 'One data structure, the table, serves as array, map and object. coroutine.wrap gives a stackful coroutine: yield can happen anywhere down the call stack, unlike async/await''s stackless coroutines.'
    code: |
      local function range(n)
        return coroutine.wrap(function()
          for i = 1, n do coroutine.yield(i) end
        end)
      end

      local squares = {}
      for i in range(5) do squares[#squares + 1] = i * i end
      print(table.concat(squares, ", "))   -- 1, 4, 9, 16, 25
    sources: [ierusalimschy-2007-evolution-lua]

