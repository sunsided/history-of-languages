- id: pl-i
  name: PL/I
  aliases: [PL/1, NPL]
  kind: language
  category: general
  cluster: business
  origin:
    began: { year: 1963, precision: year }
    first_appeared: { year: 1964, precision: year, note: "Language specification 1964; first compiler 1966." }
    places: [{ institution: IBM / SHARE, country: US }]
  creators: [{ name: George Radin, role: lead }]
  status: legacy
  tags:
    paradigm: [imperative, procedural, structured]
    typing: [static-typing]
    concurrency: [multitasking]
    features: [exceptions, pointers, block-structure]
  summary: >
    IBM's attempt to unify scientific (Fortran) and business (COBOL) programming for System/360.
    An early language with exception handling (ON-conditions) and built-in multitasking. Used to
    write Multics, whose ideas shaped Unix and, through it, C.
  relations:
    - { type: influenced_by, to: fortran, weight: strong, confidence: high }
    - { type: influenced_by, to: cobol, aspects: [records], weight: strong, confidence: high }
    - { type: influenced_by, to: algol-60, aspects: [block-structure], weight: strong, confidence: high }
    - { type: targets, to: ibm-system-360, weight: moderate, confidence: high }
  research_status: draft
  confidence: high
  sources: [radin-1978-pl1]
  example:
    title: Exceptions as ON-conditions
    language: PL/I
    note: 'ON ZERODIVIDE registers a handler that runs when the condition is raised anywhere below in the call chain: an early form of exception handling (1964). PL/I mixed FORTRAN-style arithmetic, COBOL-style decimal data and ALGOL-style blocks.'
    code: |
      DIVIDE: PROCEDURE OPTIONS(MAIN);
         DECLARE (A, B, C) FIXED DECIMAL(7,2);
         ON ZERODIVIDE BEGIN;
            PUT LIST('Division by zero, using 0');
            C = 0;
            GO TO DONE;
         END;
         GET LIST(A, B);
         C = A / B;
      DONE:
         PUT LIST(C);
      END DIVIDE;
    sources: [radin-1978-pl1]

- id: algol-w
  name: ALGOL W
  kind: language
  category: scientific
  cluster: algol/wirth
  origin:
    first_appeared: { year: 1966, precision: year }
    places: [{ institution: Stanford University, city: Stanford, country: US }]
  creators:
    - { name: Niklaus Wirth, role: designer }
    - { name: Tony Hoare, role: designer }
  status: extinct
  tags:
    paradigm: [imperative, structured]
    typing: [static-typing]
    features: [records, references]
  summary: "Wirth and Hoare's conservative successor proposal for ALGOL 60, rejected by IFIP WG 2.1 in favour of what became ALGOL 68. Introduced records and references; led directly to Pascal."
  relations:
    - { type: influenced_by, to: algol-60, weight: strong, confidence: high }
    - { type: implemented_in, to: pl360, weight: strong, confidence: high, sources: [wiki-pl360], note: "\"Wirth used PL360 to create ALGOL W.\"" }
  research_status: draft
  confidence: high
  sources: [wirth-1993-recollections-pascal]
  example:
    title: Records and references
    language: ALGOL W
    note: 'Records with typed references, from Hoare''s record-handling proposal. Fields are accessed as functions of the reference: val(head). null is where Hoare''s ''billion-dollar mistake'' enters.'
    code: |
      begin
        record node (integer val; reference(node) next);
        reference(node) head;
        head := node(1, node(2, null));
        write(val(head), val(next(head)))
      end.
    sources: [wirth-1993-recollections-pascal, hoare-2009-billion-dollar]

- id: simula
  name: Simula
  aliases: [Simula I, Simula 67]
  kind: language
  category: domain-specific
  cluster: oop/simula-smalltalk
  origin:
    began: { year: 1962, precision: year, note: "Simula I developed 1962-1965 as a simulation language." }
    first_appeared: { year: 1967, precision: year, note: "Simula 67 defined at the 1967 Common Base Conference." }
    places: [{ institution: Norwegian Computing Center, city: Oslo, country: "NO" }]
  creators:
    - { name: Ole-Johan Dahl, role: designer }
    - { name: Kristen Nygaard, role: designer }
  status: legacy
  tags:
    paradigm: [object-oriented, imperative, structured]
    typing: [static-typing]
    memory: [garbage-collection]
    concurrency: [coroutines]
    features: [classes, objects, inheritance, virtual-dispatch, coroutines]
    domain: [simulation]
  milestones:
    - { version: Simula I, year: 1965, summary: "Process-oriented discrete-event simulation." }
    - { version: Simula 67, year: 1967, introduces: [classes, objects, inheritance, virtual-dispatch], summary: "General-purpose language with class, subclass (prefix), virtual procedures, and detach/resume coroutines for quasi-parallel processes." }
  summary: >
    Superset of ALGOL 60 for discrete-event simulation, where every simulated entity runs as a
    coroutine. Simula 67 introduced classes, objects, inheritance and virtual procedures: the origin
    of object-oriented programming. Stroustrup built C++ to get "Simula's facilities for program
    organization together with C's efficiency".
  relations:
    - { type: superset_of, to: algol-60, weight: strong, confidence: high }
    - { type: influenced_by, to: algol-60, aspects: [block-structure], weight: strong, confidence: high }
    - { type: influenced_by, to: hoare-record-classes, aspects: [classes, records, references], weight: strong, confidence: high, note: "Dahl and Nygaard credit Hoare's 1965-66 record class proposal for the class/subclass concept of Simula 67." }
    - { type: influenced_by, to: simscript, weight: moderate, confidence: medium, sources: [wiki-simscript], note: "SIMSCRIPT \"influenced Simula\"; reference text: \"The development of … SIMULA I and SIMULA 67 … were influenced by the design of SIMSCRIPT\"." }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Simula" }
  sources: [nygaard-dahl-1978-simula, dahl-2002-birth-oo, stroustrup-1993-hopl2]
  example:
    title: Class, subclass, virtual procedure
    language: Simula 67
    year: 1967
    note: 'Shape declares a virtual procedure that the subclass Circle binds; S.Draw dispatches at run time on the actual class. Subclassing is written as a prefix: Shape Class Circle. :- assigns references, := values.'
    code: |
      Begin
         Class Shape;
            Virtual: Procedure Draw;
         Begin
         End;

         Shape Class Circle(R); Real R;
         Begin
            Procedure Draw;
            Begin OutText("Circle, radius "); OutFix(R, 1, 4); OutImage End;
         End;

         Ref(Shape) S;
         S :- New Circle(2.0);
         S.Draw;
      End;
    sources: [nygaard-dahl-1978-simula]

- id: hoare-record-classes
  name: Hoare's record handling (record classes)
  kind: notation
  category: research
  cluster: oop/simula-smalltalk
  origin:
    first_appeared: { year: 1965, precision: year, note: "'Record Handling', ALGOL Bulletin 21, 1965; expanded 1966." }
    places: [{ country: GB }]
  creators:
    - { name: Tony Hoare, role: author }
  status: historical
  tags:
    features: [records, references]
  summary: "Proposal for ALGOL extensions: record classes with typed references (pointers) and subclasses. Feeds Simula 67's classes and, via ALGOL W, Pascal's records. Hoare later called the null reference his 'billion-dollar mistake'; it was introduced in ALGOL W."
  relations:
    - { type: influenced_by, to: algol-60, weight: strong, confidence: high }
  research_status: draft
  confidence: medium
  sources: [nygaard-dahl-1978-simula, hoare-2009-billion-dollar]
  example:
    title: Record classes with references
    language: Hoare's proposed ALGOL notation (approximate)
    year: 1965
    note: Approximate; check the wording against 'Record Handling' (1965/66). A record class declares fields; a reference variable may only point to records of its class. Simula 67 generalized record classes into classes with procedures and subclasses.
    code: |
      record class person (integer age; reference father, mother (person));
      reference p (person);
      p := person(30, null, null);
      age(p) := age(p) + 1
    sources: [nygaard-dahl-1978-simula]

- id: bcpl
  name: BCPL
  aliases: ["Basic Combined Programming Language"]
  kind: language
  category: systems
  cluster: algol/bcpl-line
  origin:
    first_appeared: { year: 1967, precision: year, note: "Designed by Richards while visiting MIT; first compiler 1967." }
    places: [{ institution: University of Cambridge / MIT, country: GB }]
  creators: [{ name: Martin Richards, role: designer }]
  status: legacy
  tags:
    paradigm: [imperative, procedural, structured]
    typing: [typeless]
    features: [portable-compiler, intermediate-code, line-comments]
  summary: >
    Typeless systems language (everything is a machine word) cut down from CPL, designed for writing
    compilers. Its compiler emitted a portable intermediate code (O-code). It is the parent of B,
    and gave C++ (and later C99) its `//` comments.
  relations:
    - { type: successor_of, to: cpl, weight: strong, confidence: high, note: "A subset of CPL's ideas, simplified." }
  research_status: draft
  confidence: high
  sources: [ritchie-1993-development-c, stroustrup-1993-hopl2]
  example:
    title: Factorials
    language: BCPL
    note: Everything is a word, so there are no types. $( and $) are BCPL's braces (later {}), VALOF/RESULTIS make a block into an expression, and *N is the newline escape that became \n in C.
    code: |
      GET "LIBHDR"

      LET START() = VALOF
      $( FOR I = 1 TO 5 DO
            WRITEF("%N! = %I4*N", I, FACT(I))
         RESULTIS 0
      $)

      AND FACT(N) = N = 0 -> 1, N * FACT(N - 1)
    sources: [ritchie-1993-development-c]

