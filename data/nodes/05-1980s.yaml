    title: Regexes and hashes
    language: Perl 5
    note: Sigils give the kind of variable ($ scalar, % hash), regex matching is an operator, and the hash autovivifies. Tested with perl 5.
    code: |
      my %count;
      while (my $line = <STDIN>) {
          $count{lc $1}++ while $line =~ /(\w+)/g;
      }
      for my $w (sort { $count{$b} <=> $count{$a} } keys %count) {
          printf "%4d %s\n", $count{$w}, $w;
      }
