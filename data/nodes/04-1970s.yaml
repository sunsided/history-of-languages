    first_appeared: { year: 1978, precision: disputed, note: "Wikipedia's C shell article: first distributed with 2BSD in 1978; its Thompson shell article dates 2BSD to 1979." }
    places: [{ institution: "University of California, Berkeley", country: US }]
  creators:
    - { name: Bill Joy, role: creator (graduate student) }
  status: maintained
  tags:
    paradigm: [imperative, scripting]
    features: [interpreter]
  summary: >
    Bill Joy's shell for BSD, with a syntax modelled on C (parentheses, keywords, an expression grammar and
    arrays) and the interactive features later shells copied: history, aliases, directory stacks, ~
    notation and job control. Its scripting was criticised, but its interactive ideas went into ksh, Bash
    and Zsh.
  notes: >
    Successor: tcsh, which added filename and command completion and command-line editing borrowed from
    TENEX. Its release year is not yet sourced, so it is not a milestone here. Early contributors named by
    Wikipedia: Michael Ubell, Eric Allman, Mike O'Brien, Jim Kulp.
  relations:
    - { type: influenced_by, to: c, weight: strong, confidence: high, sources: [wiki-c-shell], note: "\"The keywords, the use of parentheses, and the C shell's built-in expression grammar and support for arrays were all strongly influenced by C.\"" }
    - { type: influenced_by, to: thompson-shell, aspects: [pipes], weight: moderate, confidence: medium, sources: [wiki-thompson-shell] }
  research_status: draft
  confidence: medium
  links: { wikipedia: "https://en.wikipedia.org/wiki/C_shell" }
  sources: [wiki-c-shell]
  example:
    title: Powers of two
    language: C shell
    note: "From the Wikipedia C shell article's Bourne/C shell comparison. @ evaluates C-like expressions (*=, ++). Run with tcsh."
    code: |
      #!/bin/csh
      set i = 2
      set j = 1
      while ( $j <= 10 )
        echo '2 **' $j = $i
        @ i *= 2
        @ j++
      end
