  status: active
  tags:
    paradigm: [functional, imperative, scripting]
    typing: [dynamic-typing]
    features: [macros, embeddable, bytecode-vm]
  summary: >
    A small Lisp for "system scripting, expressive automation, and extending programs written in C or C++",
    embeddable as a single C file and header. It has a built-in PEG engine in place of regular expressions,
    and the whole language is under 1 MB.
  relations:
    - { type: dialect_of, to: lisp, weight: strong, confidence: medium, sources: [janet-readme] }
    - { type: influenced_by, to: lua, aspects: [embeddable], weight: moderate, confidence: medium, sources: [janet-readme], note: "\"It's like Lua and GNU Guile in that regard\" (embedding)." }
  research_status: draft
  confidence: low
  links: { homepage: "https://janet-lang.org" }
  sources: [janet-lang-org, janet-readme]
  example:
    title: 3SUM with tables
    language: Janet
    note: "From janet-lang.org. @{} is a mutable table; a struct literal {...} (immutable) serves as a set of indices."
    code: |
      (defn sum3
        "Solve the 3SUM problem in O(n^2) time."
        [s]
        (def tab @{})
        (def solutions @{})
        (def len (length s))
        (for k 0 len
          (put tab (s k) k))
        (for i 0 len
          (for j 0 len
            (def k (get tab (- 0 (s i) (s j))))
            (when (and k (not= k i) (not= k j) (not= i j))
              (put solutions {i true j true k true} true))))
        (map keys (keys solutions)))
    sources: [janet-lang-org]

