    note: "The Turbo Basic sample from Wikipedia's PowerBASIC article. Compiled to a DOS executable; DO … LOOP WHILE and string concatenation with +."
    code: |
      INPUT "What is your name?: ", n$
      PRINT "Hello "; n$
      DO
      s$ = ""
      INPUT "How many stars do you want to print"; s
      FOR i = 1 TO s
      s$ = s$ + "*"
      NEXT i
      PRINT s$
      DO
      INPUT "Do you want to print more stars"; q$
