    title: A sine tone with noise, and a recursive function
    language: SuperCollider (sclang)
    note: "Verbatim from Wikipedia's SuperCollider article. { ... }.play turns a function into a synth on the server; SinOsc.ar and PinkNoise.ar are unit generators running at audio rate."
