    (Imperial College and ICL) added strictness annotations.
  notes: >
    A frequent claim that Hope's data types passed into Standard ML (MacQueen worked on both) is not stated
    on the pages read; it needs a source before it becomes an edge. NPL (Burstall and Darlington, 1970s) is
    not yet a node.
