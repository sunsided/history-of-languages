  confidence: medium
  links: { wikipedia: "https://en.wikipedia.org/wiki/PEARL_(programming_language)" }
  sources: [wiki-pearl]
  example:
    title: Hello World
    language: PEARL
    note: "From Wikipedia's PEARL article; the fetched copy had no indentation, and none is added here."
    sources: [wiki-pearl]
    code: |
      MODULE (HELLOWORLD);
      SYSTEM;
      TERMINAL:DIS<->SDVLS(2);
      PROBLEM;
      SPC TERMINAL DATION INOUT ALPHIC DIM(,) TFU MAX FORWARD CONTROL (ALL);
      MAIN:TASK;
      OPEN TERMINAL;
      PUT 'Hello World!' TO TERMINAL;
      CLOSE TERMINAL;
      END;
      MODEND;

