    code: |
      10 A$ = "HELLO, ALTAIR"
      20 PRINT A$; LEN(A$)
      30 X = INT(RND(1) * 6) + 1
      40 PRINT "DIE ROLL:"; X
      50 IF X <> 6 THEN 30
      60 PRINT PEEK(0)
    sources: [wiki-altair-basic]

