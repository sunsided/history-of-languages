- id: pony
  name: Pony
  kind: language
  category: general
  cluster: concurrency
  origin:
    first_appeared: { year: 2015, date: "2015-04-28", precision: exact, note: "First public release, ponyc 0.1.0." }
    places: [{ institution: Imperial College London, country: GB }, { institution: Causality Ltd. }]
  creators:
    - { name: Sylvan Clebsch, role: creator (PhD student at Imperial College London) }
  status: active
  tags:
    paradigm: [object-oriented, concurrent]
    typing: [static-typing]
    memory: [garbage-collection]
    concurrency: [actors, message-passing]
  summary: >
    An actor language whose type system rules out data races: "reference capabilities" on every reference
    say whether data may be read, written or shared, so mutable data can be passed between actors by
    reference safely. Created by Sylvan Clebsch at Imperial College London; compiled ahead of time with LLVM.
  notes: >
    Wikipedia names E's programming model as the inspiration (E is in the concurrency backlog) and lists
    Microsoft's Project Verona as influenced. The design paper is Clebsch, Drossopoulou, Blessing and
    McNeil, "Deny Capabilities for Safe, Fast Actors" (AGERE! 2015). Not yet 1.0.
  relations:
    - { type: influenced_by, to: actor-model, aspects: [actors, message-passing], weight: strong, confidence: high, sources: [clebsch-2015-deny-capabilities], note: "The paper's starting point: \"Combining the actor-model with shared memory for performance is efficient but can introduce data-races.\"" }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Pony_(programming_language)", homepage: "https://www.ponylang.io" }
  sources: [wiki-pony, ponylang-io, clebsch-2015-deny-capabilities]
  example:
    title: An actor with a behaviour
    language: Pony
    note: "Excerpt from ponylang.io. A be (behaviour) is an asynchronous message handler; String val is a reference capability: an immutable string that may be shared between actors."
    code: |
      actor Friend
        let _name: String val

        new create(name: String val) =>
          _name = name

        be invite(party: Party) =>
          // friends with short names are too busy
          let attending = _name.size() > 3
          party.rsvp(_name, attending)
    sources: [ponylang-io]

