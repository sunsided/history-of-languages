# Concept registry. Every tag, edge aspect and milestone 'introduces' value refers to an id here.
# first_seen marks the earliest node IN THIS DATASET credited with the concept; refine as subgraphs are unfolded.
# Summaries are drafts; concepts without one still need writing.
- id: actors
  name: Actors
  facet: concurrency
  broader:
  - message-passing
  summary: Isolated entities that communicate only by asynchronous messages.
- id: async-await
  name: Async await
  facet: concurrency
  broader:
  - coroutines
  - futures-promises
  summary: Syntax that lets asynchronous code read sequentially by suspending at await points; compiled to state machines
    or continuations.
  first_seen:
    node: fsharp
    year: 2007
    note: F# async workflows; C# 5 (2012) gave the async/await keywords.
