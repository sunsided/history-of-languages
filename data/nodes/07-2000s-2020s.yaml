  summary: >
    "A high-level, block-based visual programming language and website aimed primarily at children": programs
    are stacks of jigsaw-shaped blocks attached to sprites and triggered by events, from the MIT Media Lab's
    Lifelong Kindergarten group. The 1.x versions "were based on Squeak, which itself is based on Smalltalk-80",
    and Wikipedia lists Logo, Smalltalk, HyperCard, StarLogo, AgentSheets and Etoys among its influences. In
    Scratch 3.0, "Scratch blocks are implemented using a fork of Blockly".
  notes: >
    Edges to Etoys, StarLogo, HyperCard and AgentSheets wait for those nodes (education/ backlog). The Scratch
    Team left the Media Lab on 11 March 2019 for the Scratch Foundation.
