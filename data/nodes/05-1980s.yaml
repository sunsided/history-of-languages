  example:
    title: "Three things ISO C cannot do"
    language: "GNU C"
    note: "The three fragments are from the GCC manual: a statement expression (a block whose last expression is its value), a nested function, and labels as values for a computed goto (common in interpreter dispatch loops)."
    code: |
      /* statement expression: the block's value is z */
      ({ int y = foo (); int z;
         if (y > 0) z = y;
         else z = - y;
         z; })

      /* nested function */
      foo (double a, double b)
      {
        double square (double z) { return z * z; }

        return square (a) + square (b);
      }

      /* labels as values */
      static void *array[] = { &&foo, &&bar, &&hack };
      goto *array[i];
    sources: [gcc-manual-c-extensions]
