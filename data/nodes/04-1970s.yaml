    features: [modules, exceptions]
  summary: "Strongly typed modular systems language for the Alto/Star workstations. Its monitors and condition variables (Lampson & Redell, 1980) are the model for Java's synchronized/wait/notify. Wirth used it during a sabbatical and built Modula-2 on it."
  relations:
    - { type: influenced_by, to: pascal, weight: strong, confidence: medium }
    - { type: influenced_by, to: algol-68, weight: moderate, confidence: low }
  research_status: draft
  confidence: medium
  sources: [lampson-redell-1980-mesa, wirth-2007-modula2-oberon]
  example:
    title: Monitor with a condition variable
    language: Mesa
    note: 'Approximate. ENTRY procedures hold the monitor lock. WAIT re-checks its condition in a loop because NOTIFY is only a hint: these ''Mesa semantics'' are what Java and POSIX condition variables use today.'
    code: |
      Buffer: MONITOR =
      BEGIN
        nonEmpty: CONDITION;
        count: CARDINAL ← 0;

        Put: PUBLIC ENTRY PROC [c: CHARACTER] =
          BEGIN store[c]; count ← count + 1; NOTIFY nonEmpty END;

        Get: PUBLIC ENTRY PROC RETURNS [c: CHARACTER] =
          BEGIN
            WHILE count = 0 DO WAIT nonEmpty ENDLOOP;
            count ← count - 1; RETURN[fetch[]]
          END;
      END.
    sources: [lampson-redell-1980-mesa]

