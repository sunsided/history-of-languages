  research_status: stub
  confidence: high
  sources: [wiki-ibm-704, mccarthy-1978-history-lisp]
  example:
    title: Single-address accumulator machine
    language: IBM 704 machine instructions
    note: One address per instruction, an accumulator, and index registers. The 704's 36-bit word split into an address part and a decrement part; Lisp's CAR and CDR are 'Contents of the Address/Decrement part of Register'.
    code: |
      CLA  A     ; clear and add: AC = A
      ADD  B     ; AC = AC + B
      STO  C     ; C = AC
      HTR  0     ; halt
    sources: [wiki-ibm-704, mccarthy-1978-history-lisp]

