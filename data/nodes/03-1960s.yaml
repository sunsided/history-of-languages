  status: active
  tags:
    paradigm: [declarative]
  summary: >
    The language for scripting and launching batch jobs on IBM mainframes, created in the OS/360 project. A job is a
    deck of // statements naming programs to EXEC and DD statements binding their files. Its syntax "is similar to the
    syntax of macros in System/360 assembly language". There are two lines: DOS/360 to z/VSE, and OS/360 to z/OS.
    Fred Brooks, who supervised OS/360, called it "the worst computer programming language ever devised by anybody,
    anywhere".
  notes: >
    The DOS/360 JCL is a separate language; the year it appeared is not stated in Wikipedia. Spacing between fields in
    the example may have been collapsed by the page fetch; continuation lines must start between columns 4 and 16.
  relations:
