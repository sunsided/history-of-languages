    language: SAS
    note: "From Wikipedia's SAS language article. The DATA step builds data set TEMP from inline datalines; PROC PRINT lists it. Statements end with semicolons; * starts a comment statement."
    code: |
      * COMMENT;
      Data TEMP;
      input X Y Z;
      datalines;
      1 2 3
      5 6 7
      ;
      run;
      PROC PRINT DATA = TEMP;
      RUN;
    sources: [wiki-sas-language]

