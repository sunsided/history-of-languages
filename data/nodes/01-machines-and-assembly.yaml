  creators:
    - { name: Werner Kämpf, role: "developer; described the machine in rfe 10/1984" }
  status: historical
  summary: >
    A single-board learning computer with a U880 at 900 kHz, 1 KB RAM, 2 KB ROM monitor, a six-digit
    seven-segment display and a 25-key calculator keypad, sold for 720 Mark. Programs were typed in as
    hexadecimal machine code and saved to cassette. Called the first computer freely available to buy in
    the GDR; the manufacturer published its software as hex listings in booklets, and readers published
    more in rfe and Funkamateur.
  notes: >
    German Wikipedia says its monitor is essentially the Multitech Microprofessor I's, apart from entry
    addresses. An export version (wooden case, 12 KB ROM, 4 KB RAM, SC-80 chess program) was made only as
    samples. Production ended around 1986/87. Number built and the full developer collective are not
    stated in the sources read; the key labels and entry sequence need the manual (Zielosko).
