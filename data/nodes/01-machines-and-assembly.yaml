  example:
    title: Hello, world on Linux x86-64
    language: NASM
    note: 'Calls the kernel directly: syscall 1 is write, 60 is exit. Assemble with nasm -felf64 hello.asm && ld hello.o. Tested.'
    code: |2
              global  _start
              section .text
      _start: mov     eax, 1          ; write(
              mov     edi, 1          ;   stdout,
              lea     rsi, [rel msg]  ;   msg,
              mov     edx, len        ;   len)
              syscall
              mov     eax, 60         ; exit(0)
              xor     edi, edi
              syscall
              section .data
      msg:    db      "Hello, world", 10
      len     equ     $ - msg
    sources: [wiki-nasm]

- id: asm-6502
  name: 6502 assembly
