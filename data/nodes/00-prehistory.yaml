- id: difference-engine
  name: Difference Engine
  kind: mechanism
  category: scientific
  cluster: prehistory/babbage
  origin:
    began: { year: 1819, precision: circa, note: "\"began to construct a small difference engine in c. 1819\"." }
    first_appeared: { year: 1822, date: "1822-06-14", precision: exact, note: "Difference Engine 0 completed by 1822; \"He announced his invention on 14 June 1822.\" The 1830 design for No. 1 was never finished; a one-seventh working model followed in 1832." }
  creators:
    - { name: Charles Babbage, role: inventor }
  status: historical
  summary: >
    "an automatic mechanical calculator designed to tabulate polynomial functions." It holds numbers in
    columns, and "The engine is programmed by setting initial values to the columns." The 1830 design for
    No. 1 "would have about 25,000 parts, weigh 4 tons, and operate on 20-digit numbers by sixth-order
    differences"; with government money from 1823, Babbage and Joseph Clement built "a small working model
    (one-seventh of the plan)" in 1832. "By improving the concept as an analytical engine, Babbage had made
    the difference engine concept obsolete."
  notes: >
    The incomplete No. 1 was shown at the 1862 International Exhibition in South Kensington. Scheutz's
    engine was "Inspired by Babbage's difference engine in 1834".
  research_status: stub
  confidence: medium
  links: { wikipedia: "https://en.wikipedia.org/wiki/Difference_engine" }
  sources: [wiki-difference-engine]

