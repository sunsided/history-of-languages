  sources: [wiki-kotlin]
  example:
    title: Suspend functions and structured concurrency
    language: Kotlin (kotlinx.coroutines)
    note: 'suspend functions are async without an await keyword: calling one is a suspension point. coroutineScope does not return until both async children finish, which is structured concurrency.'
    code: |
      import kotlinx.coroutines.*

      suspend fun fetch(name: String, ms: Long): String {
          delay(ms)
          return "$name done"
      }

      fun main() = runBlocking {
          val results = coroutineScope {
              val a = async { fetch("a", 200) }
              val b = async { fetch("b", 100) }
              listOf(a.await(), b.await())
          }
          println(results)   // [a done, b done]
      }
    sources: [wiki-kotlin]

