  research_status: draft
  confidence: high
  sources: [griswold-1978-snobol]
  example:
    title: Words from input, with success/failure gotos
    language: SNOBOL4
    note: A statement has a subject, a pattern and an optional replacement. Each statement succeeds or fails, and the :S()/:F() labels branch on it. BREAK(' ') . WORD matches up to the first space and assigns the match to WORD.
    code: |
      LOOP   LINE = INPUT                       :F(END)
             LINE BREAK(' ') . WORD             :F(LOOP)
             OUTPUT = WORD                      :(LOOP)
      END
