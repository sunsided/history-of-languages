# ---------- Assembly languages ----------
- id: booth-contracted-notation
  name: Booth's contracted notation
  kind: assembly
  category: research
  cluster: assembly/early
  origin:
    first_appeared: { year: 1947, precision: year, note: "'Coding for A.R.C.', written with Andrew Booth during a visit to the IAS, Princeton." }
    places: [{ institution: Birkbeck College, city: London, country: GB }]
  creators: [{ name: Kathleen Booth, role: designer }]
  status: extinct
  summary: "Symbolic notation for the ARC2 computer's instructions, often credited as the first assembly language. Translation to machine code was still done by hand."
  research_status: draft
  confidence: medium
  sources: [booth-1947-coding-arc, wiki-assembly-language]
  example:
    title: Symbols instead of bits (illustrative)
    language: pseudocode in the spirit of contracted notation
    note: 'Illustrative only: Booth''s actual ARC2 symbols are not reproduced here. The idea is what matters: write each instruction as a short symbolic form with a memory address, then translate to binary by hand. Replace with a facsimile from ''Coding for A.R.C.'' when the source is checked.'
    code: |
      symbolic         meaning                      binary (hand-translated)
      cc → A   120     clear acc, add [120]         …
      A + 121          add [121]                    …
      A → 122          store acc in [122]           …
    sources: [booth-1947-coding-arc]

- id: edsac-initial-orders
  name: EDSAC Initial Orders
  kind: assembly
  category: systems
  cluster: assembly/early
  origin:
    first_appeared: { year: 1949, precision: year }
    places: [{ institution: University of Cambridge Mathematical Laboratory, city: Cambridge, country: GB }]
  creators: [{ name: David Wheeler, role: designer }]
  status: extinct
  summary: "Bootstrap program wired into EDSAC that read mnemonic, single-letter instructions with decimal addresses from paper tape and assembled them into memory. The first assembler in practical use; Initial Orders 2 (1949) added relocation for subroutines."
  relations:
    - { type: targets, to: edsac, weight: strong, confidence: high }
  research_status: draft
  confidence: high
  sources: [wilkes-wheeler-gill-1951, wiki-edsac]
  example:
    title: Add two numbers
    language: EDSAC orders read by Initial Orders 2
    year: 1949
    note: 'Initial Orders 2 read these letters and decimal addresses from tape and assembled them into memory as it loaded them: a 1949 assembler in 41 words. T 56 K sets the load address; T n F stores and clears the accumulator; Z F stops.'
    code: |
      T 56 K      load the following orders from location 56
      A 70 F      acc += [70]
      A 71 F      acc += [71]
      T 72 F      [72] := acc; acc := 0
      Z F         stop
    sources: [wilkes-wheeler-gill-1951]

