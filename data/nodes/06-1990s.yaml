  research_status: draft
  confidence: high
  sources: [ierusalimschy-2007-evolution-lua]
  example:
    title: Tables and coroutines
    language: Lua 5.4
    note: 'One data structure, the table, serves as array, map and object. coroutine.wrap gives a stackful coroutine: yield can happen anywhere down the call stack, unlike async/await''s stackless coroutines.'
    code: |
      local function range(n)
        return coroutine.wrap(function()
          for i = 1, n do coroutine.yield(i) end
        end)
      end

      local squares = {}
      for i in range(5) do squares[#squares + 1] = i * i end
      print(table.concat(squares, ", "))   -- 1, 4, 9, 16, 25
    sources: [ierusalimschy-2007-evolution-lua]

