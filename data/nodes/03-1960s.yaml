# The 1960s: ALGOL 60 and its children, Simula, APL, BASIC, PL/I, the BCPL line.

- id: algol-60
  name: ALGOL 60
  kind: language
  category: scientific
  cluster: algol
  origin:
    first_appeared: { year: 1960, precision: year, note: "Report on the Algorithmic Language ALGOL 60, Paris meeting January 1960; Revised Report 1963." }
    places: [{ city: Paris, country: FR }]
  creators:
    - { name: Peter Naur, role: editor }
    - { name: John Backus, role: committee member }
    - { name: Friedrich L. Bauer, role: committee member }
    - { name: Julien Green, role: committee member }
    - { name: Charles Katz, role: committee member }
    - { name: John McCarthy, role: committee member }
    - { name: Alan Perlis, role: committee member }
    - { name: Heinz Rutishauser, role: committee member }
    - { name: Klaus Samelson, role: committee member }
    - { name: Bernard Vauquois, role: committee member }
    - { name: Joseph Wegstein, role: committee member }
    - { name: Adriaan van Wijngaarden, role: committee member }
    - { name: Michael Woodger, role: committee member }
  status: extinct
  tags:
    paradigm: [imperative, procedural, structured]
    typing: [static-typing]
    memory: [stack-allocation]
    features: [block-structure, lexical-scoping, recursion, call-by-name, bnf, nested-functions]
  milestones:
    - { version: Revised Report, year: 1963 }
  summary: >
    The most influential language few people ever used for production. Defined by BNF grammar
    (Backus-Naur Form), it brought block structure, lexical scope, recursion and the stack-based
    runtime. Almost every imperative language since is "ALGOL-like"; it was also the lingua
    franca for publishing algorithms for decades.
  relations:
    - { type: successor_of, to: algol-58, weight: strong, confidence: high }
    - { type: influenced_by, to: lisp, aspects: [conditional-expressions, recursion], weight: moderate, confidence: medium, note: "McCarthy was on the committee and pushed conditional expressions and recursion." }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/ALGOL_60" }
  sources: [naur-1963-revised-report, naur-1978-european-algol, perlis-1978-american-algol]
  example:
    title: "Jensen's device: call by name"
    language: "ALGOL 60"
    note: "i and term are passed by name, so term (here 1/k) is re-evaluated on every pass of the loop with the current k. The Report sets keywords in bold; I/O was left to implementations."
    code: |
      real procedure sum(i, lo, hi, term);
        value lo, hi; integer i, lo, hi; real term;
      begin real s;
        s := 0;
        for i := lo step 1 until hi do s := s + term;
        sum := s
      end;

      comment harmonic number H(100);
      x := sum(k, 1, 100, 1/k)

- id: snobol
  name: SNOBOL
  kind: language
