- id: post-canonical-system
  name: Post canonical system
  aliases: [Post production system]
  kind: formalism
  category: research
  cluster: prehistory/formalisms
  origin:
    first_appeared: { year: 1943, precision: circa, note: "The page dates only the normal-form theorem (\"Post 1943\"); when Post introduced the system is not stated. The old backlog's 1936 is unsourced." }
  creators:
    - { name: Emil Post, role: creator }
  summary: >
    "a string-manipulation system that starts with finitely many strings and repeatedly transforms them by
    applying a finite set of specified rules", thus generating a formal language. It is Turing complete;
    "Today they are mainly of historical relevance because every Post canonical system can be reduced to a
    string rewriting system". Tag systems are Post normal-form systems, and the reduction leads to the
    type-0 grammars of the Chomsky hierarchy.
  research_status: stub
  confidence: low
  links: { wikipedia: "https://en.wikipedia.org/wiki/Post_canonical_system" }
  sources: [wiki-post-canonical-system]
  example:
    title: "Well-formed bracket expressions"
    language: "Post canonical system"
    note: "From Wikipedia's Post canonical system article: alphabet {[, ]}, initial word [], and three productions."
    code: |
      $ → [$]
      $ → $$
      $1$2 → $1[]$2

- id: markov-algorithm
