    title: A function and a lemma about it
    language: Rocq
    note: "From Wikipedia's Rocq article. Fixpoint defines a recursive function; the lemma is proved by computation (reflexivity). Indentation was lost in fetching and is ours; it is not significant."
    code: |
      Fixpoint is_even (n : nat) : bool :=
        match n with
        | 0 => true
        | S n' => negb (is_even n')
        end.

      Lemma is_even_S n :
        is_even (S n) = negb (is_even n).
      Proof. reflexivity. Qed.
