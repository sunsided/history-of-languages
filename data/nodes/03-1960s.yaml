  sources: [wiki-jcl]
  example:
    title: Copy a data set with IEBGENER
    language: OS/360 JCL (old-style syntax)
    note: "From Wikipedia's Job Control Language article. The job runs the IEBGENER utility, reading OLDFILE and writing a new catalogued NEWFILE with the given space and record format."
    sources: [wiki-jcl]
    code: |
      //IS198CPY JOB (IS198T30500),'COPY JOB',CLASS=L,MSGCLASS=X
      //COPY01 EXEC PGM=IEBGENER
      //SYSPRINT DD SYSOUT=*
      //SYSUT1 DD DSN=OLDFILE,DISP=SHR
      //SYSUT2 DD DSN=NEWFILE,
      // DISP=(NEW,CATLG,DELETE),
      // SPACE=(CYL,(40,5),RLSE),
      // DCB=(LRECL=115,BLKSIZE=1150)
      //SYSIN DD DUMMY

