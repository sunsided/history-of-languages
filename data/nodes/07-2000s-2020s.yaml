  example:
    title: A custom block, in scratchblocks text notation
    language: Scratch (scratchblocks)
    note: "Verbatim from the Scratch Wiki's Block Plugin page. Scratch itself is edited as graphical blocks; scratchblocks is the community's text notation for them, with [ ] for text inputs, ( ) for number reporters, < > for booleans and v for dropdowns."
    code: |
      define dance (speed)
      set [dist v] to ((speed) * (distance to (mouse-pointer v)))
      repeat until <(timer) > [10]>
      move (dist) steps
      next costume
      play note (pick random (40) to (100)) for (0.5) beats
      say [Wow! Scratch scripts on the Wiki!]
      end
    sources: [scratch-wiki-block-plugin]
