- id: pl-b
  name: PL/B
  aliases: [DATABUS, Programming Language for Business]
  kind: language
  category: business
  cluster: business
  origin:
    first_appeared: { year: 1972, precision: year, note: "\"originally called DATABUS and designed by Datapoint in 1972\"." }
    places: [{ institution: Datapoint, country: US }]
  creators:
    - { name: Datapoint, role: developer }
  status: maintained
  tags:
    paradigm: [procedural, imperative]
    typing: [static-typing, strong-typing]
    features: [bytecode-vm, standardization]
    domain: [business-data-processing]
  summary: >
    A business language "designed by Datapoint in 1972 as an alternative to COBOL because Datapoint's 8-bit computers
    could not fit COBOL into their limited memory", and because COBOL lacked facilities for their built-in keyboard and
    screen. Programs compile to "an intermediate byte-code, which is then interpreted by a runtime library". A version
    became an ANSI standard, renamed PL/B when Datapoint kept the DATABUS trademark.
  relations:
    - { type: influenced_by, to: cobol, weight: moderate, confidence: medium, sources: [wiki-pl-b], note: "Infobox \"Influenced by: COBOL\"; designed \"as an alternative to COBOL\"." }
  research_status: stub
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Programming_Language_for_Business" }
  sources: [wiki-pl-b]
  example:
    title: Screen handling
    language: PL/B
    note: "First block of Wikipedia's source code example."
    code: |
      IF (DF_EDIT[ITEM] = "PHYS")
         STATESAVE MYSTATE
         IF (C_F07B != 2)
            DISPLAY   *SETSWALL 1:1:1:80:
                      *BGCOLOR=2,*COLOR=15:
                      *P49:1," 7-Find "
         ELSE
            DISPLAY   *SETSWALL 1:1:1:80:
                      *BGCOLOR=7,*COLOR=0:
                      *P49:1," 7-Find "
         ENDIF
         STATEREST MYSTATE
         TRAP      GET_PRO NORESET IF F7
      ENDIF
    sources: [wiki-pl-b]

