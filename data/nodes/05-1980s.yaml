- id: rexx
  name: REXX
  aliases: [Rexx, Object REXX, ooRexx]
  kind: language
  category: scripting
  cluster: scripting
  origin:
    began: { year: 1979, date: "1979-03-20", precision: exact, note: "Mike Cowlishaw wrote the language and an interpreter in his own time from 20 March 1979 to mid-1982." }
    first_appeared: { year: 1981, precision: year, note: "First described in public at SHARE 56 in Houston (1981); shipped as an IBM product in 1982. Wikipedia's infobox gives 1979." }
    places: [{ institution: IBM, city: Hursley, country: GB }]
  creators:
    - { name: Mike Cowlishaw, role: designer and implementer }
  status: maintained
  tags:
    paradigm: [imperative, procedural, scripting]
    typing: [typeless]
    features: [decimal-arithmetic, string-processing, interpreter]
  milestones:
    - { version: "ANSI X3.274-1996", year: 1996, introduces: [standardization] }
    - { version: "Open Object Rexx", year: 2005, introduces: [objects], summary: "IBM's object-oriented, upwards-compatible Object REXX released as open source (ooRexx, 22 February 2005)." }
  summary: >
    IBM's scripting language for VM/CMS, written to replace EXEC and EXEC 2 and meant as a simpler PL/I:
    everything is a string, numbers are decimal with arbitrary precision, and any expression that is not an
    instruction is passed to the host environment as a command. It spread to OS/2, the Amiga (ARexx) and
    other systems and is seen as a precursor of Tcl and Python as general-purpose scripting languages.
  relations:
    - { type: influenced_by, to: exec-2, weight: strong, confidence: high, sources: [wiki-rexx, wiki-exec-2], note: "Rexx infobox \"Influenced by: PL/I, ALGOL, EXEC, EXEC 2\"; EXEC 2 was \"superseded by REXX\"." }
    - { type: influenced_by, to: pl-i, weight: strong, confidence: high, sources: [wiki-rexx], note: "\"Mike also intended Rexx to be a simplified and easier to learn version of PL/I\"." }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Rexx" }
  sources: [wiki-rexx]
  example:
    title: Instructions and host commands
    language: REXX
    note: "From the Wikipedia Rexx article. The quoted lines are not REXX instructions, so they go to the operating system as commands; rc holds the return code. Run with Regina REXX."
    code: |
      a = "hello world"             /* assignment instruction */
      do i = 1 to 2                 /* keyword instruction "DO" */
        say "round #" i":" a        /* keyword instruction "SAY" */
      end                           /* keyword instruction "END" */
      "echo Hello World"            /* command to operating system */
      "echo" a                      /* command to operating system */
      say "RC:" rc                  /* command's numeric return code */
    sources: [wiki-rexx]

