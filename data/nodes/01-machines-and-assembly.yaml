    - { name: Hal Feeney, role: implementer }
  status: extinct
  summary: >
    "an early 8-bit microprocessor capable of addressing 16 KB of memory". Its architecture "was designed by
    Computer Terminal Corporation (CTC)" for the Datapoint 2200 terminal and implemented by Intel, which
