- id: cilk
  name: Cilk
  aliases: [Cilk++, Cilk Plus, OpenCilk]
  kind: language
  category: systems
  cluster: concurrency
  origin:
    first_appeared: { year: 1994, date: "1994-04", precision: exact, note: "\"In April 1994 the three projects were combined and christened Cilk\"; the Cilk-1 compiler followed in September 1994." }
    places: [{ institution: MIT Laboratory for Computer Science, country: US }]
  creators:
    - { name: Charles E. Leiserson, role: group leader }
  status: maintained
  tags:
    paradigm: [imperative, procedural, structured, concurrent]
    typing: [static-typing]
  milestones:
    - { version: Cilk++ 1.0, year: 2008, summary: "Cilk Arts' C++ version, December 2008." }
    - { version: Cilk Plus 1.2, year: 2013, summary: "Intel's version." }
    - { version: OpenCilk, year: 2021, summary: "First stable version, March 2021." }
  summary: >
    A fork-join extension of C from Charles E. Leiserson's group at MIT: spawn starts a call in parallel and sync waits
    for the spawned calls. The Cilk languages "are based on the C and C++ programming languages, which they extend with
    constructs to express parallel loops and the fork–join idiom". Intel later developed Cilk Plus; Wikipedia lists
    OpenMP 3.0 and Rust's Rayon among what it influenced.
  relations:
    - { type: superset_of, to: c, weight: strong, confidence: high, sources: [wiki-cilk], note: "\"The original Cilk language was based on ANSI C\"." }
  research_status: stub
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Cilk", homepage: "https://www.opencilk.org/" }
  sources: [wiki-cilk]
  example:
    title: Parallel Fibonacci
    language: Cilk-5
    note: "From Wikipedia's Cilk article; the fetched copy had lost its indentation, which is restored here. The two recursive calls run in parallel and sync waits for both."
    sources: [wiki-cilk]
    code: |
      cilk int fib(int n) {
          if (n < 2) {
              return n;
          }
          else {
              int x, y;
              x = spawn fib(n - 1);
              y = spawn fib(n - 2);
              sync;
              return x + y;
          }
      }

