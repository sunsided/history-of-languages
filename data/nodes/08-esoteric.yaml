- id: fractran
  name: FRACTRAN
  kind: language
  category: esoteric
  cluster: esoteric/minimal
  origin:
    first_appeared: { year: 1987, precision: disputed, note: "Conway's article in Open Problems in Communication and Computation (Springer), dated 1987 by Wikipedia and the Springer DOI, 1986 by the Esolang wiki and the reprint's reference list." }
    places: [{ institution: Princeton University, city: Princeton, country: US }]
  creators: [{ name: John Horton Conway, role: designer }]
  status: historical
  summary: >
    John Conway's universal language for arithmetic: a program is a list of fractions, the whole state is one
    integer, and each step multiplies it by the first fraction that gives an integer. "The power of this formalism
    comes from viewing numbers as products of prime powers": the exponents are registers, so FRACTRAN "can
    trivially simulate" Minsky's register machines. A mathematical point, not a joke.
  research_status: draft
  confidence: high
  sources: [conway-1987-fractran, esolangs-fractran, wiki-fractran]
  example:
    title: PRIMEGAME
    language: FRACTRAN
    note: "Conway's prime generator, as printed on the Esolang wiki. Started on 2, the powers of 2 it passes through are 2^2, 2^3, 2^5, 2^7, ... (checked with a short Python simulation: exponents 2, 3, 5, 7, 11, 13)."
    code: |
      17/91, 78/85, 19/51, 23/38, 29/33, 77/29, 95/23, 77/19, 1/17, 11/13, 13/11, 15/14, 15/2, 55/1
    sources: [esolangs-fractran]

