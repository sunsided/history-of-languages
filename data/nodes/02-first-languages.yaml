  summary: "First transatlantic committee language. Introduced compound statements (begin...end). Its dialects JOVIAL, MAD and NELIAC were used for years."
  relations:
    - { type: influenced_by, to: superplan, weight: moderate, confidence: medium, sources: [wiki-superplan], note: "Superplan infobox \"Influenced: ALGOL 58\"; Rutishauser was on the ALGOL 58 committee is not stated there." }
    - { type: influenced_by, to: fortran, weight: strong, confidence: high }
    - { type: influenced_by, to: plankalkul, weight: weak, confidence: low, note: "Indirect, via Rutishauser and Bauer's awareness of Zuse." }
