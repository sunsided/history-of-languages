    - { version: MIL-STD-1589, year: 1973, introduces: [standardization], summary: "\"JOVIAL was standardized during 1973 with MIL-STD-1589\"." }
    - { version: MIL-STD-1589C, year: 1984, summary: "Revised standard." }
  summary: >
    The US Air Force's embedded and command-and-control language, created at SDC for the SACCS project and
    "based on ALGOL 58": its name is a joke on Jules Schwartz's own version of the International Algebraic
    Language. Used for avionics and other mission-critical systems for decades; dialects J3, J3B-2 and J73.
  relations:
