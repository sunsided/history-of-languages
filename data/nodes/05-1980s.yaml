  research_status: draft
  confidence: high
  sources: [wiki-occam]
  example:
    title: PAR, channels, indentation
    language: occam 2
    note: SEQ and PAR say whether the indented processes run in sequence or in parallel; ! sends and ? receives on a channel, synchronously, as in CSP. Indentation is the syntax.
    code: |
      CHAN OF INT c:
      PAR
        SEQ i = 0 FOR 10
          c ! i * i
        INT x:
        SEQ i = 0 FOR 10
          SEQ
            c ? x
            out ! x
    sources: [wiki-occam]

- id: common-lisp
  name: Common Lisp
  kind: language
  category: general
  cluster: lisp
  origin:
    first_appeared: { year: 1984, precision: year, note: "'Common Lisp the Language' (Steele) 1984; ANSI standard 1994." }
    places: [{ country: US }]
  creators: [{ name: "Guy L. Steele Jr. (editor) and the Common Lisp committee", role: designers }]
  status: maintained
  tags:
    paradigm: [multi-paradigm, functional, object-oriented, reflective]
    typing: [dynamic-typing]
    memory: [garbage-collection]
    features: [macros, multiple-dispatch, metaobject-protocol, conditions-restarts]
  milestones:
    - { version: CLOS, year: 1988, introduces: [multiple-dispatch, metaobject-protocol], summary: "Common Lisp Object System: generic functions, multiple dispatch, method combinations; from Flavors and LOOPS." }
    - { version: ANSI Common Lisp, year: 1994, introduces: [standardization] }
  summary: "Unification of MacLisp-descended dialects (Lisp Machine Lisp, NIL, Spice Lisp, S-1 Lisp). CLOS showed OOP built from generic functions rather than message sends, the ancestor of Julia's multiple dispatch."
  relations:
    - { type: dialect_of, to: lisp, weight: strong, confidence: high }
    - { type: influenced_by, to: scheme, aspects: [lexical-scoping], weight: moderate, confidence: high }
    - { type: influenced_by, to: smalltalk, weight: weak, confidence: medium, note: "Via Flavors/LOOPS object systems." }
  research_status: draft
  confidence: high
  sources: [steele-gabriel-1993-evolution-lisp]
  example:
    title: Generic functions and multiple dispatch (CLOS)
    language: Common Lisp (CLOS)
    note: Methods belong to generic functions, not to classes, and dispatch on the classes of all arguments, so collide can specialize on both the asteroid and the ship. Julia's multiple dispatch descends from this.
    code: |
      (defclass asteroid () ())
      (defclass ship () ())

      (defgeneric collide (a b))
      (defmethod collide ((a asteroid) (b ship))     "ship destroyed")
      (defmethod collide ((a ship)     (b asteroid)) (collide b a))
      (defmethod collide ((a asteroid) (b asteroid)) "asteroids bounce")

      (collide (make-instance 'ship) (make-instance 'asteroid))
      ;; => "ship destroyed"
    sources: [steele-gabriel-1993-evolution-lisp]

