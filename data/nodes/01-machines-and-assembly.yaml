  research_status: stub
  confidence: medium
  sources: [wiki-68000]
  example:
    title: String length
    language: 68k assembly
    note: TST.B (A0)+ tests a byte and post-increments the address register, the PDP-11 idiom again. MOVEQ clears D0 in one short instruction.
    code: |
      strlen: lea     msg,a0
              moveq   #0,d0
      loop:   tst.b   (a0)+
              beq.s   done
              addq.l  #1,d0
              bra.s   loop
      done:   rts
      msg:    dc.b    'HELLO',0
    sources: [wiki-68000]

- id: asm-arm
  name: ARM assembly
  kind: assembly
  category: systems
  cluster: assembly/risc
