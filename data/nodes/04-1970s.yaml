- id: csp
  name: CSP (Communicating Sequential Processes)
  kind: formalism
  category: research
  cluster: concurrency
  origin:
    first_appeared: { year: 1978, precision: year, note: "Hoare, CACM 1978; process-algebra version in the 1985 book." }
    places: [{ institution: Queen's University Belfast / Oxford, country: GB }]
  creators: [{ name: C. A. R. Hoare, role: designer }]
  status: active
  tags:
    concurrency: [channels, message-passing, synchronous-rendezvous]
  summary: "Processes that share nothing and synchronize by communicating over named channels, with guarded alternatives. Ancestor of occam, Newsqueak, Limbo, Go's goroutines and channels, and Clojure core.async."
  relations:
    - { type: influenced_by, to: dijkstra-guarded-commands, weight: strong, confidence: high }
  research_status: draft
  confidence: high
  sources: [hoare-1978-csp]
  example:
    title: Processes and channels
    language: CSP (Hoare, 1978)
    year: 1978
    note: 'From Hoare''s paper: COPY repeatedly (*) inputs a character from process west (west?c) and outputs it to east (east!c). Both sides must be ready for the communication to happen. The parallel command || runs processes side by side.'
    code: |
      COPY :: *[c: character; west?c → east!c]

      [ west :: DISASSEMBLE || X :: COPY || east :: ASSEMBLE ]
    sources: [hoare-1978-csp]

- id: dijkstra-guarded-commands
  name: Guarded Command Language
  kind: notation
  category: research
  cluster: concurrency
  origin:
    first_appeared: { year: 1975, precision: year }
    places: [{ institution: Burroughs / Eindhoven University of Technology, country: NL }]
  creators: [{ name: Edsger W. Dijkstra, role: designer }]
  status: historical
  tags:
    features: [nondeterminism, guarded-commands]
  summary: "Dijkstra's notation of guarded commands with nondeterministic choice, for deriving programs with their proofs. Used by CSP's alternative command and Go's select."
  research_status: draft
  confidence: high
  sources: [dijkstra-1975-guarded]
  example:
    title: Euclid's algorithm with guards
    language: Guarded Command Language
    note: do ... od repeats while any guard is true; if several are true, any of them may be chosen. Go's select statement descends from this nondeterministic choice via CSP.
    code: |
      do x > y → x := x − y
       ▯ y > x → y := y − x
      od
      { x = y = gcd(X, Y) }
    sources: [dijkstra-1975-guarded]

- id: modula-2
  name: Modula-2
  kind: language
  category: systems
  cluster: algol/wirth
  origin:
    first_appeared: { year: 1978, precision: year, note: "Defined 1978, implemented 1979 for the Lilith workstation." }
    places: [{ institution: ETH Zürich, city: Zürich, country: CH }]
  creators: [{ name: Niklaus Wirth, role: designer }]
  status: legacy
  tags:
    paradigm: [imperative, structured, modular]
    typing: [static-typing, strong-typing]
    concurrency: [coroutines]
    features: [modules, separate-compilation]
  summary: "Pascal plus modules with explicit import/export and separate compilation, and coroutines for concurrency. Influenced Modula-3, Oberon, Ada and Python's module system indirectly."
  relations:
    - { type: successor_of, to: pascal, weight: strong, confidence: high }
    - { type: influenced_by, to: mesa, aspects: [modules], weight: strong, confidence: high }
  research_status: draft
  confidence: high
  sources: [wirth-2007-modula2-oberon]
  example:
    title: Modules with explicit imports
    language: Modula-2
    note: A definition module declares the interface; the implementation module and its clients import exactly what they use. Separate compilation is type-checked across modules.
    code: |
      DEFINITION MODULE Stack;
        PROCEDURE Push(x: INTEGER);
        PROCEDURE Pop(): INTEGER;
      END Stack.

      MODULE Main;
        FROM Stack IMPORT Push, Pop;
        FROM InOut IMPORT WriteInt, WriteLn;
      BEGIN
        Push(42); WriteInt(Pop(), 0); WriteLn
      END Main.
    sources: [wirth-2007-modula2-oberon]

- id: bourne-shell
  name: Bourne shell
  aliases: [sh]
  kind: language
  category: shell
  cluster: scripting/unix
  origin:
    first_appeared: { year: 1979, precision: year, note: "Released with Version 7 Unix." }
    places: [{ institution: Bell Labs, city: Murray Hill NJ, country: US }]
  creators: [{ name: Stephen R. Bourne, role: designer }]
  status: active
  tags:
    paradigm: [imperative, scripting]
    typing: [typeless]
    features: [pipes, command-substitution]
  summary: "Unix's scripting shell with control structures. Bourne used ALGOL 68C keywords (if/fi, case/esac) and even C macros to make the C source look like ALGOL. Ancestor of ksh, bash and POSIX sh."
  relations:
    - { type: influenced_by, to: algol-68, weight: moderate, confidence: high }
  research_status: draft
  confidence: high
  sources: [wiki-bourne-shell]
  example:
    title: Loops, tests and case/esac
    language: Bourne shell (POSIX sh)
    note: Keywords closed by their reversal (case/esac, if/fi) come from ALGOL 68. Pipes and command substitution make other programs the shell's functions. Tested with POSIX sh.
    code: |
      for f in *.c; do
        case "$f" in
          test_*) kind=test ;;
          *)      kind=source ;;
        esac
        if [ -s "$f" ]; then
          echo "$kind: $f ($(wc -l < "$f") lines)"
        fi
      done
    sources: [wiki-bourne-shell]

- id: ada
  name: Ada
  kind: language
  category: systems
  cluster: algol/ada
  origin:
    began: { year: 1977, precision: year, note: "DoD competition; the 'Green' language of CII Honeywell Bull won in 1979." }
    first_appeared: { year: 1980, precision: year, note: "MIL-STD-1815 (December 1980, named for Lovelace's birth year); ANSI standard 1983." }
    places: [{ institution: CII Honeywell Bull, city: Paris, country: FR }]
  creators:
