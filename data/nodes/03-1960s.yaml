    which made it the host of the Macsyma computer algebra system. Lisp Machine Lisp, Franz Lisp, Emacs
    Lisp and, through them, Common Lisp descend from it.
  notes: >
    Wikipedia's article for the first creator is titled "Richard Greenblatt (programmer)". Its Ncomplr compiler
    (mid-1970s) "introduced fast numeric support to Lisp languages".
  relations:
    - { type: dialect_of, to: lisp, from_version: "LISP 1.5", weight: strong, confidence: high, sources: [wiki-maclisp], note: "\"Maclisp is a descendant of Lisp 1.5.\"" }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Maclisp" }
  sources: [wiki-maclisp, steele-gabriel-1993-evolution-lisp]
  example:
    title: Recursion in upper case
    language: MacLisp
    note: "Illustrative, written for this dataset in MacLisp style (DEFUN rather than LISP 1.5's DEFINE, as Wikipedia notes; 'X for (QUOTE X)). Not run on a MacLisp system; check against the MacLisp manual (Pitman)."
    code: |
      (DEFUN FACT (N)
             (COND ((ZEROP N) 1)
                   (T (TIMES N (FACT (SUB1 N))))))

      (FACT 10.)          ; the trailing point marks a decimal number
      (SETQ L '(A B C))   ; 'X reads as (QUOTE X)
    sources: [wiki-maclisp]

