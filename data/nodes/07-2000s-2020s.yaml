  sources: [wiki-idris, idris-lang-org]
  example:
    title: Length-indexed vectors
    language: Idris
    note: "From Wikipedia. The type of append says the result's length is the sum of the inputs'; total asks the checker to prove the function covers every case and terminates. Indentation was lost in fetching and has been restored."
    code: |
      data Vect : Nat -> Type -> Type where
        Nil  : Vect 0 a
        (::) : (x : a) -> (xs : Vect n a) -> Vect (n + 1) a

      total
      append : Vect n a -> Vect m a -> Vect (n + m) a
      append Nil       ys = ys
      append (x :: xs) ys = x :: append xs ys
    sources: [wiki-idris]

