  links: { wikipedia: "https://en.wikipedia.org/wiki/C_Sharp_(programming_language)" }
  sources: [wiki-csharp, syme-2020-early-history-fsharp]
  example:
    title: async/await and LINQ
    language: C# 12
    note: await suspends the method and returns a Task to the caller; the compiler turns the method into a state machine (C# 5, 2012). The LINQ query is a monad comprehension in SQL-like clothes (C# 3, 2007).
    code: |
      using System;
      using System.Linq;
      using System.Net.Http;
      using System.Threading.Tasks;

      var http = new HttpClient();
      string[] urls = ["https://example.com", "https://example.org"];

      var lengths = await Task.WhenAll(urls.Select(async url =>
          (url, length: (await http.GetStringAsync(url)).Length)));

      var big = from r in lengths
                where r.length > 1000
                orderby r.length descending
                select r.url;

      Console.WriteLine(string.Join(", ", big));
    sources: [syme-2020-early-history-fsharp]

