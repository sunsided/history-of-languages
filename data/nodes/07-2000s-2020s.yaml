    - { version: "2.10", year: 2013, summary: "Futures/Promises in the standard library; Akka replaces Scala actors." }
    - { version: "3.0", year: 2021, summary: "Dotty / DOT calculus: given/using, enums, union types." }
  summary: "Fuses object-oriented and functional programming on the JVM: every value is an object and every function a value. Odersky had earlier built Pizza and GJ, whose generics became Java 5's."
  relations:
    - { type: influenced_by, to: java, weight: strong, confidence: high }
    - { type: influenced_by, to: haskell, aspects: [type-classes], weight: moderate, confidence: high }
    - { type: influenced_by, to: standard-ml, weight: moderate, confidence: high }
    - { type: influenced_by, to: smalltalk, aspects: [everything-is-an-object], weight: moderate, confidence: medium }
    - { type: influenced_by, to: erlang, aspects: [actors], weight: moderate, confidence: high }
  research_status: draft
  confidence: high
  sources: [wiki-scala]
  example:
    title: Case classes, pattern matching, futures
    language: Scala 3
    note: An enum (algebraic data type) matched exhaustively, objects and functions mixed freely, and Futures composed with a for-comprehension, the monadic style Scala brought to the JVM.
    code: |
      import scala.concurrent.*, ExecutionContext.Implicits.global, duration.*

      enum Shape:
        case Circle(r: Double)
        case Rect(w: Double, h: Double)

      def area(s: Shape): Double = s match
        case Shape.Circle(r)  => math.Pi * r * r
        case Shape.Rect(w, h) => w * h

      val total = for
        a <- Future(area(Shape.Circle(1)))
        b <- Future(area(Shape.Rect(2, 3)))
      yield a + b

      @main def run() = println(Await.result(total, 1.second))
    sources: [wiki-scala]

- id: fsharp
  name: F#
  kind: language
  category: general
  cluster: ml-family
  origin:
    first_appeared: { year: 2005, precision: year, note: "1.0 May 2005; research work from 2002." }
    places: [{ institution: Microsoft Research, city: Cambridge, country: GB }]
  creators: [{ name: Don Syme, role: designer }]
  status: active
  tags:
    paradigm: [functional, object-oriented, multi-paradigm]
    typing: [static-typing, type-inference]
    memory: [garbage-collection]
    concurrency: [async-await, computation-expressions]
    features: [algebraic-data-types, pattern-matching, computation-expressions, units-of-measure, type-providers, offside-rule]
  milestones:
    - { version: "1.9.x (async workflows)", year: 2007, introduces: [async-await, computation-expressions], summary: "Asynchronous workflows: async { let! x = ... } compiled to continuations. The direct ancestor of C# async/await." }
    - { version: "2.0", year: 2010 }
    - { version: "6.0", year: 2021, summary: "task { } computation expression." }
  summary: >
    OCaml-style language for .NET. Its async workflows (2007), monadic computation expressions with
    let! for awaiting, are the line from Haskell's monads to async/await in C#.
  relations:
    - { type: influenced_by, to: ocaml, weight: strong, confidence: high }
    - { type: influenced_by, to: haskell, aspects: [monads, computation-expressions], weight: strong, confidence: high }
    - { type: influenced_by, to: csharp, weight: moderate, confidence: high }
  research_status: draft
  confidence: high
  sources: [syme-2020-early-history-fsharp, syme-2011-fsharp-async]
  example:
    title: Asynchronous workflows (2007)
    language: F#
    note: async { ... } is a computation expression; let! awaits another async without blocking a thread. This is the design C# 5's async/await was based on, five years later.
    code: |
      open System.Net.Http

      let fetchLength (url: string) = async {
          use client = new HttpClient()
          let! body = client.GetStringAsync(url) |> Async.AwaitTask
          return url, body.Length
      }

      [ "https://example.com"; "https://example.org" ]
      |> List.map fetchLength
      |> Async.Parallel
      |> Async.RunSynchronously
      |> Array.iter (fun (u, n) -> printfn "%s: %d" u n)
    sources: [syme-2020-early-history-fsharp, syme-2011-fsharp-async]

