    title: "Two kinds of destruction"
    language: "C++/CLI"
    year: 2005
    note: "From Wikipedia's C++/CLI article. A ref class lives on the garbage-collected heap: gcnew returns a handle (^), the finalizer !MyClass runs whenever the GC collects it, while the destructor ~MyClass runs deterministically on delete or at scope exit, as in ordinary C++."
    code: |
      ref class MyClass {
      protected:
          !MyClass(); // finalizer (non-deterministic destructor) (implemented as Finalize())
      public:
          MyClass();  // constructor
          ~MyClass(); // (deterministic) destructor (implemented as IDisposable.Dispose())
          static void Test() {
              MyClass automatic; // Not a handle, no initialization: compiler calls constructor here
              MyClass^ user = gcnew MyClass();
              delete user;
              // Compiler calls automatic's destructor when automatic goes out of scope
          }
      };
    sources: [wiki-cpp-cli]
