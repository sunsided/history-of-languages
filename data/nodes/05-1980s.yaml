  example:
    title: Collect the words of a document
    language: ABC
    note: The example from Wikipedia's ABC article (indentation restored, as ABC uses it for blocks). Sets, lists and tables are built in. Python kept the colon and the indentation.
    code: |
      HOW TO RETURN words document:
         PUT {} IN collection
         FOR line IN document:
            FOR word IN split line:
               IF word not.in collection:
                  INSERT word IN collection
