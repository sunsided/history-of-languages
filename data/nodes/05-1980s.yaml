- id: modula-3
  name: Modula-3
  kind: language
  category: systems
  cluster: algol/wirth
  origin:
    first_appeared: { year: 1988, precision: year }
    places: [{ institution: DEC Systems Research Center and Olivetti Research, city: Palo Alto, country: US }]
  creators:
    - { name: "Luca Cardelli, James Donahue, Lucille Glassman, Mick Jordan, Bill Kalsow, Greg Nelson", role: designers }
  status: extinct
  tags:
    paradigm: [imperative, structured, object-oriented, modular]
    typing: [static-typing, strong-typing]
    memory: [garbage-collection]
    concurrency: [threads]
    features: [modules, exceptions, generics, safe-unsafe-split]
  summary: "Safe systems language with garbage collection, threads, objects, exceptions and an explicit UNSAFE escape hatch. Barely used, but credited by Java's and Python's designers; its UNSAFE modules anticipate Rust's unsafe."
  relations:
    - { type: successor_of, to: modula-2, weight: strong, confidence: medium, note: "Wirth blessed the name but was not a designer." }
    - { type: influenced_by, to: mesa, weight: moderate, confidence: medium, note: "Via Cedar." }
  research_status: draft
  confidence: medium
  sources: [wiki-modula-3]
  example:
    title: An object type behind an interface
    language: Modula-3
    note: From Wikipedia's Modula-3 article. The interface says only that Person.T is some subtype (<:) of Public; the module reveals the private fields. BRANDED makes the type distinct even if another has the same structure.
    code: |
      INTERFACE Person;
      TYPE T <: Public;
        Public = OBJECT
        METHODS
          getAge(): INTEGER;
          init(name: TEXT; age: INTEGER): T;
        END;
      END Person.

      MODULE Person;
      REVEAL T = Public BRANDED
        OBJECT
          name: TEXT;   (* These two variables *)
          age: INTEGER; (* are private. *)
        OVERRIDES
          getAge := Age;
          init := Init;
        END;

      PROCEDURE Age(self: T): INTEGER =
        BEGIN RETURN self.age; END Age;

      PROCEDURE Init(self: T; name: TEXT; age: INTEGER): T =
        BEGIN self.name := name; self.age := age; RETURN self; END Init;

      BEGIN
      END Person.

      (* client: *)  VAR jim := NEW(Person.T).init("Jim", 25);
    sources: [wiki-modula-3]

