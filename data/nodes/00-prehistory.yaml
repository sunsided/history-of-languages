      Y g  →  g (Y g)  →  g (g (Y g))  →  …

- id: turing-machine
  name: Turing machine
  kind: formalism
  category: research
  cluster: prehistory/formalisms
  origin:
    first_appeared: { year: 1936, precision: year, note: "Paper 'On Computable Numbers' submitted 1936, published 1937." }
    places: [{ institution: University of Cambridge, city: Cambridge, country: GB }]
  creators:
    - { name: Alan Turing, role: designer }
  status: active
  summary: "Abstract machine reading and writing symbols on a tape under a finite table of rules. Defines computability; the universal machine anticipates the stored-program computer. Brainfuck is close to a literal Turing machine with a byte tape."
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Turing_machine" }
  sources: [turing-1936]
  example:
    title: Binary increment
    language: Turing machine transition table
    note: The head starts on the rightmost digit. It turns trailing 1s into 0s while moving left, then writes a 1 into the first 0 or blank. 1011 becomes 1100.
    code: |
      state  read  write  move  next
      inc    1     0      L     inc
      inc    0     1      –     halt
      inc    _     1      –     halt
    sources: [turing-1936]

- id: al-jazari-automata
  name: Al-Jazari's musical automata
  kind: mechanism
  category: domain-specific
  cluster: prehistory/mechanisms
  origin:
    first_appeared: { year: 1206, precision: year, note: "Described in The Book of Knowledge of Ingenious Mechanical Devices, \"in 1206, where he described 50 mechanical devices\"." }
  creators:
    - { name: Ismail al-Jazari, role: inventor }
  summary: >
    Automata in al-Jazari's 1206 book. The castle clock had "five automata musicians who automatically
    play music when moved by levers operated by a hidden camshaft attached to a water wheel". For his
    musical boat, Noel Sharkey "has argued that it is quite likely that it was an early programmable
    automata": "a programmable drum machine with pegs (cams)", where "different rhythms and different drum
    patterns" came from moving the pegs. The camshaft itself "was described in 1206 by al-Jazari".
  notes: >
    The programmability is Sharkey's reading, not the article's own claim; a 14th-century copy shows the
    castle clock. Al-Jazari credits the Banū Mūsā brothers for his fountains and Hibatullah ibn al-Husayn
    for musical automata.
  relations:
    - { type: influenced_by, to: banu-musa-flute-player, weight: weak, confidence: low, sources: [wiki-al-jazari], note: "He cites \"the Banū Mūsā brothers for his fountains\" and Hibatullah ibn al-Husayn \"for musical automata\"; no direct link to the flute player is stated." }
  research_status: stub
  confidence: low
  links: { wikipedia: "https://en.wikipedia.org/wiki/Ismail_al-Jazari" }
