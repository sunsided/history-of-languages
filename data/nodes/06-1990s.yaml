    - { type: influenced_by, to: cpp, aspects: [classes], weight: strong, confidence: high }
    - { type: influenced_by, to: objective-c, aspects: [interfaces], weight: moderate, confidence: high, note: "Interfaces from Objective-C protocols." }
    - { type: influenced_by, to: smalltalk, aspects: [bytecode-vm, garbage-collection], weight: moderate, confidence: medium }
    - { type: influenced_by, to: mesa, aspects: [monitors], weight: moderate, confidence: medium }
