# Esoteric languages that matter: each one demonstrates a real idea (minimal Turing-completeness, 2D control flow,
# combinators, invisible syntax, deliberate hostility). Selection criterion: is it cited as the origin of an esolang family
# or does it illustrate a computational concept? See clusters.yaml esoteric backlog for candidates.

- id: p-prime-prime
  name: P′′
  aliases: [P-double-prime]
  kind: formalism
  category: esoteric
  cluster: esoteric/minimal
  origin:
    first_appeared: { year: 1964, precision: year }
    places: [{ country: IT }]
  creators: [{ name: Corrado Böhm, role: designer }]
  status: historical
  summary: "Böhm's minimal language for a Turing machine with a tape, using only composition and a while-loop, proven Turing-complete. It is the first 'GOTO-less' structured language with a proof, and Brainfuck is almost exactly P′′ with I/O."
  research_status: draft
  confidence: high
  sources: [bohm-1964-p-prime-prime]
  example:
    title: Böhm's three operations
    language: P′′
    year: 1964
    note: P′′ has only R (move the head right), λ (increment the current symbol modulo the alphabet, then move left) and (q) (repeat q while the current symbol is not blank). Böhm proved this Turing-complete using only composition and iteration. Brainfuck maps onto it almost one to one.
    code: |
      P′′        brainfuck
      R          >
      λ          +<
      (q)        [q]

      R(λRR)     move right; then, while the cell is non-blank,
                 increment it, step back left, and move right twice
    sources: [bohm-1964-p-prime-prime]

- id: intercal
  name: INTERCAL
  kind: language
  category: esoteric
  cluster: esoteric/parody
  origin:
    first_appeared: { year: 1972, precision: year }
    places: [{ institution: Princeton University, city: Princeton, country: US }]
  creators: [{ name: Don Woods, role: designer }, { name: James M. Lyon, role: designer }]
  status: maintained
  tags:
    features: [come-from]
  summary: "The first esoteric language: a parody of the languages of its time, requiring the right amount of PLEASE. C-INTERCAL (1990) added COME FROM, the inverse of GOTO, which was itself a parody of Dijkstra's 'Go To Statement Considered Harmful'."
  relations:
    - { type: influenced_by, to: fortran, weight: weak, confidence: medium, note: "Parody target." }
    - { type: influenced_by, to: pl-i, weight: weak, confidence: medium, note: "Parody target." }
  research_status: draft
  confidence: high
  sources: [esolangs-intercal]
  example:
    title: "Adding two numbers, politely"
    language: "C-INTERCAL"
    note: "Assignment is <-, #5 is a constant and .1 a 16-bit variable. (1000) NEXT calls the system library's addition routine, leaving .1 + .2 in .3. READ OUT prints in Roman numerals (VIII). Too few PLEASEs and the compiler refuses the program as impolite; too many and it calls it excessively polite."
    code: |
      DO .1 <- #5
      DO .2 <- #3
      DO (1000) NEXT
      DO READ OUT .3
      PLEASE GIVE UP

- id: false-lang
  name: "FALSE"
  kind: language
  category: esoteric
  cluster: esoteric/minimal
  origin:
    first_appeared: { year: 1993, precision: year }
    places: [{ country: NL }]
  creators: [{ name: Wouter van Oortmerssen, role: designer }]
  status: extinct
  tags:
    paradigm: [stack-oriented, concatenative]
  summary: "Forth-like stack language with a 1024-byte compiler for the Amiga. Inspired both Brainfuck and Befunge."
  relations:
    - { type: influenced_by, to: forth, weight: strong, confidence: high }
  research_status: draft
  confidence: high
  sources: [esolangs-false]
  example:
    title: A stack-based countdown
    language: 'FALSE'
    note: $ duplicates the top of the stack, . prints a number, % drops. [condition][body]# is a while loop. Prints 10 9 8 … 1. Brainfuck and Befunge both started from this 1024-byte language.
    code: |
      10[$0>][$." "1-]#%
    sources: [esolangs-false]

- id: brainfuck
  name: Brainfuck
  kind: language
  category: esoteric
  cluster: esoteric/minimal
  origin:
    first_appeared: { year: 1993, precision: year }
    places: [{ country: CH }]
  creators: [{ name: Urban Müller, role: designer }]
  status: active
  tags:
    paradigm: [imperative]
    features: [minimalism]
  summary: "Eight single-character commands on a byte tape; Müller aimed for the smallest possible compiler (240 bytes for the Amiga). The template for hundreds of trivial substitution variants, and a standard first target for toy compilers."
  relations:
    - { type: influenced_by, to: false-lang, weight: strong, confidence: high }
    - { type: influenced_by, to: p-prime-prime, weight: moderate, confidence: medium, note: "Structurally equivalent to P′′ plus I/O; whether Müller knew P′′ is not documented." }
    - { type: influenced_by, to: turing-machine, weight: moderate, confidence: medium }
  research_status: draft
  confidence: high
  sources: [esolangs-brainfuck]
  example:
    title: "Hello World!"
    language: "brainfuck"
    note: "Eight commands: > < move the pointer, + - change the cell, . , do I/O, and [ ] loop. The first loop builds the multiples of 8 the letters need."
    code: |
      ++++++++[>++++[>++>+++>+++>+<<<<-]>+>+>->>+[<]<-]>>.>---.+++++++..+++.>>.<-.<.+++.------.--------.>>+.>++.

- id: befunge
  name: Befunge
  kind: language
  category: esoteric
  cluster: esoteric/2d
  origin:
    first_appeared: { year: 1993, precision: year }
    places: [{ country: CA }]
  creators: [{ name: Chris Pressey, role: designer }]
  status: maintained
  tags:
    paradigm: [stack-oriented]
    features: [two-dimensional, self-modifying-code]
  summary: "Programs are a 2D grid that an instruction pointer travels across in four directions; designed to be as hard to compile as possible. Origin of the 'fungeoid' 2D language family."
  relations:
    - { type: influenced_by, to: false-lang, weight: strong, confidence: high }
    - { type: influenced_by, to: forth, weight: moderate, confidence: high }
  research_status: draft
  confidence: high
  sources: [esolangs-befunge]
  example:
    title: Hello, World!
    language: Befunge-93
    note: 'The string mode (") pushes the characters in reverse; > sends the instruction pointer right; : duplicates; # skips the next cell; , prints; _ goes right if the top is zero, left otherwise; @ ends. The pointer bounces back and forth along this one line.'
    code: |
      "!dlroW ,olleH">:#,_@
    sources: [esolangs-befunge]

- id: malbolge
  name: Malbolge
  kind: language
  category: esoteric
  cluster: esoteric/hostile
  origin:
    first_appeared: { year: 1998, precision: year }
    places: [{ country: US }]
  creators: [{ name: Ben Olmstead, role: designer }]
  status: historical
  tags:
    features: [self-modifying-code]
  summary: "Designed to be as difficult as possible: ternary machine, self-encrypting instructions. The first program (printing 'Hello World') was found two years later by a beam search, not written by a human."
  relations:
    - { type: influenced_by, to: intercal, weight: moderate, confidence: medium }
  research_status: draft
  confidence: high
  sources: [esolangs-malbolge]
  example:
    title: How a Malbolge instruction is decoded
    language: pseudocode of the Malbolge machine
    note: 'Illustrative: real Malbolge programs are unreadable by design (see esolangs.org for the ''Hello World'' found by a beam search in 2000). The instruction executed depends on the code byte plus its own address, and every instruction is scrambled after it runs, so the same byte never means the same thing twice.'
    code: |
      loop:
        op = (mem[c] + c) mod 94
        execute one of: j  i  *  p  <  /  v  o   (by op)
        mem[c] = encrypt[mem[c]]       -- self-modifying, every step
        c = c + 1; d = d + 1
    sources: [esolangs-malbolge]

- id: unlambda
  name: Unlambda
  kind: language
  category: esoteric
  cluster: esoteric/combinators
  origin:
    first_appeared: { year: 1999, precision: year }
    places: [{ country: FR }]
  creators: [{ name: David Madore, role: designer }]
  status: historical
  tags:
    paradigm: [functional]
    features: [first-class-continuations]
  summary: "A purely functional language based on S and K combinators plus call/cc, with no variables. Shows that a practical(ish) language needs nothing but combinatory logic."
  relations:
    - { type: influenced_by, to: combinatory-logic, weight: strong, confidence: high }
    - { type: influenced_by, to: scheme, aspects: [first-class-continuations], weight: moderate, confidence: high }
  research_status: draft
  confidence: high
  sources: [esolangs-unlambda]
  example:
    title: Hello world
    language: Unlambda 2
    note: Backquote ` is function application, .x is a function that prints x, r prints a newline, i is the identity. The output is a side effect of applying the printing functions to each other.
    code: |
      `r```````````.H.e.l.l.o. .w.o.r.l.di
    sources: [esolangs-unlambda]

- id: shakespeare
  name: Shakespeare Programming Language
  aliases: [SPL]
  kind: language
  category: esoteric
  cluster: esoteric/natural-language
  origin:
    first_appeared: { year: 2001, precision: year }
    places: [{ institution: KTH Royal Institute of Technology, city: Stockholm, country: SE }]
  creators: [{ name: Karl Hasselström, role: designer }, { name: Jon Åslund, role: designer }]
  status: historical
  summary: "Programs read like plays: variables are characters, assignment is insult or compliment. A satire of 'English-like' languages descended from FLOW-MATIC and COBOL."
  relations:
    - { type: influenced_by, to: cobol, aspects: [english-like-syntax], weight: weak, confidence: low, note: "Thematic, not documented." }
  research_status: stub
  confidence: high
  sources: [esolangs-shakespeare]
  example:
    title: Juliet says 'H'
    language: Shakespeare Programming Language
    note: Characters are variables. A noun is worth 1 and each adjective doubles it, so 'a big big big big big big cat' is 64 and 'a big big big cat' is 8. Juliet sets Romeo to their sum, 72, and 'Speak your mind!' makes Romeo print it as the character H.
    code: |
      The Letter H.

      Romeo, a listener.
      Juliet, a speaker.

                          Act I: The only act.
                          Scene I: The only scene.

      [Enter Romeo and Juliet]

      Juliet:
        You are as lovely as the sum of a big big big big big big cat
        and a big big big cat. Speak your mind!

      [Exeunt]
    sources: [esolangs-shakespeare]

- id: piet
  name: Piet
  kind: language
  category: esoteric
  cluster: esoteric/2d
  origin:
    first_appeared: { year: 2001, precision: circa }
    places: [{ country: AU }]
  creators: [{ name: David Morgan-Mar, role: designer }]
  status: historical
  tags:
    paradigm: [stack-oriented]
    features: [two-dimensional]
  summary: "Programs are abstract images in the style of Piet Mondrian; instructions are encoded in hue and lightness changes between colour blocks."
  relations:
    - { type: influenced_by, to: befunge, aspects: [two-dimensional], weight: moderate, confidence: medium }
  research_status: stub
  confidence: high
  sources: [esolangs-piet]
  example:
    title: A program is a picture
    language: Piet (described in pseudocode)
    note: Piet source is an image, so it cannot be shown as text. The interpreter moves between blocks of colour; the change in hue and lightness from one block to the next selects the command, and the size of the block just left is the number pushed. The pseudocode describes a picture that prints 'H'.
    code: |
      block of 72 red codels      → (step to next hue)       = push 72
      lightness one step darker   → (step to next block)     = out(char)   prints "H"
      a block boxed in by black   → no way out               = program ends
    sources: [esolangs-piet]

- id: whitespace
  name: Whitespace
  kind: language
  category: esoteric
  cluster: esoteric/hostile
  origin:
    first_appeared: { year: 2003, date: "2003-04-01", precision: exact }
    places: [{ institution: Durham University, city: Durham, country: GB }]
  creators: [{ name: Edwin Brady, role: designer }, { name: Chris Morris, role: designer }]
  status: historical
  tags:
    paradigm: [stack-oriented]
  summary: "Only spaces, tabs and newlines are significant, so programs are invisible and can hide inside other source code. Brady later created the dependently typed language Idris."
  research_status: stub
  confidence: high
  sources: [esolangs-whitespace]
  example:
    title: Printing 'H', made visible
    language: Whitespace
    note: Only space (S), tab (T) and line feed (L) count; everything else is a comment. Shown here with the invisible characters spelled out. S S pushes a number written in binary with S as 0 and T as 1 (the first S is the + sign); T L S S prints a character; L L L ends.
    code: |
      S S  S T S S T S S S L     push +1001000 (72, 'H')
      T L  S S                   output character
      L L  L                     end program
    sources: [esolangs-whitespace]

