- id: datalog
  name: Datalog
  kind: language
  category: query
  cluster: logic
  origin:
    first_appeared: { year: 1977, precision: circa, note: "\"it became prominent as a separate area around 1977 when Hervé Gallaire and Jack Minker organized a workshop on logic and databases\" (proceedings 1978). David Maier is credited with the name." }
  creators:
    - { name: Hervé Gallaire, role: "1977 workshop on logic and databases" }
    - { name: Jack Minker, role: "1977 workshop on logic and databases" }
    - { name: David Maier, role: "coined the name" }
  status: active
  tags:
    paradigm: [declarative, logic, query]
    features: [recursion, unification]
    domain: [databases]
  summary: >
    Logic programming as a query language: "syntactically a subset of Prolog", but evaluated bottom-up, without
    cut, function symbols or Turing-completeness, so every program terminates. Non-recursive Datalog equals
    unions of conjunctive queries; recursion gives transitive closure, which SQL:1999 adopted. Revived in program
    analysis and in databases such as Datomic, Soufflé and .QL.
  relations:
    - { type: subset_of, to: prolog, weight: strong, confidence: high, sources: [wiki-datalog], note: "\"While it is syntactically a subset of Prolog, Datalog generally uses a bottom-up rather than top-down evaluation model.\"" }
  research_status: draft
  confidence: medium
  links: { wikipedia: "https://en.wikipedia.org/wiki/Datalog" }
  sources: [wiki-datalog]
  example:
    title: Ancestors by recursion
    language: Datalog
    note: "From Wikipedia. Two facts and two rules; a bottom-up engine derives every ancestor pair, and the recursive rule cannot loop."
    code: |
      parent(xerces, brooke).
      parent(brooke, damocles).
      ancestor(X, Y) :- parent(X, Y).
      ancestor(X, Y) :- parent(X, Z), ancestor(Z, Y).
    sources: [wiki-datalog]

