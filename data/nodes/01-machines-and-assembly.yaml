# Early machines, machine code and assembly languages.
# A `machine` node stands for its instruction set (its machine code). Assembly dialects point at it with `targets`.
# Assembly syntaxes for the same ISA (Intel vs AT&T for x86) are separate nodes with `dialect_of`.

# ---------- Early programmable machines ----------
- id: zuse-z3
  name: Zuse Z3
  kind: machine
  category: scientific
  cluster: machines/early
  origin:
    first_appeared: { year: 1941, date: "1941-05", precision: exact }
    places: [{ city: Berlin, country: DE }]
  creators: [{ name: Konrad Zuse, role: designer }]
  status: extinct
  summary: "Electromechanical, program-controlled binary floating-point computer, programmed from punched 35 mm film. No conditional branch; shown Turing-complete only in 1998 by an indirect construction."
  research_status: draft
  confidence: high
  sources: [wiki-z3]
  example:
    title: (a + b) × c on punched film
    language: Z3 instruction set
    year: 1941
    note: 'The Z3 had nine instructions: Lu (read decimal keyboard), Ld (display), Pr z / Ps z (load from / store to memory cell z), Ls1 (add), Ls2 (subtract), Lm (multiply), Li (divide), Lw (square root). No conditional jump: the program on the film strip simply ran start to end, and loops were made by gluing the film into a loop.'
    code: |
      Lu        ; read a from keyboard
      Lu        ; read b
      Ls1       ; a + b
      Ps 1      ; store in cell 1
      Lu        ; read c
      Pr 1      ; load a + b
      Lm        ; multiply
      Ld        ; show result
    sources: [wiki-z3]

