    - { type: influenced_by, to: cyclone, aspects: [region-based-memory], weight: strong, confidence: high }
    - { type: influenced_by, to: ocaml, weight: strong, confidence: high, note: "First compiler (rustboot) was written in OCaml." }
    - { type: influenced_by, to: haskell, aspects: [type-classes], weight: strong, confidence: high }
    - { type: influenced_by, to: standard-ml, aspects: [algebraic-data-types, pattern-matching], weight: moderate, confidence: high }
    - { type: influenced_by, to: erlang, weight: moderate, confidence: high, note: "Early task model, message passing." }
    - { type: influenced_by, to: limbo, aspects: [channels], weight: weak, confidence: high }
    - { type: influenced_by, to: newsqueak, weight: weak, confidence: high }
    - { type: influenced_by, to: scheme, aspects: [hygienic-macros], weight: moderate, confidence: high }
    - { type: influenced_by, to: csharp, aspects: [async-await], weight: moderate, confidence: medium }
    - { type: influenced_by, to: swift, weight: weak, confidence: high }
    - { type: implemented_in, to: ocaml, weight: moderate, confidence: high }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Rust_(programming_language)", homepage: "https://www.rust-lang.org" }
  sources: [rust-reference-influences, rust-async-stabilization]
  example:
    title: "Lifetimes in a signature"
    language: "Rust"
    note: "'a says the returned reference lives no longer than both inputs, so the borrow checker can reject a dangling reference at compile time with no garbage collector."
    code: |
      fn longest<'a>(x: &'a str, y: &'a str) -> &'a str {
          if x.len() > y.len() { x } else { y }
      }

