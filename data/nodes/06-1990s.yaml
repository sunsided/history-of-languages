    typing: [dynamic-typing, strong-typing, gradual-typing]
    memory: [reference-counting, garbage-collection]
    concurrency: [threads, gil, async-await, coroutines, generators]
    features: [offside-rule, exceptions, modules, generators, list-comprehensions, decorators, pattern-matching]
  milestones:
    - { version: "1.0", year: 1994, introduces: [first-class-functions], summary: "lambda, map, filter, reduce." }
    - { version: "2.0", year: 2000, introduces: [list-comprehensions, garbage-collection], summary: "List comprehensions (from Haskell), cycle-collecting GC." }
    - { version: "2.2", year: 2001, introduces: [generators], summary: "PEP 255 simple generators (yield), citing Icon; unified types and classes." }
    - { version: "2.5", year: 2006, introduces: [coroutines], summary: "PEP 342: generators as coroutines (send, throw); enabled Twisted inlineCallbacks-style async." }
    - { version: "3.0", year: 2008, summary: "Unicode str, print function; deliberately backwards incompatible." }
    - { version: "3.4", year: 2014, summary: "asyncio (PEP 3156) event loop in the standard library." }
    - { version: "3.5", year: 2015, introduces: [async-await, gradual-typing], summary: "PEP 492 async/await syntax; PEP 484 type hints." }
    - { version: "3.10", year: 2021, introduces: [pattern-matching] }
    - { version: "3.13", year: 2024, summary: "Experimental free-threaded build without the GIL (PEP 703)." }
  summary: >
    Successor in spirit to ABC: indentation syntax, but extensible and open. Its path from generators
    (2001) to coroutines (2006) to async/await (2015) is one of the clearest step-by-step records of
    how async/await grew out of generators.
  relations:
    - { type: influenced_by, to: abc, aspects: [offside-rule, high-level-collections], weight: strong, confidence: high }
    - { type: influenced_by, to: modula-3, aspects: [exceptions, modules], weight: moderate, confidence: high, note: "Van Rossum credits Modula-3 for exceptions and the module/class system." }
    - { type: influenced_by, to: c, weight: moderate, confidence: high }
    - { type: influenced_by, to: icon, aspects: [generators], weight: moderate, confidence: high }
    - { type: influenced_by, to: haskell, aspects: [list-comprehensions], weight: moderate, confidence: high }
    - { type: influenced_by, to: lisp, aspects: [first-class-functions], weight: weak, confidence: medium }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Python_(programming_language)", homepage: "https://www.python.org" }
  sources: [van-rossum-2009-history-python, pep-255, pep-342, pep-492, pep-3156]
  example:
    title: From generators to async/await
    language: Python 3
    note: 'The same suspend-and-resume idea twice: a generator yields values to a for loop (2001), and an async function awaits I/O without blocking the event loop (2015). Tested with Python 3.'
    code: |
      import asyncio

      def countdown(n):
          while n > 0:
              yield n
              n -= 1

      async def fetch(name, delay):
          await asyncio.sleep(delay)
          return f"{name} done"

      async def main():
          print(list(countdown(3)))                    # [3, 2, 1]
          results = await asyncio.gather(fetch("a", 0.2), fetch("b", 0.1))
          print(results)                               # ['a done', 'b done']

      asyncio.run(main())
    sources: [pep-255, pep-492]

