    paradigm: [imperative]
    concurrency: [message-passing]
    features: [assembly-language]
  summary: >
    The assembly of a fictional 1980s "Tessellated Intelligence System", programmed in Zachtronics' puzzle game.
    The machine is a grid of tiny compute nodes (T21 Basic Execution Nodes), each with an accumulator ACC, a
    backup register BAK that only SWP and SAV touch, and ports UP, DOWN, LEFT, RIGHT, ANY and LAST through which
    values pass to neighbouring nodes. 13 documented instructions plus the undocumented HCF, explained in a
    printable manual styled as a vintage computer manual.
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/TIS-100", homepage: "https://www.zachtronics.com/tis-100/" }
