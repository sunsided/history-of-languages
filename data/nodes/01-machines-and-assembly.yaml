    - { name: Jean Bartik, role: "first programmer (then Jean Jennings)" }
    - { name: Betty Holberton, role: "first programmer (then Betty Snyder)" }
    - { name: Marlyn Meltzer, role: "first programmer (then Marlyn Wescoff)" }
    - { name: Frances Spence, role: "first programmer (then Frances Bilas)" }
    - { name: Ruth Teitelbaum, role: "first programmer (then Ruth Lichterman)" }
  status: extinct
  summary: "First programmable general-purpose electronic computer. Originally programmed by setting switches and plugging cables; converted in 1948 to run a fixed set of stored instructions selected from function tables."
  research_status: stub
  confidence: high
  sources: [wiki-eniac]
  example:
    title: Programming by wiring
    language: ENIAC plugboard setup (illustrative pseudocode)
    note: 'Before 1948 a program was a physical configuration: cables carried numbers between accumulators and program pulses between units, and switches set each unit''s operation. Setting up a new problem took days. The pseudocode describes one such wiring for a running sum.'
    code: |
      initiating unit ─pulse→ accumulator 1: receive from constant transmitter
      accumulator 1 done ─pulse→ accumulator 2: receive (add) from acc 1
      accumulator 2 done ─pulse→ master programmer: repeat 10 times
      master programmer done ─pulse→ printer: punch acc 2
    sources: [wiki-eniac]

- id: manchester-baby
  name: Manchester Baby
  aliases: [SSEM]
  kind: machine
  category: research
  cluster: machines/early
  origin:
    first_appeared: { year: 1948, date: "1948-06-21", precision: exact }
    places: [{ institution: Victoria University of Manchester, city: Manchester, country: GB }]
  creators:
    - { name: Frederic Calland Williams, role: designer }
    - { name: Tom Kilburn, role: designer }
    - { name: Geoff Tootill, role: designer }
  status: extinct
  summary: "First electronic stored-program computer to run a program: program and data in the same memory. From here on, a program is data, and machine code is a language in its own right."
  relations:
    - { type: influenced_by, to: turing-machine, weight: weak, confidence: low, note: "The stored-program idea is usually traced to von Neumann's 1945 EDVAC report; Turing's influence on Manchester is debated." }
  research_status: stub
  confidence: high
  sources: [wiki-manchester-baby, von-neumann-1945-edvac]
  example:
    title: Adding with only subtract
    language: SSEM mnemonics
    year: 1948
    note: 'The Baby had seven instructions and no add: LDN loads the negated value, SUB subtracts, STO stores, CMP skips the next instruction if the accumulator is negative, JMP/JRP jump, STP halts. a + b is computed as −(−a − b).'
    code: |
      LDN 20    ; acc = −a
      SUB 21    ; acc = −a − b
      STO 22    ; t   = −(a + b)
      LDN 22    ; acc = a + b
      STO 23    ; result
      STP
    sources: [wiki-manchester-baby]

- id: edvac
  name: EDVAC
  aliases: [Electronic Discrete Variable Automatic Computer]
  kind: machine
  category: scientific
  cluster: machines/early
  origin:
    began: { year: 1945, precision: year, note: "Construction proposed by Mauchly and Eckert (the article says August 1945 in one place and August 1944 in another); von Neumann's First Draft of a Report on the EDVAC is dated 30 June 1945." }
    first_appeared: { year: 1951, precision: year, note: "Delivered to the Ballistic Research Laboratory in 1949; \"began operation in 1951 although only on a limited basis\"." }
    places: [{ institution: Moore School of Electrical Engineering, city: Philadelphia, country: US }]
  creators:
    - { name: John Mauchly, role: designer }
    - { name: J. Presper Eckert, role: designer }
    - { name: John von Neumann, role: "consultant; First Draft (1945)" }
  status: extinct
  tags:
    features: [self-modifying-code]
  summary: >
    ENIAC's successor, designed from the start as a binary stored-program computer with 1,024 44-bit words in
    mercury delay lines. Von Neumann's 1945 First Draft of a Report on the EDVAC, which described its logical
    design, spread the stored-program idea worldwide, so EDVAC's design shaped EDSAC and the Manchester
    machines before EDVAC itself ran. Each instruction held four addresses: two operands, the result and the
    next instruction.
  relations:
    - { type: successor_of, to: eniac, weight: strong, confidence: high, sources: [wiki-edvac], note: "\"Along with ORDVAC, it was a successor to the ENIAC.\"" }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/EDVAC" }
  sources: [wiki-edvac]
  example:
    title: A four-address instruction word
    language: EDVAC order code (illustrative layout)
    note: "Illustrative. No EDVAC program text was found. Wikipedia: \"the 44-bit word was divided into four 10-bit addresses and four bits to encode the index of an operation\"; only 12 of the 16 operations were used. The order of the fields within the word is not given and is drawn here for clarity."
    code: |
      | A1 (10 bits) | A2 (10 bits) | A3 (10 bits) | A4 (10 bits) | op (4 bits) |
        operand 1      operand 2      result         next order     operation
    sources: [wiki-edvac]

- id: edsac
  name: EDSAC
  kind: machine
  category: scientific
