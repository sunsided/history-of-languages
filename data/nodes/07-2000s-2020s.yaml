    - { type: influenced_by, to: haskell, weight: moderate, confidence: medium, sources: [wiki-lean], note: "Infobox." }
    - { type: influenced_by, to: ml, weight: moderate, confidence: medium, sources: [wiki-lean], note: "Infobox." }
    - { type: implemented_in, to: cpp, weight: strong, confidence: high, sources: [wiki-lean], note: "Lean 3 \"was implemented primarily in C++\"; Lean 4 is mostly Lean with a C++17 core." }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Lean_(proof_assistant)", homepage: "https://lean-lang.org" }
  sources: [wiki-lean, lean-lang-org]
  example:
    title: A tactic proof
    language: Lean
    note: "From Wikipedia. by enters tactic mode; each · focuses one subgoal. Indentation was lost in fetching and has been restored; Lean's tactic blocks are layout-sensitive."
    code: |
      theorem and_swap (p q : Prop) : p ∧ q → q ∧ p := by
        intro h -- assume p ∧ q with proof h, the goal is q ∧ p
        apply And.intro -- the goal is split into two subgoals, one is q and the other is p
        · exact h.right -- the first subgoal is exactly the right part of h : p ∧ q
        · exact h.left -- the second subgoal is exactly the left part of h : p ∧ q
