    - { version: "1.2", year: 1998, introduces: [jit-compilation], summary: "Collections; HotSpot JIT (from Self/Strongtalk) shortly after in 1.3." }
    - { version: "5.0", year: 2004, introduces: [generics, memory-model], summary: "Generics (from GJ/Pizza by Odersky and Wadler), java.util.concurrent, JSR-133 memory model." }
