- id: education
  name: Educational languages
  summary: "Languages designed for teaching programming, from PILOT and TUTOR to block-based Scratch and Snap!."
  research_status: stub
  research_questions:
    - "TUTOR, CESIL, FOIL, Haggis and EPL have no documented relation to existing nodes. Searched: Sherwood, The TUTOR Language (1974); the iclces.uk CESIL history; Wikipedia and FOLDOC for FOIL (Hesselbart, ACM 1968, unread); Cutts et al. 2014 (Haggis deliberately follows no existing language); English and Chinese sources for EPL, whose creation year may be 2000 rather than 2004."
    - "Missing ancestors met while connecting education languages: IBM 1620 (COMPUTEST, the forerunner of PILOT), Common PILOT, Coursewriter (FOIL), the CDC 6600 family (PLATO/TUTOR), cT, TenCORE, the ICL 1900 (CESIL), and Kawa (the App Inventor target). Blockly is a library, recorded in the scratch node's notes rather than as a node."
    - "Legoscript (a former backlog item, which Wikipedia redirects to Lego Mindstorms) is unconfirmed: the Mindstorms article does not mention it, and the only page found (a Localazy language hub, unsourced) calls it a LabVIEW-based visual language by David Levy and Bernard Poulin from 1998. It may be a confusion with ROBOLAB or with MindScript, which the Mindstorms article lists beside LASM. Needs a period LEGO or Tufts document naming it."
    - "Not Quite C: no dated first release found (bounded 1998 to 1999). Look for Dave Baum's original NQC page (archived) or the NQC 1.x/2.x release notes. Object Logo: Digitool's version 2.7 is undated, and the object model was not documented in anything read."
