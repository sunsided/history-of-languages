    places: [{ institution: "University of California, San Diego" }]
  creators:
    - { name: Kenneth Bowles, role: initiator }
  status: historical
  tags:
    paradigm: [stack-oriented]
    features: [bytecode-vm, intermediate-code]
  summary: >
    The instruction set of the UCSD p-Machine, a stack machine "optimized for the new small microcomputers
    with addressing restricted to 16-bit (only 64 KB of memory)", which ran the p-System on the Apple II,
    8080, Z80, 6502, 68000, x86 and others. Bowles "based UCSD Pascal on the Pascal-P2 release of the
    portable compiler from Zurich"; four versions of the engine followed, IV sold by SofTech. "James Gosling
    cites UCSD Pascal as a key influence (along with the Smalltalk virtual machine) on the design of the
    Java virtual machine."
  notes: >
    P-code as a concept predates it: "first implemented circa 1966 as O-code for ... BCPL and P code for the
    language Euler"; Pascal-P (1973, Nori, Ammann, Jensen, Nägeli, Jacobi at ETH) is not a node.
