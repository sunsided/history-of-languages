    'Write once, run anywhere': C++-like syntax on a garbage-collected, bytecode VM, originally for
    embedded consumer devices, then the web and enterprise. Its arc from monitors (1996) via
    CompletableFuture (2014) to virtual threads (2023) is the explicit decision not to adopt
    async/await.
  relations:
    - { type: influenced_by, to: cpp, aspects: [classes], weight: strong, confidence: high }
    - { type: influenced_by, to: objective-c, aspects: [interfaces], weight: moderate, confidence: high, note: "Interfaces from Objective-C protocols." }
    - { type: influenced_by, to: smalltalk, aspects: [bytecode-vm, garbage-collection], weight: moderate, confidence: medium }
    - { type: influenced_by, to: mesa, aspects: [monitors], weight: moderate, confidence: medium }
    - { type: influenced_by, to: modula-3, weight: weak, confidence: medium }
    - { type: influenced_by, to: self, aspects: [jit-compilation], weight: moderate, confidence: high, note: "Implementation influence: HotSpot came from the Self/Strongtalk team." }
    - { type: influenced_by, to: simula, weight: weak, confidence: medium }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Java_(programming_language)" }
  sources: [wiki-java, jep-444]
  example:
    title: Virtual threads instead of async/await
    language: Java 21
    note: Plain blocking code, but each task runs on a cheap virtual thread scheduled by the JVM, so 10,000 sleeping tasks need no async syntax. The try-with-resources block waits for all tasks to finish. Tested with Java 21.
    code: |
      import java.time.Duration;
      import java.util.concurrent.Executors;
      import java.util.stream.IntStream;

      public class Main {
          public static void main(String[] args) {
              try (var executor = Executors.newVirtualThreadPerTaskExecutor()) {
                  IntStream.range(0, 10_000).forEach(i ->
                      executor.submit(() -> {
                          Thread.sleep(Duration.ofSeconds(1));
                          return i;
                      }));
              }
              System.out.println("10,000 tasks, about one second");
          }
      }
    sources: [jep-444]

