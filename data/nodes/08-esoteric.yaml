- id: thue
  name: Thue
  kind: language
  category: esoteric
  cluster: esoteric/minimal
  origin:
    first_appeared: { year: 2000, precision: year }
  creators: [{ name: John Colagioia, role: designer }]
  status: historical
  tags:
    paradigm: [declarative]
    features: [nondeterminism, string-processing]
  summary: >
    A language of string-rewriting rules "based on a semi-Thue grammar": execution repeatedly picks an arbitrary
    applicable rule and rewrites the program state, so it is nondeterministic. Its author calls it "a
    constraint-programming version of a Turing tarpit"; it is Turing-complete by reduction from unrestricted
    grammars.
  research_status: draft
  confidence: medium
  sources: [esolangs-thue]
  example:
    title: Hello World
    language: Thue
    note: "From the Esolang wiki. a::=~Hello World! rewrites a by printing the text after ~; the bare ::= ends the rule list, and the last line is the initial state."
    code: |
      a::=~Hello World!
      ::=
      a
    sources: [esolangs-thue]

