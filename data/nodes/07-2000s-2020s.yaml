- id: chuck
  name: ChucK
  kind: language
  category: domain-specific
  cluster: audio
  origin:
    first_appeared: { year: 2003, precision: year, note: "Wikipedia infobox." }
    places: [{ institution: Princeton University, country: US }]
  creators:
    - { name: Ge Wang, role: creator and chief designer }
    - { name: Perry R. Cook, role: doctoral adviser }
  status: active
  tags:
    paradigm: [object-oriented, imperative, concurrent]
    typing: [static-typing, strong-typing]
    features: [unit-generators, live-coding]
    domain: [music-audio]
  summary: >
    "A concurrent, strongly timed audio programming language for real-time synthesis, composition, and
    performance", created by Ge Wang as a graduate student working with Perry R. Cook. Time is a value: a program
    advances it explicitly (120::ms => now) and is "sample-synchronous" with the audio. The => "ChucK" operator
    connects unit generators and assigns values, left to right.
  notes: >
    Places: Princeton comes from the project's home (chuck.cs.princeton.edu) cited by Wikipedia, not from the
    article text.
  relations:
    - { type: influenced_by, to: c, weight: weak, confidence: medium, sources: [wiki-chuck], note: "\"a loosely C-like object-oriented language, with strong static typing\"" }
  research_status: draft
  confidence: medium
  links: { wikipedia: "https://en.wikipedia.org/wiki/ChucK", homepage: "https://chuck.stanford.edu/" }
  sources: [wiki-chuck]
  example:
    title: Random notes through a reverb, forever
    language: ChucK
    note: "From Wikipedia's ChucK article; the page renders it on one line, so line breaks and indentation are restored at statement boundaries. SinOsc => JCRev => dac patches oscillator, reverb and output; 120::ms => now advances time."
    code: |
      // signal graph (patch)
      SinOsc s => JCRev r => dac;
      .2 => s.gain;
      // dry/wet mix (for reverb)
      .1 => r.mix;
      // an array of pitch classes (semitones)
      [ 0, 2, 4, 7, 9, 11 ] @=> int hi[];
      // do forever:
      while( true )
      {
          // choose a note, shift registers, convert to frequency
          Std.mtof( 45 + Std.rand2(0,3) * 12 + hi[Std.rand2(0,hi.cap()-1)] ) => s.freq;
          // advance time
          120::ms => now;
      }
    sources: [wiki-chuck]

