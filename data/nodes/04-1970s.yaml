  relations:
    - { type: influenced_by, to: lambda-calculus, weight: strong, confidence: high }
    - { type: influenced_by, to: algol-60, weight: strong, confidence: high, note: "Landin had mapped ALGOL 60 onto lambda calculus." }
  research_status: draft
  confidence: high
  sources: [landin-1966-next-700]
  example:
    title: where-clauses
    language: ISWIM
    year: 1966
    note: From Landin's 'The Next 700 Programming Languages'. The where clause and the use of indentation (the 'offside rule') to delimit it reappear in Miranda, Haskell and, in spirit, Python.
    code: |
      f(b + 2c) + f(2b − c)
        where f(x) = x(x + a)
    sources: [landin-1966-next-700]

- id: sql
  name: SQL
  aliases: [SEQUEL]
  kind: language
  category: query
  cluster: data
  origin:
    first_appeared: { year: 1974, precision: year, note: "SEQUEL paper by Chamberlin and Boyce, 1974; renamed SQL for trademark reasons." }
    places: [{ institution: IBM San Jose Research Laboratory, city: San Jose, country: US }]
  creators:
    - { name: Donald D. Chamberlin, role: designer }
    - { name: Raymond F. Boyce, role: designer }
  status: active
  tags:
    paradigm: [declarative, query]
    typing: [static-typing]
    features: [set-based]
    domain: [databases]
  milestones:
    - { version: SQL-86, year: 1986, introduces: [standardization] }
    - { version: SQL-92, year: 1992 }
    - { version: "SQL:1999", year: 1999, introduces: [recursion], summary: "Recursive common table expressions (WITH RECURSIVE), triggers; makes SQL Turing-complete." }
    - { version: "SQL:2003", year: 2003, summary: "Window functions." }
    - { version: "SQL:2016", year: 2016, summary: "JSON." }
    - { version: "SQL:2023", year: 2023, summary: "Property graph queries (SQL/PGQ)." }
  summary: "Declarative query language for Codd's relational model, built for IBM System R. The most widely used declarative language."
  relations:
    - { type: influenced_by, to: codd-relational-model, weight: strong, confidence: high }
    - { type: influenced_by, to: datalog, year: 1999, aspects: [recursion], weight: weak, confidence: medium, sources: [wiki-datalog], note: "Datalog's infobox lists SQL under \"Influenced\"; the article notes SQL:1999 \"includes recursive queries\"." }
  research_status: draft
  confidence: high
  sources: [chamberlin-boyce-1974-sequel, codd-1970-relational]
  example:
    title: Declarative aggregation
    language: SQL
    note: 'Says what the result is, not how to get it: the database chooses join order and indexes. GROUP BY and HAVING arrived early; window functions came in SQL:2003.'
    code: |
      SELECT   d.name, COUNT(*) AS staff, AVG(e.salary) AS avg_salary
      FROM     employee e
      JOIN     department d ON d.id = e.dept_id
      WHERE    e.active
      GROUP BY d.name
      HAVING   COUNT(*) > 5
      ORDER BY avg_salary DESC;
    sources: [chamberlin-boyce-1974-sequel]

