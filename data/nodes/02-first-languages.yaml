# First high-level languages and the 1950s founders: Plankalkül to COBOL.

- id: plankalkul
  name: Plankalkül
  kind: language
  category: scientific
  cluster: early/pioneers
  origin:
    began: { year: 1942, year_end: 1945, precision: range }
    first_appeared: { year: 1948, precision: year, note: "Partly published 1948; full text 1972; first implementation 1975 (Hohmann); fuller implementation FU Berlin 2000." }
    places: [{ country: DE }]
  creators: [{ name: Konrad Zuse, role: designer }]
  status: extinct
  tags:
    paradigm: [imperative, structured]
    typing: [static-typing]
    features: [assertions, records]
  summary: >
    Zuse's "plan calculus", designed in the 1940s for his Z-series machines: the first high-level
    language design, with typed variables, arrays, records, assertions and loops. It was not
    implemented in its time and had little direct influence, though Zuse discussed it with
    Rutishauser and ALGOL 58 participants.
  relations:
    - { type: influenced_by, to: zuse-z3, weight: moderate, confidence: high, note: "Designed for Zuse's machines." }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Plankalk%C3%BCl" }
  sources: [bauer-woessner-1972-plankalkul, knuth-pardo-1976-early-development]
  example:
    title: Maximum of three values
    language: Plankalkül, linear transcription
    note: From the Wikipedia article. V are inputs, Z intermediates, R results; [:8.0] gives the type. P2 max is called by P1 max3. (cond) → statement is a guarded statement. Zuse's original notation was two-dimensional, with V/K/S rows written under each line; this is the later one-line transcription.
    code: |
      P1 max3 (V0[:8.0],V1[:8.0],V2[:8.0]) → R0[:8.0]
      max(V0[:8.0],V1[:8.0]) → Z1[:8.0]
      max(Z1[:8.0],V2[:8.0]) → R0[:8.0]
      END

      P2 max (V0[:8.0],V1[:8.0]) → R0[:8.0]
      V0[:8.0] → Z1[:8.0]
      (Z1[:8.0] < V1[:8.0]) → V1[:8.0] → Z1[:8.0]
      Z1[:8.0] → R0[:8.0]
      END
    sources: [wiki-plankalkul, bauer-woessner-1972-plankalkul]

- id: short-code
  name: Short Code
  aliases: [Brief Code]
  kind: language
  category: scientific
  cluster: early/pioneers
  origin:
    began: { year: 1949, precision: year, note: "Proposed by John Mauchly for BINAC." }
    first_appeared: { year: 1950, precision: year, note: "Implemented by William F. Schmitt; on UNIVAC I from 1950-51." }
    places: [{ institution: Eckert-Mauchly Computer Corporation, city: Philadelphia, country: US }]
  creators:
    - { name: John Mauchly, role: designer }
    - { name: William F. Schmitt, role: implementer }
  status: extinct
  tags:
    paradigm: [imperative]
    features: [interpreter]
  summary: "Mathematical expressions encoded as two-character codes and interpreted at run time: one of the first languages above machine code to actually run, about 50 times slower than machine code."
  relations:
    - { type: targets, to: binac, weight: moderate, confidence: high, sources: [wiki-short-code], note: "\"William Schmitt implemented a version of Brief Code in 1949 for the BINAC computer, though it was never debugged and tested.\"" }
    - { type: targets, to: univac-i, weight: strong, confidence: high, sources: [wiki-short-code, wiki-univac-i], note: "Schmitt's 1950 version for the UNIVAC I, \"where it was now known as Short Code\"." }
  research_status: draft
  confidence: medium
  sources: [knuth-pardo-1976-early-development]
  example:
    title: a = (b + c) / b · c as Short Code
    language: Short Code (BINAC / UNIVAC I)
    year: 1950
    note: 'The worked example from the Wikipedia article, step by step: variables are renamed (a→X3, b→X1, c→Y1), operators and parentheses become two-character codes (multiplication is juxtaposition), and the codes are packed into 12-character machine words, read from the right. An interpreter decoded them at run time.'
    code: |
      a = (b + c) / b * c
      X3 = ( X1 + Y1 ) / X1 * Y1           substitute variables
      X3 03 09 X1 07 Y1 02 04 X1 Y1        substitute operators and parentheses

      07Y10204X1Y1                         group into 12-character words
      0000X30309X1
    sources: [wiki-short-code, knuth-pardo-1976-early-development]

- id: glennie-autocode
  name: Autocode (Glennie)
  kind: language
  category: scientific
  cluster: early/pioneers
  origin:
    first_appeared: { year: 1952, precision: year }
    places: [{ institution: University of Manchester, city: Manchester, country: GB }]
  creators: [{ name: Alick Glennie, role: designer }]
  status: extinct
  tags:
    paradigm: [imperative]
    features: [compiler]
  summary: "For the Manchester Mark 1; often cited as the first compiled programming language. 'Autocode' became the generic British term for such languages (Mercury Autocode, Atlas Autocode)."
  relations:
    - { type: targets, to: ferranti-mark-1, weight: strong, confidence: medium, note: "Written for the Mark 1 at Manchester. By 1952 that was the Ferranti Mark 1, which replaced the university's own Manchester Mark 1 in February 1951." }
  research_status: draft
  confidence: medium
  sources: [knuth-pardo-1976-early-development]
  example:
    title: f(t) = √|t| + 5t³
    language: Autocode for the Manchester Mark 1 (Glennie)
    year: 1952
    note: The example from the Wikipedia article (the function from Knuth & Trabb Pardo's TPK benchmark). c@VA binds a variable to a machine address, → stores the lower accumulator, and the library square root is called as SUBROUTINE 6. The article notes it omits the scaling instructions real programs needed.
    code: |
      c@VA t@IC x@½C y@RC z@NC
      INTEGERS +5 →c      # Put 5 into c
            →t            # Load argument from lower accumulator
                          # to variable t
         +t     TESTA Z   # Put |t| into lower accumulator
         -t
                ENTRY Z
      SUBROUTINE 6 →z     # Run square root subroutine on
                          # lower accumulator value
                          # and put the result into z
        +tt →y →x         # Calculate t^3 and put it into x
        +tx →y →x
      +z+cx   CLOSE WRITE 1  # Put z + (c * x) into
                             # lower accumulator
                             # and return
    sources: [wiki-autocode, knuth-pardo-1976-early-development]

- id: a-0
  name: A-0 System
  kind: language
  category: scientific
  cluster: early/hopper
  origin:
    first_appeared: { year: 1952, precision: year }
    places: [{ institution: Remington Rand, city: Philadelphia, country: US }]
  creators: [{ name: Grace Hopper, role: designer }]
  status: extinct
  tags:
    features: [compiler, subroutine-library]
  summary: "For UNIVAC I. Translated a sequence of subroutine call numbers and arguments into a machine program; closer to a linker/loader than a modern compiler, but Hopper called it a compiler and the word stuck."
  relations:
    - { type: influenced_by, to: harvard-mark-i, weight: weak, confidence: medium, note: "Hopper's Mark I experience with reusable subroutines." }
  research_status: draft
  confidence: medium
  sources: [knuth-pardo-1976-early-development, wiki-a0]
  example:
    title: A program as a list of subroutine calls
    language: pseudocode (illustrative)
    note: 'Illustrative. An A-0 ''program'' was a sequence of call numbers for subroutines in a library on tape, with their arguments. A-0 copied the routines in and fixed up their addresses: in modern terms a linker more than a compiler.'
    code: |
      call  sub-07  (X, Y → T1)     # T1 = X × Y   (library: multiply)
      call  sub-12  (T1 → T2)       # T2 = √T1    (library: square root)
      call  sub-03  (T2)            # print T2
      stop
    sources: [wiki-a0]

- id: flow-matic
  name: FLOW-MATIC
  aliases: [B-0]
  kind: language
  category: business
