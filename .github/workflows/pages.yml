name: Pages

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "assets/media/**"
      - "schema/**"
      - "tools/build.py"
      - "viewer/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

# One deployment at a time; let a running one finish rather than cancel it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Validate dataset
        run: |
          python -m pip install --disable-pip-version-check pyyaml jsonschema
          python tools/build.py

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Node 25+ no longer ships corepack. Pinned version; yarn itself is then pinned by packageManager
      # in viewer/package.json and its dependencies by yarn.lock.
      - name: Install corepack
        run: npm install --global corepack@0.34.5 # zizmor: ignore[adhoc-packages]

      - name: Install viewer dependencies
        working-directory: viewer
        run: corepack yarn install --immutable

      - name: Type-check viewer
        working-directory: viewer
        run: |
          corepack yarn svelte-kit sync
          corepack yarn check

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build viewer
        working-directory: viewer
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: corepack yarn build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: viewer/build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the uploaded artifact to GitHub Pages
      id-token: write # OIDC token that deploy-pages uses to prove where the artifact came from
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
