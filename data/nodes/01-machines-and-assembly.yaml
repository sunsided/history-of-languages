    brackets with a plus sign separating the operands, instead of using a comma-separated list."
  relations:
    - { type: targets, to: sparc, weight: strong, confidence: high, sources: [wiki-sparc] }
  research_status: stub
  confidence: low
  links: { wikipedia: "https://en.wikipedia.org/wiki/SPARC" }
  sources: [wiki-sparc]
  example:
    title: "Loads and stores"
    language: "SPARC assembly"
    note: "From the Loads and stores section of Wikipedia's SPARC article."
    code: |
      ld [%L1+%L2],%L3  !load the 32-bit value at address %L1+%L2 and put the value into %L3
      ld [%L1+8],%L2    !load the value at %L1+8 into %L2
      ld [%L1],%L2      !as above, but no offset, which is the same as +%G0
      st %L1,[%I2]      !store the value in %L1 into the location stored in %I2
      st %G0,[%I1+8]    !clear the memory at %I1+8

- id: ucsd-p-code
