- id: pl-0
  name: PL/0
  kind: language
  category: educational
  cluster: education
  origin:
    first_appeared: { year: 1976, precision: year, note: "Wikipedia's body says Algorithms + Data Structures = Programs (1976); its reference list dates the book 1975. The Compilerbau booklet with the full compiler is December 1976." }
  creators:
    - { name: Niklaus Wirth, role: designer }
  status: historical
  tags:
    paradigm: [imperative, procedural, structured]
    domain: [education]
  milestones:
    - { version: "Compilerbau, 2nd ed.", year: 1986, summary: "The edition Wikipedia's example is taken from." }
  summary: >
    Niklaus Wirth's minimal teaching language for compiler construction, "originally introduced in the book Algorithms
    + Data Structures = Programs". "The only data types are integers." Later editions moved its syntax closer to
    Modula-2, and Wirth eventually "replaced PL/0 with Oberon-0".
  research_status: stub
  confidence: medium
  links: { wikipedia: "https://en.wikipedia.org/wiki/PL/0" }
  sources: [wiki-pl-0]
  example:
    title: Squares from 1 to 10
    language: PL/0 (Compilerbau, 1986)
    note: "From Wikipedia's PL/0 article; the fetched copy had lost its indentation, which is restored here. `!` writes a value; `CALL` invokes a parameterless procedure."
    sources: [wiki-pl-0]
    code: |
      VAR x, squ;

      PROCEDURE square;
      BEGIN
         squ:= x * x
      END;

      BEGIN
         x := 1;
         WHILE x <= 10 DO
         BEGIN
            CALL square;
            ! squ;
            x := x + 1
         END
      END.

