# Clusters are the collapsible subgraphs of the site AND the unit of research work.
# A cluster id is a path: `algol/wirth` is a child of `algol`. Collapsed, a cluster renders as one node with aggregated edges.
# research_status says how far the cluster has been unfolded:
#   stub     - placeholder; members may be missing entirely
#   draft    - core members present from secondary sources and HOPL papers; backlog lists what is missing
#   reviewed - every member checked against primary sources; backlog empty or explicitly deferred
# To unfold a cluster: work through its backlog and research_questions, add nodes, cite sources, then raise its status.

# ===================== Prehistory =====================
- id: prehistory
  name: Before computers
  summary: "Mechanisms, punched cards, notations and formalisms from antiquity to 1945."
  research_status: draft
- id: prehistory/mechanisms
  name: Calculating and automatic mechanisms
  parent: prehistory
  research_status: draft
  backlog:
    - { name: "Hero of Alexandria's programmable cart", year: 60, hint: "Rope-and-peg 'program' for a moving automaton; often cited as earliest programmable device. Confidence check needed." }
    - { name: "Al-Jazari's castle clock and musical automata", year: 1206, hint: "Book of Knowledge of Ingenious Mechanical Devices; pegged drums." }
    - { name: "Schickard calculating clock", year: 1623 }
    - { name: "Pascaline (Blaise Pascal)", year: 1642 }
    - { name: "Leibniz stepped reckoner", year: 1673, hint: "Also Leibniz's binary arithmetic (1703)." }
    - { name: "Vaucanson's automata", year: 1738 }
  research_questions:
    - "Where does 'computing' end and 'programming' begin? Proposed rule: a node is programmable if its behaviour can be changed without rebuilding it."
- id: prehistory/punched-cards
  name: Punched cards and paper tape
  parent: prehistory
  research_status: draft
  backlog:
    - { name: "Basile Bouchon's perforated-paper loom", year: 1725 }
    - { name: "Jean-Baptiste Falcon's punched-card loom", year: 1728 }
    - { name: "Semen Korsakov's punched-card information machines", year: 1832 }
    - { name: "IBM 80-column card", year: 1928 }
    - { name: "Plugboard programming (IBM 402 and unit-record equipment)", year: 1940 }
- id: prehistory/babbage
  name: Babbage and Lovelace
  parent: prehistory
  research_status: draft
  backlog:
    - { name: "Difference Engine No. 1", year: 1822 }
    - { name: "Babbage's own Analytical Engine 'programs' (1837 notebooks)", year: 1837, hint: "Predate Note G; relevant to the attribution debate." }
    - { name: "Percy Ludgate's analytical machine", year: 1909 }
  research_questions:
    - "Attribution of Note G: summarise the historiography (Stein, Fuegi & Francis 2003, Hollings/Martin/Rice 2018) neutrally for the side sheet."
- id: prehistory/formalisms
  name: Formal models of computation
  parent: prehistory
  research_status: draft
  backlog:
    - { name: "Frege's Begriffsschrift", year: 1879 }
    - { name: "Gödel's recursive functions", year: 1931 }
    - { name: "Post's production systems", year: 1936 }
    - { name: "Markov algorithms", year: 1954 }
    - { name: "McCulloch-Pitts neurons / finite automata", year: 1943 }

