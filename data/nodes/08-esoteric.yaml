# Esoteric languages that matter: each one demonstrates a real idea (minimal Turing-completeness, 2D control flow,
# combinators, invisible syntax, deliberate hostility). Selection criterion: is it cited as the origin of an esolang family
# or does it illustrate a computational concept? See clusters.yaml esoteric backlog for candidates.

- id: p-prime-prime
  name: P′′
  aliases: [P-double-prime]
  kind: formalism
  category: esoteric
  cluster: esoteric/minimal
  origin:
    first_appeared: { year: 1964, precision: year }
    places: [{ country: IT }]
  creators: [{ name: Corrado Böhm, role: designer }]
  status: historical
  summary: "Böhm's minimal language for a Turing machine with a tape, using only composition and a while-loop, proven Turing-complete. It is the first 'GOTO-less' structured language with a proof, and Brainfuck is almost exactly P′′ with I/O."
  research_status: draft
  confidence: high
  sources: [bohm-1964-p-prime-prime]
  example:
    title: Böhm's three operations
    language: P′′
    year: 1964
    note: P′′ has only R (move the head right), λ (increment the current symbol modulo the alphabet, then move left) and (q) (repeat q while the current symbol is not blank). Böhm proved this Turing-complete using only composition and iteration. Brainfuck maps onto it almost one to one.
    code: |
      P′′        brainfuck
      R          >
      λ          +<
      (q)        [q]

      R(λRR)     move right; then, while the cell is non-blank,
                 increment it, step back left, and move right twice
    sources: [bohm-1964-p-prime-prime]

- id: intercal
  name: INTERCAL
  kind: language
  category: esoteric
  cluster: esoteric/parody
  origin:
    first_appeared: { year: 1972, precision: year }
    places: [{ institution: Princeton University, city: Princeton, country: US }]
  creators: [{ name: Don Woods, role: designer }, { name: James M. Lyon, role: designer }]
  status: maintained
  tags:
    features: [come-from]
  summary: "The first esoteric language: a parody of the languages of its time, requiring the right amount of PLEASE. C-INTERCAL (1990) added COME FROM, the inverse of GOTO, which was itself a parody of Dijkstra's 'Go To Statement Considered Harmful'."
  relations:
    - { type: influenced_by, to: fortran, weight: weak, confidence: medium, note: "Parody target." }
    - { type: influenced_by, to: pl-i, weight: weak, confidence: medium, note: "Parody target." }
  research_status: draft
  confidence: high
  sources: [esolangs-intercal]
  example:
    title: "Adding two numbers, politely"
    language: "C-INTERCAL"
    note: "Assignment is <-, #5 is a constant and .1 a 16-bit variable. (1000) NEXT calls the system library's addition routine, leaving .1 + .2 in .3. READ OUT prints in Roman numerals (VIII). Too few PLEASEs and the compiler refuses the program as impolite; too many and it calls it excessively polite."
    code: |
      DO .1 <- #5
      DO .2 <- #3
      DO (1000) NEXT
      DO READ OUT .3
      PLEASE GIVE UP

