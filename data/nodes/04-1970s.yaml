- id: modula-2
  name: Modula-2
  kind: language
  category: systems
  cluster: algol/wirth
  origin:
    first_appeared: { year: 1978, precision: year, note: "Defined 1978, implemented 1979 for the Lilith workstation." }
    places: [{ institution: ETH Zürich, city: Zürich, country: CH }]
  creators: [{ name: Niklaus Wirth, role: designer }]
  status: legacy
  tags:
    paradigm: [imperative, structured, modular]
    typing: [static-typing, strong-typing]
    concurrency: [coroutines]
    features: [modules, separate-compilation]
  summary: "Pascal plus modules with explicit import/export and separate compilation, and coroutines for concurrency. Influenced Modula-3, Oberon, Ada and Python's module system indirectly."
  relations:
    - { type: successor_of, to: pascal, weight: strong, confidence: high }
    - { type: influenced_by, to: mesa, aspects: [modules], weight: strong, confidence: high }
  research_status: draft
  confidence: high
  sources: [wirth-2007-modula2-oberon]
  example:
    title: Modules with explicit imports
    language: Modula-2
    note: A definition module declares the interface; the implementation module and its clients import exactly what they use. Separate compilation is type-checked across modules.
    code: |
      DEFINITION MODULE Stack;
        PROCEDURE Push(x: INTEGER);
        PROCEDURE Pop(): INTEGER;
      END Stack.

      MODULE Main;
        FROM Stack IMPORT Push, Pop;
        FROM InOut IMPORT WriteInt, WriteLn;
      BEGIN
        Push(42); WriteInt(Pop(), 0); WriteLn
      END Main.
    sources: [wirth-2007-modula2-oberon]

- id: bourne-shell
  name: Bourne shell
  aliases: [sh]
  kind: language
  category: shell
  cluster: scripting/unix
  origin:
    first_appeared: { year: 1979, precision: year, note: "Released with Version 7 Unix." }
    places: [{ institution: Bell Labs, city: Murray Hill NJ, country: US }]
  creators: [{ name: Stephen R. Bourne, role: designer }]
  status: active
  tags:
    paradigm: [imperative, scripting]
    typing: [typeless]
    features: [pipes, command-substitution]
  summary: "Unix's scripting shell with control structures. Bourne used ALGOL 68C keywords (if/fi, case/esac) and even C macros to make the C source look like ALGOL. Ancestor of ksh, bash and POSIX sh."
  relations:
    - { type: influenced_by, to: algol-68, weight: moderate, confidence: high }
    - { type: successor_of, to: thompson-shell, weight: strong, confidence: high, sources: [wiki-thompson-shell], note: "\"the Thompson shell was replaced as the main Unix shell by the Bourne shell in Version 7 Unix\"." }
  research_status: draft
  confidence: high
  sources: [wiki-bourne-shell]
  example:
    title: Loops, tests and case/esac
    language: Bourne shell (POSIX sh)
    note: Keywords closed by their reversal (case/esac, if/fi) come from ALGOL 68. Pipes and command substitution make other programs the shell's functions. Tested with POSIX sh.
    code: |
      for f in *.c; do
        case "$f" in
          test_*) kind=test ;;
          *)      kind=source ;;
        esac
        if [ -s "$f" ]; then
          echo "$kind: $f ($(wc -l < "$f") lines)"
        fi
      done
