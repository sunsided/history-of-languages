- id: llvm-ir
  name: LLVM IR
  aliases: [LLVM assembly, LLVM bitcode]
  kind: assembly
  category: systems
  cluster: assembly/virtual
  origin:
    began: { year: 2000, precision: year, note: "\"The LLVM project started in 2000 at the University of Illinois Urbana-Champaign, under the direction of Vikram Adve and Chris Lattner.\"" }
    first_appeared: { year: 2003, precision: year, note: "Infobox release 2003; the CGO 2004 paper describes the representation." }
    places: [{ institution: University of Illinois Urbana-Champaign, city: Urbana, country: US }]
  creators:
    - { name: Chris Lattner, role: designer }
    - { name: Vikram Adve, role: designer }
  status: active
  tags:
    paradigm: [imperative]
    typing: [static-typing, strong-typing]
    memory: [manual-memory, pointers]
    features: [intermediate-code, jit-compilation, optimizing-compiler]
  summary: >
    "A Static Single Assignment (SSA) based representation that provides type safety, low-level operations,
    flexibility, and the capability of representing 'all' high-level languages cleanly", used in three forms:
    in-memory IR, on-disk bitcode and a readable assembly language. A typed, RISC-like target behind Clang, Rust,
    Swift, Julia and many more.
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/LLVM", homepage: "https://llvm.org" }
  sources: [llvm-langref, lattner-adve-2004-llvm, wiki-llvm]
  example:
    title: Hello, world
    language: LLVM IR
    note: "From Wikipedia's LLVM article; runs with lli (prints Hello, world). Globals start with @, SSA registers with %; getelementptr computes an address without touching memory. Indentation is ours."
    code: |
      @.str = internal constant [14 x i8] c"Hello, world\0A\00"
      declare i32 @printf(ptr, ...)
      define i32 @main(i32 %argc, ptr %argv) nounwind {
      entry:
        %tmp1 = getelementptr [14 x i8], ptr @.str, i32 0, i32 0
        %tmp2 = call i32 (ptr, ...) @printf( ptr %tmp1 ) nounwind
        ret i32 0
      }
    sources: [wiki-llvm]

