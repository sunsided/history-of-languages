    - { type: influenced_by, to: simula, weight: weak, confidence: medium }
  research_status: draft
  confidence: high
  links: { wikipedia: "https://en.wikipedia.org/wiki/Java_(programming_language)" }
  sources: [wiki-java, jep-444]
  example:
    title: Virtual threads instead of async/await
    language: Java 21
    note: Plain blocking code, but each task runs on a cheap virtual thread scheduled by the JVM, so 10,000 sleeping tasks need no async syntax. The try-with-resources block waits for all tasks to finish. Tested with Java 21.
    code: |
      import java.time.Duration;
      import java.util.concurrent.Executors;
      import java.util.stream.IntStream;

      public class Main {
          public static void main(String[] args) {
              try (var executor = Executors.newVirtualThreadPerTaskExecutor()) {
                  IntStream.range(0, 10_000).forEach(i ->
                      executor.submit(() -> {
                          Thread.sleep(Duration.ofSeconds(1));
                          return i;
                      }));
              }
              System.out.println("10,000 tasks, about one second");
          }
      }
    sources: [jep-444]

